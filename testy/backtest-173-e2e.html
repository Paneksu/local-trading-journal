<!doctype html>
<html lang="pl" data-theme="onyx">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<base href="/">
<title>JustJournal: auto BE i presety 1.7-3, odbiór na prawdziwych świecach</title>
<!-- Strona odbioru 1.7-3 (testy/backtest-e2e.mjs, sekcja `173`): prawdziwe świece NQ 1s (CPI 2024-03-12, 10:30-11:00 NY), serwer z atrapą Notion.
     Scenariusz karty: preset „Runner” (SL 15 pkt, TP 3R, auto BE 1R, ryzyko sesji) na prawdziwych świecach: wejście jednym kliknięciem (chip + Kup), wyzwolenie auto BE, wyjście po BE: trade z be = true,
     r = 0 i pnl = 0 (prowizja 0), pole „BE” w atrapie Notion = cena progu. Miejsce wejścia wybiera test: przeszukuje strumień świec silnikiem (ta sama funkcja co w replayu) i bierze pierwszy start,
     z którego pozycja przechodzi przez próg i kończy na stopie BE; replay musi dać identyczny wynik jak ta symulacja. Potem odtwarzanie 100× z uzbrojonym auto BE (znacznik, plakietka, kolumna szuflady):
     najwyżej 1% klatek dłuższych niż 34 ms i żadna dłuższa niż 100 ms.
     Wynik: pre#wynik z JSON-em { checks: [{ tag, ok, msg }], info, fatal }. Każda asercja może zawieść. -->
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/features.css">
<style>
  body { margin: 0; background: var(--chrome); color: var(--fg); }
  #wynik { white-space: pre-wrap; font: 12px ui-monospace, Consolas, monospace; }
</style>
</head>
<body>
<pre id="wynik">…</pre>
<script type="module">
const out = document.getElementById('wynik');
const checks = [], info = {};
const rec = (tag, cond, msg) => checks.push({ tag, ok: !!cond, msg });
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
window.addEventListener('error', (e) => rec('błąd strony', false, e.error?.stack || e.message));
window.addEventListener('unhandledrejection', (e) => rec('błąd strony', false, String(e.reason?.stack || e.reason)));
const section = async (tag, fn) => { try { await fn(); } catch (e) { rec(tag, false, `sekcja przerwana: ${e && e.stack || e}`); } };

try {
  try { localStorage.removeItem('thq.bt.open.v1'); localStorage.removeItem('thq.bt.dock.v1'); localStorage.removeItem('thq.bt.ord.v1'); localStorage.setItem('thq.chart.overlays.v1', JSON.stringify({ sessions: false, pdhl: false })); } catch { /* bez localStorage */ }
  const { openReplay } = await import('/js/bt-replay.js');
  const { createSessionClient, newSessionId } = await import('/js/bt-klient.js');
  const { newSessionDoc } = await import('/js/bt-kreator.js');
  const { nyAt, sanitizeBt } = await import('/js/bt-czas.js');
  const { visibleCount } = await import('/js/bt-swieca.js');
  const W = await import('/js/bt-wypelnienia.js');
  const DAY = '2024-03-12';
  const client = createSessionClient();
  const doc = newSessionDoc({
    id: newSessionId(), name: 'Sesja 173 odbiór',
    def: { instruments: ['NQ'], from: DAY, balance: 50000, risk: { mode: 'pct', value: 5 }, riskBase: 'current', commission: 0, startTime: '09:00', accountId: null, filter: null, excluded: [] },
    now: Date.now(),
  });
  doc.layout = { kind: '1', active: 0, charts: [{ instrument: 'NQ', tf: '1s' }] };
  await client.create(doc);
  // preset „Runner” z karty: SL 15 pkt, TP 3R, ryzyko sesji, auto BE 1R
  let btSet = sanitizeBt({ presets: [{ id: 'runner', name: 'Runner', sl: { unit: 'pts', value: 15 }, tps: [{ unit: 'rr', value: 3, pct: 100 }], size: { mode: 'session', value: 0 }, autoBe: { kind: 'r', value: 1, offsetTicks: 0 } }] });
  const openOne = async (d) => {
    const r = openReplay(document.body, { sessionId: d.id, client, onClosed: () => {}, notionEveryMs: 0, getSettings: () => btSet, onPresets: (patch) => { btSet = sanitizeBt({ ...btSet, ...patch }); } });
    await r.ready;
    return r;
  };
  let RP = await openOne(doc);
  info.sessionId = doc.id;
  const scr = () => document.querySelector('.bt-screen');
  const P = (sel) => scr().querySelector(`.bt-ord ${sel}`);
  const pos = () => RP.book().positions.NQ;
  const ch = () => RP.chart();
  const q = (x) => Math.round(x / 0.25) * 0.25;

  await RP.goTo(nyAt(DAY, '10:30')); await sleep(150);
  const st = RP.data().stream('NQ');
  info.baseBars = st.bars.length;

  // symulacja silnikiem na świecach (ta sama funkcja co w replayu): wejście na zamknięciu świecy i, preset Runner (ilość z ryzyka sesji 5% z 50 000 $ = 2 500 $ / 300 $ = 8)
  const sim = (i, side) => {
    const bar = st.bars[i], t = bar[0] + st.len[i], price = bar[4], dir = side === 'buy' ? 1 : -1;
    const order = { instrument: 'NQ', side, type: 'market', qty: 8, sl: q(price - dir * 15), tp: q(price + dir * 45), autoBe: { kind: 'r', value: 1, offsetTicks: 0 } };
    const r0 = W.placeOrder(W.emptyBook(), order, { t, price });
    if (!r0.book.positions.NQ) return null;
    const r = W.advance(r0.book, 'NQ', st, nyAt(DAY, '11:00'));
    const be = r.events.find((e) => e.type === 'be-auto'), closed = r.events.find((e) => e.type === 'closed')?.position;
    return { i, t, side, price, order, be, closed, events: r.events };
  };
  await section('przebieg', async () => {
    // pierwszy start 10:30-10:50, z którego pozycja przechodzi przez próg 1R i kończy na stopie BE (wyjście po cenie wejścia)
    let found = null;
    const i0 = visibleCount(st, nyAt(DAY, '10:30')), i1 = visibleCount(st, nyAt(DAY, '10:50'));
    for (let i = i0; i < i1 && !found; i += 15) for (const side of ['buy', 'sell']) {
      const s = sim(i, side);
      if (s?.be && s.closed && s.closed.exits.length === 1 && s.closed.exits[0].reason === 'sl' && s.closed.exits[0].price === s.closed.avg && s.closed.be === true) { found = s; break; }
    }
    rec('przebieg', !!found, `na prawdziwych świecach jest start (10:30-10:50), z którego pozycja przechodzi przez próg i kończy na stopie BE: ${found ? `${found.side} od ${new Date(found.t * 1000).toISOString()} (świeca ${found.i})` : 'brak'}`);
    if (!found) return;
    info.sim = { t: found.t, side: found.side, entry: found.price, beAt: found.be.price, slBe: found.be.sl, exit: found.closed.exits[0].price };
    // wejście jednym kliknięciem przy aktywnym presecie: chip „Runner”, potem Kup albo Sprzedaj
    await RP.goTo(found.t); await sleep(150);
    P('[data-pr="runner"]').click(); await sleep(120);
    rec('przebieg', P('[data-pr="runner"]').getAttribute('aria-pressed') === 'true' && P('[name="sl"]').value === '15' && P('[name="tp"]').value === '45' && P('[name="abeOn"]').checked, 'chip Runner wypełnił SL 15, TP 45 (3R) i włączył auto BE');
    P(`[data-o="${found.side}"]`).click(); await sleep(150);
    const p = pos();
    rec('przebieg', !!p && p.qty === 8 && p.entryPrice === found.price && p.sl === found.order.sl && p.tp === found.order.tp && p.autoBe?.kind === 'r' && p.autoBe.value === 1 && p.autoBe.done === false, `jedno kliknięcie: ${p?.dir} ${p?.qty} @ ${p?.entryPrice}, SL ${p?.sl}, TP ${p?.tp}, auto BE ${JSON.stringify(p?.autoBe)}`);
    const abe0 = W.autoBePrice(p);
    rec('przebieg', abe0 === found.be.price && !!ch().tradeLayer().querySelector('[data-k="pbe"]'), `znacznik progu na wykresie: ${abe0} (symulacja ${found.be.price})`);
    // odtwarzanie 100× aż do zamknięcia (maks. 90 s)
    let firedAt = null;
    const t0 = performance.now();
    await new Promise((done) => {
      const loop = () => {
        if (firedAt == null && pos()?.autoBe?.done) firedAt = RP.cursor();
        if (!pos() || performance.now() - t0 > 90000) { RP.pause(); done(); return; }
        requestAnimationFrame(loop);
      };
      RP.setSpeed(100); RP.play();
      requestAnimationFrame(loop);
    });
    await sleep(250);
    const tr = RP.doc().trades.at(-1);
    rec('przebieg', !pos() && !!tr, `pozycja zamknięta w odtwarzaniu (trade ${tr?.id})`);
    rec('przebieg', tr.be === true && tr.beAt === found.be.price && tr.exits.length === 1 && tr.exits[0].reason === 'sl' && tr.exits[0].price === found.closed.exits[0].price, `trade: be ${tr.be}, beAt ${tr.beAt}, wyjście ${tr.exits[0]?.reason} @ ${tr.exits[0]?.price} (symulacja ${found.closed.exits[0].price})`);
    rec('przebieg', tr.r === 0 && tr.pnl === 0 && tr.fee === 0, `wyjście po BE: r ${tr.r}, pnl ${tr.pnl}, prowizja ${tr.fee}`);
    rec('przebieg', tr.log.some((x) => x.k === 'be-auto' && x.v.price === found.be.price && x.v.sl === found.be.sl) && tr.autoBe.done === true, `log trade'a ma wyzwolenie be-auto: ${JSON.stringify(tr.log.filter((x) => x.k === 'be-auto'))}`);
    rec('przebieg', firedAt != null && firedAt <= tr.exitT, 'wyzwolenie zaobserwowane przed zamknięciem');
    info.trades = [{ id: tr.id, r: tr.r, pnl: tr.pnl, entryPrice: tr.entryPrice, exitPrice: tr.exitPrice, beAt: tr.beAt, sl0: tr.sl0 }];
    for (let i = 0; i < 100 && RP.doc().trades.find((x) => x.id === tr.id)?.notion?.state !== 'sent'; i++) await sleep(50);
    rec('przebieg', RP.doc().trades.find((x) => x.id === tr.id)?.notion?.state === 'sent', `trade ${tr.id} w atrapie Notion (stan ${RP.doc().trades.find((x) => x.id === tr.id)?.notion?.state})`);
    info.sentIds = [tr.id];
  });

  await section('klatki', async () => {
    // odtwarzanie 100× z uzbrojonym auto-BE (znacznik progu, plakietka, linia BE w strefie pozycji, kolumna szuflady): pozycja z SL 400 pkt i progiem 400 pkt się nie wyzwala
    // nowa sesja: cofnięcie kursora w pierwszej zablokowałoby handel („przeglądasz wstecz”)
    RP.close(); await sleep(200);
    const doc2 = newSessionDoc({ id: newSessionId(), name: 'Sesja 173 klatki', def: doc.def, now: Date.now() });
    doc2.layout = { kind: '1', active: 0, charts: [{ instrument: 'NQ', tf: '1s' }] };
    await client.create(doc2);
    RP = await openOne(doc2);
    await RP.goTo(nyAt(DAY, '10:30')); await sleep(150);
    P('[data-pr=""]').click(); await sleep(60);
    const setF = (n, v) => { const el = P(`[name="${n}"]`); el.value = String(v); el.dispatchEvent(new Event('input', { bubbles: true })); };
    setF('sl', 400); setF('tp', 800); setF('qty', 2);
    if (!P('[name="abeOn"]').checked) P('[name="abeOn"]').click();
    P('[data-abek="pts"]').click(); setF('abeVal', 400);
    P('[data-o="buy"]').click(); await sleep(150);
    rec('klatki', !!pos() && pos().autoBe?.kind === 'pts' && pos().autoBe.value === 400 && !pos().autoBe.done, `pozycja z uzbrojonym auto BE: ${JSON.stringify(pos()?.autoBe)}`);
    RP.dock().setTab('pos'); await sleep(100);
    rec('klatki', !!ch().tradeLayer().querySelector('[data-k="pbe"]') && !!RP.dock().el.querySelector('.bt-dk-abet')?.textContent.startsWith('przy +400 pkt'), 'plakietka progu i kolumna szuflady widoczne podczas odtwarzania');
    const end = nyAt(DAY, '11:00');
    RP.setSpeed(100);
    const ts = [], t0 = performance.now();
    await new Promise((done) => {
      const loop = (t) => {
        ts.push(t);
        if (RP.cursor() >= end || !pos() || performance.now() - t0 > 90000) { RP.pause(); done(); return; }
        requestAnimationFrame(loop);
      };
      RP.play();
      requestAnimationFrame(loop);
    });
    const gaps = []; for (let i = 11; i < ts.length; i++) gaps.push(ts[i] - ts[i - 1]);
    let worst = 0; for (const g of gaps) if (g > worst) worst = g;
    const slow = gaps.filter((g) => g > 34).length;
    info.frames = gaps.length; info.slow = slow; info.worst = worst;
    rec('klatki', gaps.length > 30, `odtwarzanie zmierzyło ${gaps.length} klatek`);
    rec('klatki', !!pos() && !pos().autoBe.done, 'pozycja z uzbrojonym progiem przeżyła odtwarzanie');
    // konwencja repo z pakietu 1 (§9, decyzja sesji głównej 2.11.2026): ≤ 1% klatek > 34 ms i żadna klatka > 100 ms
    rec('klatki', slow / gaps.length <= 0.01, `klatki > 34 ms: ${slow} z ${gaps.length} (próg 1%); najdłuższa ${worst.toFixed(1)} ms`);
    rec('klatki', worst <= 100, `żadna klatka > 100 ms (najdłuższa ${worst.toFixed(1)} ms)`);
  });

  out.textContent = JSON.stringify({ checks, info });
} catch (e) {
  out.textContent = JSON.stringify({ checks, info, fatal: String(e && e.stack || e) });
}
</script>
</body>
</html>
