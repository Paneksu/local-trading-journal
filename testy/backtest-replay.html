<!doctype html>
<html lang="pl" data-theme="onyx">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>JustJournal: replay backtestu C1 (strona robocza)</title>
<!-- Strona robocza testu backtest-C1 (testy/backtest-C1-ekran.mjs, Chrome/Edge headless przez CDP, czas rzeczywisty), podawana tylko przez dashboard testowy
     (THQ_TEST_PAGES=1) pod /__testy/. Serwer testowy ma w THQ_CONFIG_DIR wyłącznie świece syntetyczne (testy/bt-dane-syntetyczne.mjs), dni 2024-03-12 i 2024-03-13.
     K (31.10.2026): ciągła oś czasu, dane z prawdziwych /api/backtest/range i /bounds. Prawdziwe moduły: bt-kreator.js, bt-widok.js, bt-replay.js, bt-wykres.js, bt-dane.js.
     Wynik: pre#wynik z JSON-em { checks: [{ tag, ok, msg }], perf }. ?theme=platinum przełącza motyw (zrzuty). ?shot=1 zostawia otwarty ekran replayu. -->
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/features.css">
<style>
  body { margin: 0; padding: 16px; background: var(--chrome); color: var(--fg); }
  #wynik { white-space: pre-wrap; font: 12px ui-monospace, Consolas, monospace; }
</style>
</head>
<body>
<section class="sec" id="k"></section>
<section class="sec bt-view" id="l"></section>
<section class="sec bt-view" id="l0"></section>
<pre id="wynik">…</pre>
<script type="module">
const out = document.getElementById('wynik');
const qs = new URLSearchParams(location.search);
if (qs.get('theme') === 'platinum') document.documentElement.setAttribute('data-theme', 'platinum');
const checks = [], perf = {};
const rec = (tag, cond, msg) => checks.push({ tag, ok: !!cond, msg });
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const until = async (fn, ms = 8000) => { const t0 = performance.now(); while (performance.now() - t0 < ms) { const v = await fn(); if (v) return v; await sleep(25); } return null; };
window.addEventListener('error', (e) => rec('błąd strony', false, e.error?.stack || e.message));
window.addEventListener('unhandledrejection', (e) => rec('błąd strony', false, String(e.reason?.stack || e.reason)));
const section = async (tag, fn) => { try { await fn(); } catch (e) { rec(tag, false, `sekcja przerwana: ${e && e.stack || e}`); } };
const getJson = async (u) => (await fetch(u, { cache: 'no-store' })).json();
const p95 = (xs) => { const s = [...xs].sort((a, b) => a - b); return s[Math.min(s.length - 1, Math.floor(s.length * 0.95))]; };

try {
  localStorage.setItem('thq.chart.overlays.v1', JSON.stringify({ sessions: true, pdhl: true, news: true })); // nakładki włączone: najcięższy przypadek
  localStorage.removeItem('thq.bt.open.v1');
  window.__btStats = { setData: 0, update: 0 };
  const { openKreator } = await import('/js/bt-kreator.js');
  const { createBacktestView } = await import('/js/bt-widok.js');
  const { openReplay, OPEN_KEY } = await import('/js/bt-replay.js');
  const { createSessionClient } = await import('/js/bt-klient.js');
  const { nyAt } = await import('/js/bt-czas.js');
  const { candlesAt } = await import('/js/bt-swieca.js');
  const client = createSessionClient();
  // syntetyczny plan dnia (serwer testowy nie pobiera newsów): dokładany do odpowiedzi zakresu, przechodzi przez visibleNews i newsPrimitive
  const NEWS = [
    { t: nyAt('2024-03-12', '08:30'), day: '2024-03-12', name: 'CPI m/m', imp: 'high', kind: 'news', actual: '0.4%', forecast: '0.3%' },
    { t: nyAt('2024-03-12', '10:00'), day: '2024-03-12', name: 'JOLTS', imp: 'medium', kind: 'news', actual: '8.7M' },
  ];
  const loadRange = async (q) => { const r = await client.range(q); r.news = NEWS.filter((e) => e.t >= q.from && e.t < q.to); return r; };
  const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  const docs = {};
  const live = () => same(R.chart().liveBars(), candlesAt(R.data().stream('NQ'), R.chart() && document.querySelector('.bt-screen .bt-tf').value, R.cursor()));

  // ---- formularz klasyczny ----
  async function create(name, from = '2024-03-12') {
    const host = document.getElementById('k');
    let created = null;
    const k = openKreator(host, { client, onCreated: (d) => { created = d; }, onCancel: () => {} });
    const f = k.form;
    const set = (n, v) => { f.querySelector(`[name="${n}"]`).value = v; };
    set('name', name); set('from', from); set('balance', '50000'); set('risk', '1');
    f.querySelector('[data-k="riskMode"] [data-v="pct"]').click();
    f.requestSubmit();
    await until(() => created || (f.querySelector('.bt-err').textContent.match(/Nie udało|nie ma świec/) && 'err'));
    return { created, f, host };
  }
  await section('formularz', async () => {
    const host = document.getElementById('k');
    const k = openKreator(host, { client });
    const f = k.form;
    for (const n of ['name', 'from', 'balance', 'risk', 'startTime', 'account']) rec('formularz', f.querySelector(`[name="${n}"]`), `pole ${n}`);
    rec('formularz', !f.querySelector('[name="to"]') && !f.querySelector('[data-k="order"]'), 'K: bez pola „do” i bez kolejności dni');
    rec('formularz', /końca danych/.test(f.querySelector('.bt-fhint')?.textContent || ''), 'notka: od daty startu do końca danych');
    rec('formularz', f.querySelectorAll('[name="inst"]').length === 4, 'instrumenty ES, NQ, MES, MNQ');
    rec('formularz', f.querySelector('[name="startTime"]').value === '09:00', `godzina startu domyślnie 09:00: ${f.querySelector('[name="startTime"]').value}`);
    rec('formularz', same([...f.querySelectorAll('[data-k="riskMode"] button')].map((b) => b.dataset.v), ['usd', 'pct']), 'ryzyko USD albo % salda');
    const adv = f.querySelector('details.bt-adv');
    rec('formularz', adv && !adv.open, 'filtr zaawansowany zwinięty');
    f.requestSubmit();
    await sleep(50);
    rec('formularz', f.querySelector('[name="name"]').getAttribute('aria-invalid') === 'true' && f.querySelector('.bt-err').textContent.length > 0, 'pusta nazwa odrzucona');
    k.destroy();
    const late = await create('Za późno', '2024-03-20');
    rec('formularz', !late.created && /nie ma świec/.test(late.f.querySelector('.bt-err').textContent), `start po końcu danych odrzucony: ${late.f.querySelector('.bt-err').textContent}`);
    late.host.innerHTML = '';
    const a = await create('Sesja C1');
    rec('formularz', a.created, `sesja utworzona: ${a.f.querySelector('.bt-err').textContent}`);
    const disk = await getJson(`/api/backtest/session/${a.created.id}`);
    rec('formularz', disk.v === 2 && disk.rev === 1 && disk.def.from === '2024-03-12' && !('to' in disk.def) && !('pool' in disk) && !('days' in disk) && disk.def.risk.mode === 'pct' && disk.def.startTime === '09:00', `zapis na dysku (v2): ${JSON.stringify(disk.def)}`);
    docs.a = disk;
    a.host.innerHTML = '';
  });

  // ---- lista sesji i widok pusty ----
  await section('lista', async () => {
    const v0 = createBacktestView({ client: { list: async () => [] }, storage: null });
    v0.mount(document.getElementById('l0'));
    const e = await until(() => document.querySelector('#l0 .empty [data-bt="new"]'));
    rec('lista', e && /Nowa sesja/.test(e.textContent), 'widok pusty: .empty z przyciskiem „Nowa sesja”');
    const v = createBacktestView({ client, storage: null, open: () => ({ close() {} }) });
    v.mount(document.getElementById('l'));
    const rows = await until(() => (document.querySelectorAll('#l tbody tr').length === 1 ? document.querySelectorAll('#l tbody tr') : null));
    rec('lista', rows, 'jedna sesja na liście');
    const txt = rows ? [...rows].map((r) => r.textContent).join('|') : '';
    rec('lista', /Sesja C1/.test(txt) && /2024/.test(txt) && /NQ/.test(txt) && !/0 \/ /.test(txt), `wiersz: start → teraz, bez puli: ${txt.replace(/\s+/g, ' ').slice(0, 200)}`);
    rec('lista', document.querySelector('#l [data-bt="stats"]'), 'miejsce na „Statystyki”');
    document.getElementById('l0').innerHTML = '';
  });

  // ---- ekran replayu ----
  let R = null;
  const btn = (b) => document.querySelector(`.bt-screen [data-bt="${b}"]`);
  const c0 = nyAt('2024-03-12', '09:00');
  await section('start', async () => {
    R = openReplay(document.body, { sessionId: docs.a.id, client, loadRange });
    await R.ready;
    rec('start', R.cursor() === c0, `kursor = 9:00 NY: ${R.cursor()} vs ${c0}`);
    await until(() => R.chart().history().bars > 0 || R.chart().history().done, 4000);
    const bars = R.chart().bars();
    rec('start', bars.length > 1000, `historia + okno: ${bars.length} świec`);
    rec('start', bars.every((b) => b[0] < R.cursor()), 'żadnej świecy o t ≥ kursor');
    rec('start', R.chart().history().done && bars[0][0] <= nyAt('2024-03-10', '18:00'), `historia do początku danych: ${new Date(bars[0][0] * 1000).toISOString()}`);
    rec('start', live(), 'świece okna = candlesAt');
    rec('start', document.querySelector('.bt-screen .bt-name').textContent === 'Sesja C1', 'pasek: nazwa sesji');
    rec('start', !document.querySelector('.bt-screen .bt-dayn') && !btn('end-day') && !document.querySelector('.bt-screen .bt-fin'), 'K: bez „Dzień i / n”, „Zakończ dzień” i ekranu „Sesja ukończona”');
    // L: wynik sesji w $, % i R (decyzja 6)
    rec('start', /^Sesja 0.*0([,.]0+)?R · 0 /.test(document.querySelector('.bt-screen .bt-res').textContent), `pasek: wynik sesji: ${document.querySelector('.bt-screen .bt-res').textContent}`);
    rec('start', /^Notion: zapisane$/.test(document.querySelector('.bt-screen .bt-notion').textContent), 'pasek: Notion bez zaległości (M: stan zamiast licznika 0)');
    rec('start', /2024/.test(document.querySelector('.bt-screen .bt-date').textContent), 'data widoczna zawsze');
    rec('start', document.querySelectorAll('.bt-screen .bt-cell').length === 1 && document.querySelector('.bt-screen [data-layout="1"]').getAttribute('aria-pressed') === 'true', 'układ: 1 wykres');
    // L: szuflada pozycji wypełniona i widoczna (zastępuje „miejsce na dolny panel, ukryte”)
    rec('start', document.querySelector('.bt-screen .bt-dock')?.hidden === false && !!document.querySelector('.bt-screen .bt-dock [data-dk="pos"]'), 'szuflada pozycji (pakiet L)');
  });

  await section('krok', async () => {
    btn('step').click();
    rec('krok', R.cursor() === c0 + 60, `krok 1m: ${R.cursor() - c0}`);
    rec('krok', live(), 'po kroku świece = candlesAt');
    btn('back').click();
    rec('krok', R.cursor() === c0, 'krok wstecz');
    btn('back').click();
    rec('krok', R.cursor() === c0, 'nie przed datę i godzinę startu');
  });

  await section('setData', async () => {
    window.__btStats = { setData: 0, update: 0 };
    const times = [];
    for (let i = 0; i < 100; i++) { const t0 = performance.now(); btn('step').click(); times.push(performance.now() - t0); }
    rec('setData', window.__btStats.setData === 0, `setData przy 100 krokach: ${window.__btStats.setData}`);
    rec('setData', window.__btStats.update >= 100, `update przy 100 krokach: ${window.__btStats.update}`);
    rec('setData', R.cursor() === c0 + 6000, `100 kroków 1m: ${R.cursor() - c0}`);
    rec('setData', live(), 'po 100 krokach świece = candlesAt');
    perf.step1m = p95(times);
  });

  await section('play', async () => {
    const a = R.cursor();
    btn('play').click();
    rec('play', btn('play').getAttribute('aria-pressed') === 'true', 'play wciśnięty');
    await sleep(500);
    btn('play').click();
    const d = R.cursor() - a;
    rec('play', d >= 40 && d <= 60, `100× przez 500 ms: ${d.toFixed(1)} s`);
    const b = R.cursor();
    await sleep(200);
    rec('play', R.cursor() === b, 'pauza zatrzymuje');
    rec('play', R.chart().bars().every((x) => x[0] < R.cursor()), 'po odtwarzaniu bez przyszłości');
  });

  await section('tf15s', async () => {
    const t910 = nyAt('2024-03-12', '09:10');
    await R.goTo(t910);
    rec('tf15s', R.cursor() === t910, `kursor 9:10: ${R.cursor() - t910}`);
    const sel = document.querySelector('.bt-screen .bt-tf');
    sel.value = '15s'; sel.dispatchEvent(new Event('change', { bubbles: true }));
    const note = document.querySelector('.bt-screen .bt-secnote');
    rec('tf15s', !note.hidden && /9:30/.test(note.textContent), 'notka „sekundy od 9:30” przy 9:10 na 15s');
    rec('tf15s', live(), '15s przed 9:30: świece = candlesAt (minutowe)');
    let n = 0;
    while (R.cursor() < nyAt('2024-03-12', '09:30') && n < 100) { btn('step').click(); n++; }
    rec('tf15s', n === 20, `przed 9:30 krok 15s = minuta: ${n} kroków`);
    rec('tf15s', note.hidden, 'o 9:30 notka znika');
    btn('step').click();
    rec('tf15s', R.cursor() === nyAt('2024-03-12', '09:30') + 15, 'w oknie 1s krok 15 s');
    rec('tf15s', live(), 'w oknie 1s: świece = candlesAt');
  });

  await section('koszt', async () => {
    const measure = (n) => new Promise((done) => {
      const xs = [];
      const one = () => requestAnimationFrame(() => {
        const t0 = performance.now(); btn('step').click(); const t1 = performance.now();
        requestAnimationFrame((ts) => { xs.push((t1 - t0) + (performance.now() - ts)); if (xs.length < n) one(); else done(p95(xs)); });
      });
      one();
    });
    perf.step15s = await measure(200);
    const sel = document.querySelector('.bt-screen .bt-tf');
    sel.value = '1s'; sel.dispatchEvent(new Event('change', { bubbles: true }));
    perf.step1s = await measure(200);
    sel.value = '1m'; sel.dispatchEvent(new Event('change', { bubbles: true }));
    perf.step1m = await measure(100);
    sel.value = '1s'; sel.dispatchEvent(new Event('change', { bubbles: true }));
    rec('koszt', live(), '1s: świece = candlesAt');
    for (const k of ['step1m', 'step15s', 'step1s']) rec('koszt', perf[k] <= 16, `p95 kroku ${k}: ${perf[k]?.toFixed(2)} ms (próg §9: 16 ms)`);
  });

  await section('zapis', async () => {
    const cur = R.cursor();
    window.dispatchEvent(new PageTransitionEvent('pagehide'));
    const saved = await until(async () => { const d = await getJson(`/api/backtest/session/${docs.a.id}`); return d.cursor === cur ? d : null; }, 900);
    rec('zapis', saved, 'pagehide zapisuje kursor przed upływem 1 s');
    rec('zapis', localStorage.getItem(OPEN_KEY) === docs.a.id, 'otwarta sesja zapamiętana');
    R.close();
    rec('zapis', !document.querySelector('.bt-screen') && localStorage.getItem(OPEN_KEY) === null, 'zamknięcie usuwa ekran');
    const d = await until(async () => { const x = await getJson(`/api/backtest/session/${docs.a.id}`); return x.cursor === cur ? x : null; });
    rec('zapis', d && d.v === 2 && !('dayIdx' in d) && d.layout.charts[0].tf === '1s', `stan na dysku: ${JSON.stringify(d && { c: d.cursor - c0, v: d.v, tf: d.layout?.charts?.[0]?.tf })}`);
    R = openReplay(document.body, { sessionId: docs.a.id, client: createSessionClient(), loadRange });
    await R.ready;
    rec('zapis', R.cursor() === cur, `po ponownym otwarciu ten sam kursor: ${R.cursor() - cur}`);
    rec('zapis', document.querySelector('.bt-screen .bt-tf').value === '1s', 'ten sam TF');
  });

  // K: [U] 31.10.2026 «nie powinno byc takiego czegos jak koniec dnia»: kursor idzie przez 16:00, przerwę 17–18 NY i noc do następnego dnia i dalej do końca danych
  await section('ciagly', async () => {
    const sel = document.querySelector('.bt-screen .bt-tf');
    sel.value = '1m'; sel.dispatchEvent(new Event('change', { bubbles: true }));
    const e16 = nyAt('2024-03-12', '17:00'); // koniec sesji CME (17:00 NY), potem przerwa do 18:00
    await R.goTo(e16 - 60);
    btn('step').click();
    rec('ciagly', R.cursor() === e16, `17:00: ${R.cursor() - e16}`);
    btn('step').click();
    const n18 = nyAt('2024-03-12', '18:00');
    rec('ciagly', R.cursor() === n18 + 60, `krok przez przerwę 17–18 NY: 18:01 (${(R.cursor() - n18) / 60} min po 18:00)`);
    rec('ciagly', R.chart().bars().every((x) => x[0] < R.cursor()) && live(), 'w nocy bez przyszłości, świece = candlesAt');
    rec('ciagly', /2024/.test(document.querySelector('.bt-screen .bt-date').textContent), 'data dnia NY w pasku');
    btn('back').click();
    btn('back').click();
    rec('ciagly', R.cursor() === e16, `dwa kroki wstecz (18:01 → 18:00 → przez przerwę) wracają na 17:00: ${R.cursor() - e16}`);
    await R.runJump('nySession');
    rec('ciagly', R.cursor() === nyAt('2024-03-13', '09:00'), `skok „Następna sesja NY” = następny dzień o godzinie startu: ${new Date(R.cursor() * 1000).toISOString()}`);
    await R.runJump('plus15');
    rec('ciagly', R.cursor() === nyAt('2024-03-13', '09:15'), '+15 min');
    // odtwarzanie do końca danych: stop i komunikat, bez ekranu końca dnia
    await R.goTo(nyAt('2024-03-13', '15:58'));
    R.setSpeed(300); btn('play').click();
    await until(() => btn('play').getAttribute('aria-pressed') === 'false', 3000);
    const end = nyAt('2024-03-13', '16:00');
    rec('ciagly', R.cursor() === end, `odtwarzanie staje na końcu danych: ${R.cursor() - end}`);
    rec('ciagly', /Koniec danych/.test(document.querySelector('.bt-screen .bt-msg').textContent), 'komunikat „Koniec danych”');
    btn('step').click();
    rec('ciagly', R.cursor() === end, 'krok za końcem danych nic nie robi');
    if (qs.get('shot') !== '1') R.close();
  });
  out.textContent = JSON.stringify({ checks, perf });
} catch (e) {
  out.textContent = JSON.stringify({ fatal: String(e && e.stack || e), checks, perf });
}
</script>
</body>
</html>
