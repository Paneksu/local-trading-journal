<!doctype html>
<html lang="pl" data-theme="onyx">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>JustJournal: wydajność replayu backtestu H1 (strona robocza)</title>
<!-- Strona robocza odbioru H1 (testy/backtest-e2e.mjs, uruchamiany osobno od run.mjs), Chrome/Edge headless przez CDP, czas rzeczywisty, podawana tylko przez dashboard
     testowy (THQ_TEST_PAGES=1) pod /__testy/. Serwer testowy czyta KOPIĘ prawdziwych świec (TEST_CONFIG_DIR, narzedzia/kopia-swiec-odbior.mjs) i atrapę Notion.
     Progi §9: krok ≤ 16 ms p95 (500 kroków, NQ 15s + ES 1m), odtwarzanie 100× przez 90 min (klatki > 34 ms w ≤ 1%, żadna > 100 ms), skok do następnego dnia ≤ 1,5 s
     (mediana z 5 dni, z pobraniem dnia). Prawdziwe moduły: bt-replay.js, bt-wykres.js, bt-klient.js. Wynik: pre#wynik z JSON-em { checks: [{ tag, ok, msg }], perf }. -->
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/features.css">
<style>
  body { margin: 0; padding: 16px; background: var(--chrome); color: var(--fg); }
  #wynik { white-space: pre-wrap; font: 12px ui-monospace, Consolas, monospace; }
</style>
</head>
<body>
<pre id="wynik">…</pre>
<script type="module">
const out = document.getElementById('wynik');
const checks = [], perf = {};
const rec = (tag, cond, msg) => checks.push({ tag, ok: !!cond, msg });
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const frame = () => new Promise((r) => requestAnimationFrame(r));
window.addEventListener('error', (e) => rec('błąd strony', false, e.error?.stack || e.message));
window.addEventListener('unhandledrejection', (e) => rec('błąd strony', false, String(e.reason?.stack || e.reason)));
const section = async (tag, fn) => { try { await fn(); } catch (e) { rec(tag, false, `sekcja przerwana: ${e && e.stack || e}`); } };
const pct = (xs, p) => { const s = [...xs].sort((a, b) => a - b); return s[Math.min(s.length - 1, Math.floor(s.length * p))]; };
const median = (xs) => { const s = [...xs].sort((a, b) => a - b); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };

const DAY = '2024-03-12';
// K (31.10.2026): skoki „Następna sesja NY” idą kolejno po dniach handlowych od wtorku 2024-03-12 (także przez weekend)
try {
  for (const k of ['thq.bt.open.v1', 'thq.bt.jump.v1', 'thq.bt.layout.v1']) localStorage.removeItem(k);
  const { openReplay } = await import('/js/bt-replay.js');
  const { createSessionClient, newSessionId } = await import('/js/bt-klient.js');
  const { newSessionDoc } = await import('/js/bt-kreator.js');
  const { nyAt, sanitizeBt } = await import('/js/bt-czas.js');
  const client = createSessionClient();
  const LAY2 = { kind: '2h', active: 0, charts: [{ instrument: 'NQ', tf: '15s' }, { instrument: 'ES', tf: '1m' }] };
  // K: sesja v2 (data startu, bez puli); kursor startowy podaje wywołujący
  const mk = async (name, pool, cursor = null, layout = LAY2) => {
    const doc = newSessionDoc({
      id: newSessionId(), name,
      def: { instruments: ['NQ', 'ES'], from: pool[0], balance: 50000, risk: { mode: 'usd', value: 500 }, startTime: '09:00', accountId: null, filter: null, excluded: [] },
      now: Date.now(),
    });
    doc.layout = JSON.parse(JSON.stringify(layout));
    if (cursor) doc.cursor = cursor;
    await client.create(doc);
    return doc;
  };
  // ustawienia replayu jak w dashboardzie (domyślne), z szybkością 100×
  const settings = { ...sanitizeBt(null), speed: 100 };
  const open = async (doc) => {
    const R = openReplay(document.body, { sessionId: doc.id, client, getSettings: () => settings, notionEveryMs: 0 });
    await R.ready;
    window.__btCharts = R.charts();
    return R;
  };
  const lastT = (ch) => { const b = ch.bars(); return b.length ? b[b.length - 1][0] : null; };
  // odtwarzanie od `from` do `end` z szybkością sp: klatki (rAF) i kursor; stop po dojściu albo po limicie czasu
  const playTo = async (R, end, sp, limitMs = 120000) => {
    R.setSpeed(sp);
    const ts = [], curs = [];
    const t0 = performance.now();
    await new Promise((done) => {
      const loop = (t) => {
        ts.push(t); curs.push(R.cursor());
        if (R.cursor() >= end || performance.now() - t0 > limitMs) { R.pause(); done(); return; }
        requestAnimationFrame(loop);
      };
      R.play();
      requestAnimationFrame(loop);
    });
    const gaps = []; for (let i = 11; i < ts.length; i++) gaps.push(ts[i] - ts[i - 1]);
    return { gaps, curs, wall: (performance.now() - t0) / 1000 };
  };

  // ---- 1. krok: 500 kroków NQ 15s przy dwóch wykresach (NQ 15s + ES 1m) ----
  // Koszt kroku = część synchroniczna (seek + series.update obu wykresów + pasek) + rysowanie LWC: LWC rysuje w requestAnimationFrame zgłoszonym przy zmianie danych,
  // więc nasz rAF zgłoszony po kroku wykonuje się w tej samej klatce zaraz po rysowaniu: performance.now() − początek klatki = koszt rysowania (metoda z C1).
  await section('krok', async () => {
    const doc = await mk('H1 krok', [DAY], nyAt(DAY, '09:30'));
    const R = await open(doc);
    const c0 = R.cursor();
    rec('krok', c0 === nyAt(DAY, '09:30') && R.charts().length === 2, `start 9:30 NY, dwa wykresy (${R.charts().length})`);
    const xs = [], syncs = [];
    await new Promise((done) => {
      const one = () => requestAnimationFrame(() => {
        const t0 = performance.now(); R.step(1); const t1 = performance.now();
        requestAnimationFrame((ts) => { syncs.push(t1 - t0); xs.push((t1 - t0) + Math.max(0, performance.now() - ts)); if (xs.length < 500) one(); else done(); });
      });
      one();
    });
    perf.stepP95 = pct(xs, 0.95); perf.stepMed = median(xs); perf.stepMax = Math.max(...xs); perf.stepSyncP95 = pct(syncs, 0.95); perf.steps = xs.length;
    perf.stepCursorEnd = R.cursor() - c0;
    rec('krok', xs.length === 500, `500 kroków (kursor +${R.cursor() - c0} s)`);
    rec('krok', perf.stepP95 <= 16, `p95 kroku dwóch wykresów: ${perf.stepP95.toFixed(2)} ms (mediana ${perf.stepMed.toFixed(2)}, max ${perf.stepMax.toFixed(2)}, część synchroniczna p95 ${perf.stepSyncP95.toFixed(2)})`);
    const cur = R.cursor();
    rec('krok', R.charts().every((ch) => lastT(ch) != null && lastT(ch) <= cur), 'po krokach żaden wykres nie ma świecy po kursorze');
    R.close();
  });

  // ---- 2. odtwarzanie 100× od 9:30 do 11:00 (5 400 s ≈ 54 s) ----
  await section('odtwarzanie', async () => {
    const doc = await mk('H1 odtwarzanie', [DAY], nyAt(DAY, '09:30'));
    const R = await open(doc);
    const end = nyAt(DAY, '11:00');
    R.setSpeed(100);
    const ts = [];
    let stopAt = null;
    const t0 = performance.now();
    await new Promise((done) => {
      const loop = (t) => {
        ts.push(t);
        if (R.cursor() >= end) { R.pause(); stopAt = R.cursor(); done(); return; }
        if (performance.now() - t0 > 120000) { R.pause(); done(); return; }
        requestAnimationFrame(loop);
      };
      R.play();
      requestAnimationFrame(loop);
    });
    const wall = (performance.now() - t0) / 1000;
    const gaps = []; for (let i = 11; i < ts.length; i++) gaps.push(ts[i] - ts[i - 1]);
    const slow = gaps.filter((g) => g > 34).length, worst = Math.max(...gaps);
    perf.playFrames = gaps.length; perf.playSlow = slow; perf.playSlowPct = (slow / gaps.length) * 100; perf.playWorst = worst; perf.playWall = wall; perf.playMedFrame = median(gaps);
    perf.playEndOver = stopAt == null ? null : stopAt - end;
    rec('odtwarzanie', stopAt != null && stopAt >= end && stopAt - end <= 100 * 0.25, `kursor na końcu 11:00 NY (+${stopAt == null ? '–' : (stopAt - end).toFixed(2)} s po 11:00; krok klatki 100× ≈ 1,7 s)`);
    rec('odtwarzanie', perf.playSlowPct <= 1, `klatki > 34 ms: ${slow} z ${gaps.length} (${perf.playSlowPct.toFixed(2)}%, próg 1%); mediana klatki ${perf.playMedFrame.toFixed(1)} ms; czas ${wall.toFixed(1)} s`);
    rec('odtwarzanie', worst <= 100, `najdłuższa klatka ${worst.toFixed(1)} ms (próg 100)`);
    const cur = R.cursor();
    rec('odtwarzanie', R.charts().every((ch) => lastT(ch) != null && lastT(ch) <= cur), 'po odtwarzaniu żaden wykres nie ma świecy po kursorze');
    R.close();
  });

  // ---- 2b. J (przegląd P3-4): odtwarzanie 100× na NQ 1s z trzema pozycjami „Zawsze pokazuj” (podpisy jak TV liczone w każdej klatce), próg jak §9 ----
  await section('podpisy', async () => {
    const D = await import('/vendor/lightweight-charts-drawing/lightweight-charts-drawing.es.js');
    const doc = await mk('J podpisy', [DAY], nyAt(DAY, '09:30'), { kind: '1', active: 0, charts: [{ instrument: 'NQ', tf: '1s' }] });
    const R = await open(doc);
    const ch = R.charts()[0], M = ch.rysunki().manager, b = ch.bars(), t1 = b[b.length - 1][0], px = b[b.length - 1][4];
    const ids = [-6, 0, 6].map((dp, k) => M.add({ kind: k === 1 ? 'short-position' : 'long-position', points: [{ time: t1 - 1200 + k * 60, price: px + dp }, { time: t1, price: px + dp }],
      style: { ...D.defaultStyleFor(k === 1 ? 'short-position' : 'long-position'), stopLevel: 5, profitLevel: 10, showStats: true, accountSize: 50000, riskDisplayMode: 'money', riskAmount: 500 } }));
    await frame();
    rec('podpisy', ids.every((id) => ch.statLabels(M.get(id)).length === 3), `trzy pozycje z podpisami (${ids.map((id) => ch.statLabels(M.get(id)).length).join(',')})`);
    const end = nyAt(DAY, '11:00');
    R.setSpeed(100);
    const ts = [];
    const t0 = performance.now();
    await new Promise((done) => {
      const loop = (t) => {
        ts.push(t);
        if (R.cursor() >= end || performance.now() - t0 > 120000) { R.pause(); done(); return; }
        requestAnimationFrame(loop);
      };
      R.play();
      requestAnimationFrame(loop);
    });
    const gaps = []; for (let i = 11; i < ts.length; i++) gaps.push(ts[i] - ts[i - 1]);
    const slow = gaps.filter((g) => g > 34).length;
    perf.labelsFrames = gaps.length; perf.labelsSlowPct = (slow / gaps.length) * 100; perf.labelsWorst = Math.max(...gaps); perf.labelsMedFrame = median(gaps);
    rec('podpisy', R.cursor() >= end, 'odtwarzanie doszło do 11:00 NY');
    rec('podpisy', perf.labelsSlowPct <= 1, `klatki > 34 ms: ${slow} z ${gaps.length} (${perf.labelsSlowPct.toFixed(2)}%, próg 1%); mediana ${perf.labelsMedFrame.toFixed(1)} ms; najdłuższa ${perf.labelsWorst.toFixed(1)} ms`);
    R.close();
  });

  // ---- 2c. L (31.10.2026): odtwarzanie 100× na NQ 1s z otwartą pozycją (etykieta P&L przy każdej klatce), szufladą Pozycje (P&L, MAE/MFE na żywo) i paskiem konta ----
  await section('konto', async () => {
    const doc = await mk('L konto', [DAY], nyAt(DAY, '09:30'), { kind: '1', active: 0, charts: [{ instrument: 'NQ', tf: '1s' }] });
    const R = await open(doc);
    R.doc().def.commission = 2.5;
    const P = (s) => document.querySelector(`.bt-screen .bt-ord ${s}`);
    const setF = (n, v) => { const el = P(`[name="${n}"]`); el.value = String(v); el.dispatchEvent(new Event('input', { bubbles: true })); };
    setF('sl', 400); setF('tp', 800); setF('qty', 1);
    P('[data-o="buy"]').click();
    await frame();
    R.dock().setTab('pos');
    const ch = R.charts()[0];
    rec('konto', !!R.book().positions.NQ && /LONG 1/.test(ch.tradeLayer().querySelector('[data-k="pos"]')?.textContent || '') && !!document.querySelector('.bt-dock [data-row="NQ"]'), 'pozycja z etykietą P&L i wiersz w szufladzie');
    const end = nyAt(DAY, '10:30');
    R.setSpeed(100);
    const ts = [], txt = new Set();
    const t0 = performance.now();
    await new Promise((done) => {
      const loop = (t) => {
        ts.push(t);
        if (ts.length % 30 === 0) txt.add(document.querySelector('.bt-dock [data-row="NQ"] [data-c="usd"]')?.textContent);
        if (R.cursor() >= end || !R.book().positions.NQ || performance.now() - t0 > 120000) { R.pause(); done(); return; }
        requestAnimationFrame(loop);
      };
      R.play();
      requestAnimationFrame(loop);
    });
    const gaps = []; for (let i = 11; i < ts.length; i++) gaps.push(ts[i] - ts[i - 1]);
    const slow = gaps.filter((g) => g > 34).length;
    perf.acctFrames = gaps.length; perf.acctSlowPct = (slow / gaps.length) * 100; perf.acctWorst = Math.max(...gaps); perf.acctMedFrame = median(gaps);
    rec('konto', R.cursor() >= end || !R.book().positions.NQ, `odtwarzanie do 10:30 NY albo do wyjścia (${new Date(R.cursor() * 1000).toISOString().slice(11, 19)} UTC)`);
    rec('konto', txt.size > 3, `P&L w szufladzie zmienia się w trakcie (${txt.size} różnych wartości)`);
    rec('konto', perf.acctSlowPct <= 1, `klatki > 34 ms: ${slow} z ${gaps.length} (${perf.acctSlowPct.toFixed(2)}%, próg 1%); mediana ${perf.acctMedFrame.toFixed(1)} ms; najdłuższa ${perf.acctWorst.toFixed(1)} ms`);
    R.close();
  });

  // ---- 3. K: odtwarzanie przez koniec sesji, przerwę 17–18 NY, noc i weekend (piątek → niedziela), 300×, z doładowaniem danych w tle ----
  await section('weekend', async () => {
    const doc = await mk('K weekend', ['2024-03-08'], nyAt('2024-03-08', '16:40'), { kind: '1', active: 0, charts: [{ instrument: 'NQ', tf: '1m' }] });
    const R = await open(doc);
    const sun = nyAt('2024-03-10', '18:00'), end = nyAt('2024-03-10', '18:20');
    const r = await playTo(R, end, 300, 60000);
    const slow = r.gaps.filter((g) => g > 34).length, worst = Math.max(...r.gaps);
    perf.weekendFrames = r.gaps.length; perf.weekendWorst = worst; perf.weekendSlowPct = (slow / r.gaps.length) * 100; perf.weekendWall = r.wall;
    // czas ścienny: 20 min piątku + 20 min niedzieli przy 300× ≈ 8 s; bez pomijania weekendu (49 h) trwałoby ok. 10 min
    rec('weekend', R.cursor() >= end && r.wall < 30, `kursor przeszedł weekend do niedzieli 18:20 NY w ${r.wall.toFixed(1)} s (bez pomijania przerw: ok. 600 s)`);
    rec('weekend', !r.curs.some((c) => c > nyAt('2024-03-08', '17:00') + 60 && c < sun), 'kursor nie stanął w środku weekendu (przerwa pominięta)');
    rec('weekend', worst <= 100, `najdłuższa klatka ${worst.toFixed(1)} ms (próg 100), klatki > 34 ms: ${slow} z ${r.gaps.length}`);
    const cur = R.cursor();
    rec('weekend', R.charts().every((ch) => lastT(ch) != null && lastT(ch) <= cur && lastT(ch) >= sun), 'po weekendzie świece niedzieli, bez przyszłości');
    // granica dni: wtorek 16:45 → 18:15 (koniec sesji, przerwa, nowa sesja), 300×
    await R.goTo(nyAt('2024-03-12', '16:45'));
    const r2 = await playTo(R, nyAt('2024-03-12', '18:15'), 300, 30000);
    perf.dayBoundaryWorst = Math.max(...r2.gaps);
    rec('weekend', R.cursor() >= nyAt('2024-03-12', '18:15') && perf.dayBoundaryWorst <= 100, `granica dni (17:00 → 18:00 NY) w ${r2.wall.toFixed(1)} s, najdłuższa klatka ${perf.dayBoundaryWorst.toFixed(1)} ms`);
    R.close();
  });

  // ---- 4. K: przewinięcie wykresu w lewo do początku danych (1h), doładowanie porcjami nie blokuje UI ----
  await section('historia', async () => {
    const doc = await mk('K historia', [DAY], nyAt(DAY, '09:30'), { kind: '1', active: 0, charts: [{ instrument: 'NQ', tf: '1h' }] });
    const R = await open(doc);
    const ch = R.charts()[0];
    const first = R.data().bounds().first;
    const ts = [];
    let busy = true;
    const watch = (t) => { ts.push(t); if (busy) requestAnimationFrame(watch); };
    requestAnimationFrame(watch);
    const t0 = performance.now();
    let n = 0;
    while (!ch.history().done && performance.now() - t0 < 120000) {
      ch.chart.timeScale().setVisibleLogicalRange({ from: 0, to: 120 }); // przewinięcie na lewy brzeg: wykres sam dociąga porcję
      await sleep(30); n++;
    }
    busy = false;
    const ms = performance.now() - t0;
    const gaps = []; for (let i = 1; i < ts.length; i++) gaps.push(ts[i] - ts[i - 1]);
    perf.historyMs = Math.round(ms); perf.historyBars = ch.bars().length; perf.historyWorstFrame = Math.max(...gaps); perf.historyFirst = new Date(ch.bars()[0][0] * 1000).toISOString();
    rec('historia', ch.history().done && ch.bars()[0][0] - first < 86400 * 4, `1h: historia do początku danych (${perf.historyFirst}, pierwsza świeca danych ${new Date(first * 1000).toISOString()}), ${perf.historyBars} świec w ${(ms / 1000).toFixed(1)} s`);
    rec('historia', perf.historyWorstFrame <= 100, `najdłuższa klatka w trakcie doładowania ${perf.historyWorstFrame.toFixed(1)} ms (próg 100)`);
    rec('historia', ch.bars().every((b) => b[0] < R.cursor()), 'cała historia przed kursorem (bez przyszłości)');
    // krok po wczytaniu pełnej historii nadal tani (nakładki liczone z ogona)
    const xs = [];
    for (let i = 0; i < 60; i++) { await frame(); const a = performance.now(); R.step(1); xs.push(performance.now() - a); }
    perf.stepFullHistoryP95 = pct(xs, 0.95);
    rec('historia', perf.stepFullHistoryP95 <= 16, `krok 1h przy pełnej historii (${perf.historyBars} świec): p95 części synchronicznej ${perf.stepFullHistoryP95.toFixed(2)} ms`);
    // 1m: dwadzieścia porcji w lewo (ok. 40 dni): czas jednej porcji
    R.setTf('1m'); await sleep(300);
    const c1 = R.charts()[0], t1 = performance.now();
    let k = 0;
    while (k < 20 && !c1.history().done) { const before = c1.history().bars; c1.chart.timeScale().setVisibleLogicalRange({ from: 0, to: 300 }); await sleep(20); if (c1.history().bars > before) k++; if (performance.now() - t1 > 60000) break; }
    perf.history1mChunkMs = Math.round((performance.now() - t1) / Math.max(1, k));
    rec('historia', k >= 10, `1m: ${k} porcji historii, średnio ${perf.history1mChunkMs} ms na porcję (${c1.bars().length} świec)`);
    R.close();
  });

  // ---- 5. skok „Następna sesja NY”: od kliknięcia „Skocz” do narysowanego wykresu następnego dnia (przez weekend: piątek → poniedziałek) ----
  await section('skok', async () => {
    const doc = await mk('H1 skok', ['2024-03-12'], nyAt('2024-03-12', '10:00'));
    localStorage.setItem('thq.bt.jump.v1', 'nySession');
    const R = await open(doc);
    const scr = document.querySelector('.bt-screen');
    const times = [];
    const want = ['2024-03-13', '2024-03-14', '2024-03-15', '2024-03-18', '2024-03-19'];
    for (const d of want) {
      const sel = scr.querySelector('.bt-jump'); sel.value = 'nySession'; sel.dispatchEvent(new Event('change', { bubbles: true }));
      await frame();
      const t0 = performance.now();
      scr.querySelector('[data-bt="jump"]').click();
      let ok = false;
      while (performance.now() - t0 < 15000) {
        await frame();
        if (R.cursor() === nyAt(d, '09:00') && R.charts().every((ch) => lastT(ch) != null && lastT(ch) <= R.cursor() && lastT(ch) >= nyAt(d, '08:00'))) { ok = true; break; }
      }
      await frame();
      const ms = performance.now() - t0;
      times.push(ms);
      rec('skok', ok, `${d}: wykresy po ${ms.toFixed(0)} ms (kursor ${new Date(R.cursor() * 1000).toISOString().slice(0, 16)} UTC)`);
    }
    perf.jumpTimes = times.map((x) => Math.round(x)); perf.jumpMedian = median(times);
    rec('skok', perf.jumpMedian <= 1500, `mediana skoku: ${perf.jumpMedian.toFixed(0)} ms (próg 1 500), pojedyncze: ${perf.jumpTimes.join(', ')}`);
    R.close();
  });

  // ---- 6. siatka przyszłości (newsy włączone, 04.11.2026): siatka 1s ma do ok. 165 tys. punktów (limit 200 tys.). Krok na 1s i 5s (jeden wykres i układ czterech wykresów), czas resetu przy zmianie
  // interwału (setData serii siatki) i przewinięcie do newsa z następnego dnia (14:30 ET) na 1s. Progi jak w pozostałych sekcjach: krok ≤ 16 ms p95 ----
  await section('siatka', async () => {
    const LAY1 = (tf) => ({ kind: '1', active: 0, charts: [{ instrument: 'NQ', tf }] });
    const LAY4 = { kind: '4', active: 0, charts: [{ instrument: 'NQ', tf: '1s' }, { instrument: 'NQ', tf: '5s' }, { instrument: 'ES', tf: '1m' }, { instrument: 'NQ', tf: '15s' }] };
    try { localStorage.setItem('thq.chart.overlays.v1', JSON.stringify({ sessions: false, pdhl: false, news: true, earnings: false, newsImp: { high: true, medium: true, low: true, holiday: true, opex: true } })); } catch { /* bez localStorage */ }
    const measure = async (R, n) => {
      const xs = [], syncs = [];
      globalThis.__btStats = {};
      await new Promise((done) => {
        const one = () => requestAnimationFrame(() => {
          const t0 = performance.now(); R.step(1); const t1 = performance.now();
          requestAnimationFrame((ts) => { syncs.push(t1 - t0); xs.push((t1 - t0) + Math.max(0, performance.now() - ts)); if (xs.length < n) one(); else done(); });
        });
        one();
      });
      return { p95: pct(xs, 0.95), med: median(xs), max: Math.max(...xs), sync95: pct(syncs, 0.95), n: xs.length, rebuilds: globalThis.__btStats.futSetData || 0 };
    };
    const setNews = (on) => { try { localStorage.setItem('thq.chart.overlays.v1', JSON.stringify({ sessions: false, pdhl: false, news: on, earnings: false, newsImp: { high: true, medium: true, low: true, holiday: true, opex: true } })); } catch { /* bez localStorage */ } };
    // kontrola: te same układy bez newsów (bez siatki), żeby odróżnić koszt siatki od kosztu samego układu na tej maszynie
    for (const [key, label, lay, n] of [['grid1s', 'jeden wykres NQ 1s', LAY1('1s'), 300], ['grid5s', 'jeden wykres NQ 5s', LAY1('5s'), 300], ['grid4', 'cztery wykresy (NQ 1s, NQ 5s, ES 1m, NQ 15s)', LAY4, 300]]) {
      const res = {};
      for (const on of [false, true, false, true]) {
        setNews(on);
        const doc = await mk('siatka ' + key + (on ? ' on' : ' off'), [DAY], nyAt(DAY, '09:40'), lay); // 09:40: w oknie 1s są już świece sekundowe, więc siatka ma pełny odstęp 1 s (ok. 100 tys. punktów)
        const R = await open(doc);
        await sleep(800);
        const m = await measure(R, n);
        m.grid = R.charts().map((c) => c.future().length);
        (res[on ? 'on' : 'off'] ||= []).push(m);
        R.close();
      }
      perf[key] = res;
      const p = (k) => res[k].map((m) => m.p95.toFixed(1)).join('/');
      const worstOn = Math.max(...res.on.map((m) => m.p95)), worstOff = Math.max(...res.off.map((m) => m.p95));
      rec('siatka', res.on.every((m) => m.grid[0] > 1000), `${label}: siatka przyszłości istnieje po krokach (punkty: ${res.on.map((m) => m.grid.join(',')).join(' | ')})`);
      rec('siatka', worstOn <= Math.max(16, worstOff + 3), `p95 kroku (${label}) z newsami ${p('on')} ms, bez newsów ${p('off')} ms (dwa przebiegi na przemian; max z newsami ${Math.max(...res.on.map((m) => m.max)).toFixed(1)}, bez ${Math.max(...res.off.map((m) => m.max)).toFixed(1)}; część synchroniczna p95 z newsami ${res.on.map((m) => m.sync95.toFixed(1)).join('/')}; przebudowy siatki w 300 krokach: ${res.on.map((m) => m.rebuilds).join('/')}); próg: ≤ 16 ms albo najwyżej 3 ms ponad układ bez newsów`);
    }
    setNews(true);
    // reset przy zmianie interwału: od wywołania do końca drugiej klatki (ustawienie serii siatki), dla kilku par
    {
      const doc = await mk('siatka reset', [DAY], nyAt(DAY, '09:40'), LAY1('1m'));
      const R = await open(doc);
      await sleep(800);
      const times = {};
      for (const tf of ['1s', '1m', '5s', '1h', '1s', '15s', '1m']) {
        const t0 = performance.now(); R.setTf(tf); const t1 = performance.now(); await frame(); await frame();
        (times[tf] ||= []).push({ sync: t1 - t0, total: performance.now() - t0 });
        await sleep(400);
      }
      const all = Object.values(times).flat();
      perf.resetMs = Object.fromEntries(Object.entries(times).map(([k, v]) => [k, v.map((x) => Math.round(x.total))]));
      perf.resetMaxMs = Math.max(...all.map((x) => x.total)); perf.resetSyncMaxMs = Math.max(...all.map((x) => x.sync));
      rec('siatka', true, `zmiana interwału z siatką (całość do drugiej klatki, ms): ${Object.entries(perf.resetMs).map(([k, v]) => k + ' ' + v.join('/')).join(', ')}; najdłuższa część synchroniczna ${perf.resetSyncMaxMs.toFixed(0)} ms`);
      rec('siatka', perf.resetSyncMaxMs <= 250, `reset przy zmianie interwału z siatką: część synchroniczna ≤ 250 ms (najdłuższa ${perf.resetSyncMaxMs.toFixed(0)} ms)`);
      R.close();
    }
    // przewinięcie do newsa z następnego dnia (14:30 ET) na 1s: oś zna czas, znacznik w widoku, czas przewinięcia
    {
      const doc = await mk('siatka news', [DAY], nyAt(DAY, '09:40'), LAY1('1s'));
      const R = await open(doc);
      await sleep(900);
      const c = R.charts()[0], newsT = nyAt('2024-03-13', '14:30');
      const fut = c.future(), from = fut.from || 0;
      const before = fut.filter((t) => t <= newsT).length - from;
      const idx = c.bars().length - 1 + Math.max(0, before);
      const t0 = performance.now();
      c.chart.timeScale().setVisibleLogicalRange({ from: idx - 120, to: idx + 120 });
      const t1 = performance.now(); await frame(); await frame();
      const total = performance.now() - t0, ts = c.chart.timeScale();
      // siatka ma rzadki ogon: czas newsa leży między dwoma punktami siatki, a pozycję liczy interpolacja (newsy.js timeToX); tu: oba sąsiednie punkty mają współrzędne w widoku
      const j = fut.findIndex((t) => t > newsT), xa = ts.timeToCoordinate(fut[j - 1]), xb = ts.timeToCoordinate(fut[j]);
      const x = xa != null && xb != null ? xa + (xb - xa) * ((newsT - fut[j - 1]) / (fut[j] - fut[j - 1])) : null;
      perf.newsScrollMs = Math.round(total); perf.newsScrollSyncMs = Math.round(t1 - t0);
      rec('siatka', j > 0 && x != null && x > 0 && x < ts.width(), `news 14:30 ET następnego dnia na 1s: sąsiednie punkty siatki w widoku, interpolowane x ${x == null ? 'brak' : Math.round(x)} z ${Math.round(ts.width())} (punktów siatki do newsa ${before}, siatka ${fut.length - from}); przewinięcie ${perf.newsScrollMs} ms (synchronicznie ${perf.newsScrollSyncMs})`);
      R.close();
    }
    try { localStorage.removeItem('thq.chart.overlays.v1'); } catch { /* bez localStorage */ }
  });

  out.textContent = JSON.stringify({ checks, perf });
} catch (e) {
  out.textContent = JSON.stringify({ fatal: String(e && e.stack || e), checks, perf });
}
</script>
