<!doctype html>
<html lang="pl" data-theme="onyx">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<base href="/">
<title>JustJournal: auto BE i presety 1.7-3 (strona robocza)</title>
<!-- Strona robocza testów backtest-173 (testy/backtest-173-strona.mjs), Chrome/Edge headless przez CDP, tylko na dashboardzie testowym (THQ_TEST_PAGES=1) pod /__testy/.
     Prawdziwy replay na świecach syntetycznych: auto BE w bilecie (jednostki R, pkt, ticki, $, cena, podgląd progu, R bez SL nieaktywne), próg BE na pozycji (+BE, przeciąganie z odczytem,
     strzałki, usuwanie z Cofnij, edycja i wyłączenie w panelu ×, kolumna szuflady), wyzwolenie z komunikatem i plakietką BE, chipy presetów (aktywacja, Kup jednym kliknięciem, edycja odłącza,
     „Zapisz jako preset…”), przycisk przeciwny „Zamknij n” bez SL w panelu, linia BE w Journalu, brak przykrywania (elementFromPoint), układ 375 px (tylko brak poziomego przewijania i przykrytych przycisków).
     Parametry: ?w=375, ?theme=platinum, ?shots=1 (zrzuty przez most CDP window.__shot). Wynik: pre#wynik z JSON-em { checks: [{ tag, ok, msg }], fatal }.
     Zasada tej strony: każda asercja może zawieść (żadnych gałęzi „pominięte = zdane”, OR-ów zawsze prawdziwych ani szukania po textContent z ukrytymi spanami). -->
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/features.css">
<style>
  body { margin: 0; background: var(--chrome); color: var(--fg); }
  #wynik { white-space: pre-wrap; font: 12px ui-monospace, Consolas, monospace; }
  body.run #wynik { position: fixed; left: -9999px; }
</style>
</head>
<body class="run">
<pre id="wynik">…</pre>
<script type="module">
const out = document.getElementById('wynik');
const qs = new URLSearchParams(location.search);
const narrow = qs.get('w') === '375';
const shots = qs.get('shots') === '1';
const wide = !narrow || shots;
document.documentElement.dataset.theme = qs.get('theme') === 'platinum' ? 'platinum' : 'onyx';
const checks = [];
const rec = (tag, cond, msg) => checks.push({ tag, ok: !!cond, msg });
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const until = async (fn, ms = 6000) => { const t0 = performance.now(); while (performance.now() - t0 < ms) { const v = await fn(); if (v) return v; await sleep(20); } return null; };
window.addEventListener('error', (e) => rec('błąd strony', false, e.error?.stack || e.message));
window.addEventListener('unhandledrejection', (e) => rec('błąd strony', false, String(e.reason?.stack || e.reason)));
const section = async (tag, fn) => { try { await fn(); } catch (e) { rec(tag, false, `sekcja przerwana: ${e && e.stack || e}`); } };
const key = (k, extra = {}, target = document.body) => { const ev = new KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true, ...extra }); target.dispatchEvent(ev); return ev; };
let shotId = 0;
const shot = async (name) => {
  if (!shots || !window.__shot) return;
  const id = ++shotId;
  const tz = document.getElementById('toast');
  if (tz) tz.hidden = true;
  await sleep(150);
  window.__shot(JSON.stringify({ id, name: `${name}-${qs.get('theme') === 'platinum' ? 'platinum' : 'onyx'}-${narrow ? 375 : 1920}` }));
  await until(() => window.__done?.[id], 10000);
};

try {
  try { localStorage.removeItem('thq.bt.open.v1'); localStorage.removeItem('thq.bt.dock.v1'); localStorage.removeItem('thq.bt.ord.v1'); localStorage.removeItem('thq.bt.jump.v1'); localStorage.setItem('thq.chart.overlays.v1', JSON.stringify({ sessions: false, pdhl: false })); } catch { /* bez localStorage */ }
  const { openReplay } = await import('/js/bt-replay.js');
  const { createSessionClient, newSessionId } = await import('/js/bt-klient.js');
  const { newSessionDoc } = await import('/js/bt-kreator.js');
  const { nyAt, sanitizeBt } = await import('/js/bt-czas.js');
  const { fmtMoney, fmtR } = await import('/js/format.js');
  const { visibleCount } = await import('/js/bt-swieca.js');
  const { abeInfo } = await import('/js/bt-zlecenia.js');
  const client = createSessionClient();
  const mkDef = () => ({ instruments: ['NQ'], from: '2024-03-12', balance: 50000, risk: { mode: 'usd', value: 500 }, riskBase: 'current', commission: 0, startTime: '09:00', accountId: null, filter: null, excluded: [] });
  const doc = newSessionDoc({ id: newSessionId(), name: 'Sesja 173', def: mkDef(), now: Date.now() });
  await client.create(doc);
  client.notion = async () => ({ sent: 0, skipped: 0, failed: [], pending: 0, notion: {} });
  // ustawienia bloku bt trzymane w stronie (tak jak robi to aplikacja przez onPresets)
  let btSet = sanitizeBt(null);
  const savedPatches = [];
  const RP = openReplay(document.body, { sessionId: doc.id, client, onClosed: () => {}, notionEveryMs: 0, getSettings: () => btSet, onPresets: (patch) => { savedPatches.push(patch); btSet = sanitizeBt({ ...btSet, ...patch }); } });
  await RP.ready;
  const scr = () => document.querySelector('.bt-screen');
  const P = (sel) => scr().querySelector(`.bt-ord ${sel}`);
  const setF = (n, v) => { const el = P(`[name="${n}"]`); el.value = String(v); el.dispatchEvent(new Event('input', { bubbles: true })); };
  const pos = () => RP.book().positions.NQ;
  const trades = () => RP.doc().trades;
  const ch = () => RP.chart();
  const host = () => scr().querySelector('.bt-plot');
  const layer = () => ch().tradeLayer();
  const tag = (k) => layer().querySelector(`[data-k="${k}"]`);
  const mainText = (k) => tag(k)?.querySelector('.bt-tag-t')?.textContent ?? '';
  const live = () => layer().querySelector('.bt-tl-live')?.textContent ?? '';
  const focusTag = (k) => { const el = tag(k); el.focus(); el.dispatchEvent(new FocusEvent('focusin', { bubbles: true })); };
  const acts = () => layer().querySelector('[data-k="pos"] .bt-tag-act');
  const q = (x) => Math.round(x / 0.25) * 0.25;
  const norm = (s) => String(s).replace(/\s+/g, ' ').trim();
  const num = (s) => Number(String(s).replace(/\s/g, '').replace(',', '.'));
  const center = (el) => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
  const pe = (type, el, x, y, extra = {}) => el.dispatchEvent(new PointerEvent(type, { bubbles: true, cancelable: true, clientX: x, clientY: y, pointerId: 7, pointerType: 'mouse', button: 0, buttons: type === 'pointerup' ? 0 : 1, isPrimary: true, ...extra }));
  const yPx = (px) => host().getBoundingClientRect().top + ch().series.priceToCoordinate(px);
  const modeOf = (side) => P(`[data-o="${side}"] .bt-ord-mode`).textContent;
  const note = () => P('.bt-ord-note').textContent;
  const prev = () => { const e = P('.bt-ord-prev'); return e.hidden ? '' : e.textContent; };
  const btn = (side) => P(`[data-o="${side}"]`);
  const kupPx = () => num(btn('buy').querySelector('.bt-ord-px').textContent);
  // podgląd: „auto BE przy 18 016,50 (Kup) · 17 986,50 (Sprzedaj)” dla jednostek względnych albo „auto BE przy 18 010,25” dla ceny; zwraca próg dla Kup
  const abePrev = () => { const m = prev().match(/auto BE przy ([\d\s.,]+?)(?: \(Kup\)|$)/); return m ? num(m[1]) : null; };
  const abePrevSell = () => { const m = prev().match(/\(Kup\) · ([\d\s.,]+) \(Sprzedaj\)$/); return m ? num(m[1]) : null; };
  const hits = (els) => {
    const bad = [];
    let n = 0;
    for (const b of els) {
      const r = b.getBoundingClientRect();
      if (r.width < 1 || r.height < 1 || getComputedStyle(b).visibility === 'hidden') continue;
      n++;
      const hit = document.elementFromPoint(r.left + r.width / 2, r.top + r.height / 2);
      // pole wyboru w etykiecie (.check) jest niewidocznym natywnym polem: trafia w nie jego etykieta, czyli element, który je zawiera
      if (!(hit === b || b.contains(hit) || (b.type === 'checkbox' && b.closest('label')?.contains(hit)))) bad.push(`${b.dataset.tl || b.dataset.dka || b.dataset.o || b.dataset.pr || b.name || b.className} → ${hit?.dataset?.tl || hit?.className || hit?.tagName}`);
    }
    return { n, bad };
  };
  const closeAllNow = async () => { RP.orders().closeAll(); await sleep(80); };
  // wejście z panelu: SL i TP w punktach (puste = bez), ilość ręczna albo z ryzyka; auto BE wyłączony
  const abeOff = () => { const c = P('[name="abeOn"]'); if (c.checked) c.click(); };
  const openPos = async ({ side = 'buy', sl = 10, tp = 30, qty = null } = {}) => {
    await closeAllNow();
    abeOff();
    setF('sl', sl); setF('tp', tp);
    if (qty != null) setF('qty', qty); else setF('qty', '');
    RP.orders().submit(side); await sleep(80);
  };
  await RP.goTo(nyAt('2024-03-12', '09:31')); await sleep(100);
  document.querySelectorAll('.bt-jr').forEach((x) => x.remove());
  // R3-P2-1 (runda 4): TP poza polem ceny przykleja się do górnej krawędzi (↑ TP), a próg BE tuż pod krawędzią nie może na niego nachodzić ani przykrywać jego ×;
  // sprawdza rozstaw plakietek (≥ 24 px) i elementFromPoint w środku każdego ×
  const edgeCollision = async (tagName) => {
    await closeAllNow(); abeOff();
    setF('sl', 10); setF('tp', 600); setF('qty', 1);
    RP.orders().submit('buy'); await sleep(120);
    const yEdge = 19, price = q(ch().series.coordinateToPrice(yEdge));
    RP.orders().setLevel('NQ', 'abe', price); await sleep(150);
    const tp = tag('ptp'), be = tag('pbe');
    rec(tagName, tp?.dataset.edge === 'up', `TP poza polem ceny przyklejony do górnej krawędzi (edge ${tp?.dataset.edge})`);
    const a = tp.getBoundingClientRect(), b = be.getBoundingClientRect();
    rec(tagName, !(a.top < b.bottom - 1 && b.top < a.bottom - 1), `plakietki TP (${Math.round(a.top)}–${Math.round(a.bottom)}) i próg BE (${Math.round(b.top)}–${Math.round(b.bottom)}) nie nachodzą na siebie`);
    // toast „Zamknięcie …” z closeAllNow (odbiór 1.7.0) stoi w prawym dolnym rogu i na czas pomiaru ×  jest ukryty (jak w zrzutach)
    { const tz0 = document.getElementById('toast'); if (tz0) tz0.hidden = true; }
    const hx = hits(layer().querySelectorAll('[data-k="ptp"] .bt-tag-x, [data-k="pbe"] .bt-tag-x'));
    rec(tagName, hx.n === 2 && hx.bad.length === 0, `środki obu × (TP i próg BE) trafiają w siebie (${hx.n}; ${hx.bad.join('; ')})`);
    await shot('kolizja-tp-be');
    await closeAllNow();
  };
  const moreOpen = () => { const m = scr().querySelector('.bt-ord-more'); if (m && getComputedStyle(m).display !== 'none' && m.getAttribute('aria-expanded') !== 'true') m.click(); };

  // ---------- bilet: auto BE z jednostkami, podgląd progu, R bez SL nieaktywne ----------
  if (wide) await section('bilet', async () => {
    await closeAllNow();
    setF('sl', 10); setF('tp', ''); setF('qty', 1);
    const on = P('[name="abeOn"]');
    rec('bilet', !on.checked && P('.bt-abe-unit').hidden && P('[name="abeVal"]').closest('label').hidden, 'domyślnie auto BE wyłączony, jednostki i pole progu ukryte');
    on.click(); await sleep(60);
    rec('bilet', on.checked && !P('.bt-abe-unit').hidden, 'przełącznik odsłania jednostki i próg');
    const units = [...P('.bt-abe-unit').querySelectorAll('button')].map((b) => b.textContent);
    rec('bilet', units.join('|') === 'R|pkt|ticki|$|cena', `jednostki progu: ${units.join(' | ')}`);
    const e0 = kupPx();
    setF('abeVal', 1);
    rec('bilet', P('[data-abek="r"]').getAttribute('aria-pressed') === 'true' && abePrev() === q(e0 + 10) && abePrevSell() === q(e0 - 10), `R: 1R przy SL 10 pkt → Kup ${q(e0 + 10)}, Sprzedaj ${q(e0 - 10)} (podgląd «${prev()}»)`);
    P('[data-abek="pts"]').click(); setF('abeVal', 3); await sleep(40);
    rec('bilet', abePrev() === q(e0 + 3), `pkt: 3 pkt → ${q(e0 + 3)} (podgląd «${prev()}»)`);
    P('[data-abek="ticks"]').click(); setF('abeVal', 8); await sleep(40);
    rec('bilet', abePrev() === q(e0 + 2), `ticki: 8 ticków → ${q(e0 + 2)} (podgląd «${prev()}»)`);
    P('[data-abek="usd"]').click(); setF('abeVal', 100); await sleep(40);
    rec('bilet', abePrev() === q(e0 + 5), `$: 100 $ przy 1 kontrakcie NQ (20 $/pkt) → ${q(e0 + 5)} (podgląd «${prev()}»)`);
    P('[data-abek="price"]').click(); setF('abeVal', q(e0 + 7.25)); await sleep(40);
    rec('bilet', abePrev() === q(e0 + 7.25), `cena: wartość wprost ${q(e0 + 7.25)} (podgląd «${prev()}»)`);
    // R bez SL: jednostka nieaktywna z podpowiedzią, a wybrana R blokuje zlecenie z powodem
    P('[data-abek="r"]').click(); setF('abeVal', 1); await sleep(30);
    setF('sl', ''); setF('qty', 1); await sleep(60);
    const rb = P('[data-abek="r"]');
    rec('bilet', rb.disabled && rb.title === 'Auto BE w R wymaga SL', `R bez SL: przycisk nieaktywny z podpowiedzią («${rb.title}»)`);
    rec('bilet', btn('buy').disabled && note() === 'Auto BE w R wymaga SL.', `R bez SL: Kup nieaktywne z powodem («${note()}»)`);
    P('[data-abek="pts"]').click(); setF('abeVal', 3); await sleep(40);
    rec('bilet', !btn('buy').disabled && note() === '', `po zmianie jednostki na pkt Kup działa bez SL («${note()}»)`);
    // zły próg: pusty
    setF('abeVal', ''); await sleep(30);
    rec('bilet', btn('buy').disabled && note() === 'Wpisz próg auto BE.', `pusty próg: «${note()}»`);
    // pamięć instrumentu zawiera stan auto BE
    setF('abeVal', 3); setF('sl', 10); await sleep(40);
    const mem = JSON.parse(localStorage.getItem('thq.bt.ord.v1') || '{}').NQ;
    rec('bilet', mem?.abe?.on === true && mem.abe.kind === 'pts' && mem.abe.value === '3', `pamięć panelu: ${JSON.stringify(mem?.abe)}`);
    await shot('bilet-auto-be');
    // zlecenie niesie próg: Long 1, SL 10, auto BE 3 pkt, offset 0
    RP.orders().submit('buy'); await sleep(100);
    const p = pos();
    rec('bilet', !!p && p.sl === q(p.entryPrice - 10) && p.autoBe && p.autoBe.kind === 'pts' && p.autoBe.value === 3 && p.autoBe.offsetTicks === 0 && p.autoBe.done === false, `pozycja ma uzbrojony próg: ${JSON.stringify(p?.autoBe)}`);
    const info = abeInfo(p);
    rec('bilet', info.armed && norm(info.text) === `przy +3 pkt (${norm(new Intl.NumberFormat('pl-PL', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(p.entryPrice + 3))}) · BE`, `opis progu: «${info.text}»`);
    // domyślny offset z Ustawień (2) i offset wpisany w polu (5)
    await closeAllNow();
    btSet = sanitizeBt({ ...btSet, beOffset: 2 });
    RP.orders().submit('buy'); await sleep(100);
    rec('bilet', pos()?.autoBe?.offsetTicks === 2, `offset z Ustawień: ${pos()?.autoBe?.offsetTicks}`);
    await closeAllNow();
    setF('abeOff', 5);
    RP.orders().submit('buy'); await sleep(100);
    rec('bilet', pos()?.autoBe?.offsetTicks === 5, `offset wpisany w polu: ${pos()?.autoBe?.offsetTicks}`);
    await closeAllNow();
    setF('abeOff', 21); await sleep(40);
    rec('bilet', btn('buy').disabled && note() === 'Offset auto BE: liczba ticków od 0 do 20.', `offset 21 odrzucony («${note()}»)`);
    setF('abeOff', ''); btSet = sanitizeBt({ ...btSet, beOffset: 0 });
    abeOff(); await sleep(40);
  });

  // ---------- pozycja: +BE, znacznik progu, przeciąganie, strzałki, usuwanie z Cofnij ----------
  if (wide) await section('pozycja', async () => {
    await openPos({ sl: 10, tp: 30, qty: 2 });
    const p0 = pos(), avg = p0.avg;
    rec('pozycja', !tag('pbe') && p0.autoBe === null, 'bez progu nie ma plakietki BE');
    focusTag('pos'); await sleep(50);
    const plus = acts()?.querySelector('[data-tl="abe+"]');
    rec('pozycja', !!plus && plus.textContent === '+BE' && plus.getAttribute('aria-label') === 'Dodaj próg auto BE', `przy wejściu jest przycisk «${plus?.textContent}» obok +SL/+TP (tu SL i TP są, więc tylko +BE i BE)`);
    // +BE (dodaje próg) różni się od BE (przesuwa SL teraz): kreskowana ramka w kolorze BE, solidny BE, odstęp między nimi
    const beB = acts().querySelector('[data-tl="be"]'), csP = getComputedStyle(plus), csB = getComputedStyle(beB);
    rec('pozycja', csP.borderTopStyle === 'dashed' && csB.borderTopStyle === 'solid' && csP.color !== csB.color && beB.getBoundingClientRect().left - plus.getBoundingClientRect().right >= 8, `+BE: ramka ${csP.borderTopStyle} i kolor ${csP.color}, BE: ${csB.borderTopStyle} ${csB.color}, odstęp ${Math.round(beB.getBoundingClientRect().left - plus.getBoundingClientRect().right)} px`);
    // Enter na „+BE”: próg domyślny na +1R = 10 pkt (SL 10 pkt)
    const ev = key('Enter', {}, plus); await sleep(120);
    rec('pozycja', ev.defaultPrevented && pos().autoBe?.kind === 'price' && pos().autoBe.value === q(avg + 10) && pos().autoBe.done === false, `+BE stawia próg na +1R = ${q(avg + 10)} (silnik: ${JSON.stringify(pos().autoBe)})`);
    rec('pozycja', !!tag('pbe') && tag('pbe').getAttribute('aria-valuenow') === String(q(avg + 10)), 'pojawia się plakietka BE przy progu');
    // odczyt w spoczynku: zysk w $ i R na progu (2 kontrakty, 10 pkt → 400 $, 1R = 400 $)
    rec('pozycja', norm(mainText('pbe')) === norm(`BE ${fmtMoney(400)} · ${fmtR(1)}`), `plakietka progu w spoczynku z prefiksem BE: «${mainText('pbe')}»`);
    rec('pozycja', !layer().querySelector('[data-tl="abe+"]'), 'po ustawieniu progu +BE znika');
    // Decyzja sesji głównej 2.11.2026: klik na +BE od razu stawia próg w domyślnym miejscu (karta: „klik stawia próg na +1R”), bez linii „w ręku”
    RP.orders().setAutoBe('NQ', null); await sleep(100);
    focusTag('pos'); await sleep(50);
    layer().querySelector('[data-tl="abe+"]').click(); await sleep(120);
    rec('pozycja', pos().autoBe?.kind === 'price' && pos().autoBe.value === q(avg + 10) && !tag('hand'), `klik +BE od razu stawia próg ${q(avg + 10)} (silnik: ${JSON.stringify(pos().autoBe)}), bez linii w ręku`);
    // znaczniki osi: cena progu jest wśród linii pozycji, a strefa pozycji ma linię BE na tej cenie
    const marks = ch().positionMarks();
    rec('pozycja', marks.some((m) => m.price === q(avg + 10) && m.axis), `znacznik osi ceny z ceną progu (${marks.map((m) => m.price).join(', ')})`);
    // strefa pozycji (rysunek-tło) ma linię BE na szerokości pozycji na cenie progu: ta sama geometria co w dzienniku (positionExtras, style.beLevel)
    const { positionPrices } = await import('/js/rysunki.js');
    const zone = positionPrices(ch().tradingState().position, 0.25);
    rec('pozycja', zone && zone.be === q(avg + 10) && ch().tradingState().position.style.beLevel === q(avg + 10) - avg, `strefa pozycji ma linię BE na ${zone?.be} (beLevel ${ch().tradingState().position?.style?.beLevel})`);
    await shot('pozycja-prog');
    // przeciąganie plakietki: odczyt z ceną, pkt, $ i R; zapis przy puszczeniu
    const el = tag('pbe'), [x, y] = center(el), target = q(avg + 14);
    pe('pointerdown', el, x, y); pe('pointermove', el, x, yPx(target)); await sleep(60);
    const t1 = norm(el.querySelector('.bt-tag-t').textContent);
    rec('pozycja', /^BE /.test(t1) && /pkt/.test(t1) && /\$/.test(t1) && /R/.test(t1), `odczyt w trakcie przeciągania: «${t1}»`);
    rec('pozycja', pos().autoBe.value === q(avg + 10), 'w trakcie silnik działa na zatwierdzonym progu');
    // w trakcie przeciągania widać linię progu na całej szerokości (znacznik osi z lineVisible), a w spoczynku jej nie ma (linię rysuje strefa pozycji)
    const mk = ch().positionMarks().find((m) => m.price === target);
    rec('pozycja', !!mk && mk.line === true, `linia progu widoczna w trakcie przeciągania (${JSON.stringify(mk)})`);
    // próg tuż nad wejściem: odczyt i notka nie przykrywają plakietki wejścia
    pe('pointermove', el, x, yPx(q(avg + 1))); await sleep(80);
    const inter = (a, b) => a.left < b.right && b.left < a.right && a.top < b.bottom && b.top < a.bottom;
    const er = tag('pos').getBoundingClientRect(), tr1 = el.getBoundingClientRect(), nt = el.querySelector('.bt-tag-note');
    rec('pozycja', !inter(tr1, er) && !(nt && !nt.hidden && inter(nt.getBoundingClientRect(), er)), `odczyt (${Math.round(tr1.top)}–${Math.round(tr1.bottom)}) i notka nie przykrywają plakietki wejścia (${Math.round(er.top)}–${Math.round(er.bottom)})`);
    pe('pointermove', el, x, yPx(target)); await sleep(60);
    await shot('pozycja-przeciaganie');
    pe('pointerup', el, x, yPx(target)); await sleep(120);
    rec('pozycja', pos().autoBe.value === target && pos().autoBe.kind === 'price', `puszczenie zapisuje próg ${target} (silnik: ${pos().autoBe.value})`);
    rec('pozycja', norm(live()) === norm(`BE ${new Intl.NumberFormat('pl-PL', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(target)}`), `komunikat aria-live z ceną («${live()}»)`);
    // strzałka w górę o tick, Shift o 1 pkt
    focusTag('pbe'); key('ArrowUp', {}, tag('pbe')); await sleep(100);
    rec('pozycja', pos().autoBe.value === q(target + 0.25), `strzałka ↑ przesuwa o tick (${pos().autoBe.value})`);
    key('ArrowDown', { shiftKey: true }, tag('pbe')); await sleep(100);

    let h = hits([btn('buy'), btn('sell'), P('[data-o="psave"]'), ...chipsEl.querySelectorAll('button')].filter((b) => { const r = b.getBoundingClientRect(), pr = b.closest('.bt-ord-pchips') ? chipsEl.getBoundingClientRect() : bar.getBoundingClientRect(); return r.right <= pr.right + 0.5 && r.left >= pr.left - 0.5; }));
    rec('telefon', h.n >= 4 && h.bad.length === 0, `Kup, Sprzedaj i widoczne chipy trafiają w siebie (${h.n}; ${h.bad.join('; ')})`);
    // panel jest wyższy o rzędy chipów, więc pola auto BE przewijamy do widoku (elementFromPoint zna tylko widoczny obszar)
    P('.bt-ord-abe').scrollIntoView({ block: 'center' }); await sleep(60);
    h = hits(P('.bt-ord-fields').querySelectorAll('.bt-abe-unit button, .bt-ord-abe .check input'));
    rec('telefon', h.n >= 1 && h.bad.length === 0, `przełącznik i jednostki auto BE w polach trafiają w siebie (${h.n}; ${h.bad.join('; ')})`);
    // bez progu przy wejściu są trzy przyciski: +BE, BE i ×
    RP.orders().setAutoBe('NQ', null); await sleep(100);
    focusTag('pos'); await sleep(60); layer().querySelector('[data-k="pos"]').scrollIntoView({ block: 'center' }); await sleep(60);
    h = hits(layer().querySelectorAll('[data-k="pos"] .bt-tag-act button'));
    rec('telefon', h.n >= 3 && h.bad.length === 0, `przyciski wejścia z +BE trafiają w siebie (${h.n}; ${h.bad.join('; ')})`);
    await shot('telefon');
    host().scrollIntoView({ block: 'start' }); await sleep(80);
    await edgeCollision('telefon');
    // ekran replayu nie ma własnego poziomego paska (Zamknij pozycję nie wystaje poza panel)
    rec('telefon', scr().scrollWidth <= scr().clientWidth, `.bt-screen bez poziomego przewijania (${scr().scrollWidth} ≤ ${scr().clientWidth})`);
    rec('telefon', document.documentElement.scrollWidth <= innerWidth, `bez poziomego przewijania (${document.documentElement.scrollWidth} ≤ ${innerWidth})`);
  });

  out.textContent = JSON.stringify({ checks });
} catch (e) {
  out.textContent = JSON.stringify({ checks, fatal: String(e && e.stack || e) });
}
</script>
</body>
</html>
