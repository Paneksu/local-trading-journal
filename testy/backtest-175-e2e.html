<!doctype html>
<html lang="pl" data-theme="onyx">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<base href="/">
<title>JustJournal: kilka TP z procentem wielkości 1.7-5, odbiór na prawdziwych świecach</title>
<!-- Strona odbioru 1.7-5 (testy/backtest-e2e.mjs, sekcja `175`): prawdziwe świece NQ 1s (CPI 2024-03-12, 10:30-11:00 NY), serwer z atrapą Notion.
     Scenariusz karty: preset „Drabina” (SL 15 pkt, TP 1R 50% / 2R 30% / 6R reszta, ryzyko sesji, auto BE 2R) na prawdziwych świecach: wejście jednym kliknięciem (chip + Kup/Sprzedaj), trafienie TP1 i TP2,
     auto BE (próg 2R = cena TP2, SL na BE od następnej świecy), wyjście reszty po BE. Miejsce wejścia wybiera test: przeszukuje strumień świec silnikiem (ta sama funkcja co w replayu) i bierze pierwszy start,
     z którego pozycja daje wyjścia tp1, tp2 i sl na BE; replay musi dać identyczny wynik jak ta symulacja. Atrapa Notion: jedna strona na trade, cena wyjścia = średnia ważona wyjść, wynik łączny,
     pole TP = ostatni cel drabiny. Potem odtwarzanie 100× z drabiną (cztery poziomy z plakietkami, uzbrojony auto BE, szuflada): najwyżej 1% klatek dłuższych niż 34 ms i żadna dłuższa niż 100 ms. Druga faza (runda 2): to samo z poziomami trafianymi W TRAKCIE pomiaru (3/6/9/12 pkt, co najmniej dwa trafione).
     Wynik: pre#wynik z JSON-em { checks: [{ tag, ok, msg }], info, fatal }. Każda asercja może zawieść. -->
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/features.css">
<style>
  body { margin: 0; background: var(--chrome); color: var(--fg); }
  #wynik { white-space: pre-wrap; font: 12px ui-monospace, Consolas, monospace; }
</style>
</head>
<body>
<pre id="wynik">…</pre>
<script type="module">
const out = document.getElementById('wynik');
const checks = [], info = {};
const rec = (tag, cond, msg) => checks.push({ tag, ok: !!cond, msg });
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
window.addEventListener('error', (e) => rec('błąd strony', false, e.error?.stack || e.message));
window.addEventListener('unhandledrejection', (e) => rec('błąd strony', false, String(e.reason?.stack || e.reason)));
const section = async (tag, fn) => { try { await fn(); } catch (e) { rec(tag, false, `sekcja przerwana: ${e && e.stack || e}`); } };

try {
  try { localStorage.removeItem('thq.bt.open.v1'); localStorage.removeItem('thq.bt.dock.v1'); localStorage.removeItem('thq.bt.ord.v1'); localStorage.setItem('thq.chart.overlays.v1', JSON.stringify({ sessions: false, pdhl: false })); } catch { /* bez localStorage */ }
  const { openReplay } = await import('/js/bt-replay.js');
  const { createSessionClient, newSessionId } = await import('/js/bt-klient.js');
  const { newSessionDoc } = await import('/js/bt-kreator.js');
  const { nyAt, sanitizeBt } = await import('/js/bt-czas.js');
  const { visibleCount } = await import('/js/bt-swieca.js');
  const W = await import('/js/bt-wypelnienia.js');
  const DAY = '2024-03-12';
  const client = createSessionClient();
  const doc = newSessionDoc({
    id: newSessionId(), name: 'Sesja 175 odbiór',
    def: { instruments: ['NQ'], from: DAY, balance: 50000, risk: { mode: 'pct', value: 5 }, riskBase: 'current', commission: 0, startTime: '09:00', accountId: null, filter: null, excluded: [] },
    now: Date.now(),
  });
  doc.layout = { kind: '1', active: 0, charts: [{ instrument: 'NQ', tf: '1s' }] };
  await client.create(doc);
  // preset „Drabina”: SL 15 pkt, TP 1R 50% / 2R 30% / 6R reszta, ryzyko sesji, auto BE 2R (cena TP2)
  let btSet = sanitizeBt({ presets: [{ id: 'drabina', name: 'Drabina', sl: { unit: 'pts', value: 15 }, tps: [{ unit: 'rr', value: 1, pct: 50 }, { unit: 'rr', value: 2, pct: 30 }, { unit: 'rr', value: 6, pct: 20 }], size: { mode: 'session', value: 0 }, autoBe: { kind: 'r', value: 2, offsetTicks: 0 } }] });
  const openOne = async (d) => {
    const r = openReplay(document.body, { sessionId: d.id, client, onClosed: () => {}, notionEveryMs: 0, getSettings: () => btSet, onPresets: (patch) => { btSet = sanitizeBt({ ...btSet, ...patch }); } });
    await r.ready;
    return r;
  };
  let RP = await openOne(doc);
  info.sessionId = doc.id;
  const scr = () => document.querySelector('.bt-screen');
  const P = (sel) => scr().querySelector(`.bt-ord ${sel}`);
  const pos = () => RP.book().positions.NQ;
  const ch = () => RP.chart();
  const q = (x) => Math.round(x / 0.25) * 0.25;
  const moreOpen = () => { const m = scr().querySelector('.bt-ord-more'); if (m && getComputedStyle(m).display !== 'none' && m.getAttribute('aria-expanded') !== 'true') m.click(); };

  await RP.goTo(nyAt(DAY, '10:30')); await sleep(150);
  const st = RP.data().stream('NQ');
  info.baseBars = st.bars.length;

  // symulacja silnikiem na świecach (ta sama funkcja co w replayu): wejście na zamknięciu świecy; ilość z ryzyka sesji 5% z 50 000 $ = 2 500 $ / 300 $ = 8 kontraktów, drabina 50/30/reszta: 4 / 2 / 2
  const sim = (i, side) => {
    const bar = st.bars[i], t = bar[0] + st.len[i], price = bar[4], dir = side === 'buy' ? 1 : -1;
    const order = { instrument: 'NQ', side, type: 'market', qty: 8, sl: q(price - dir * 15), tp: q(price + dir * 90), tps: [{ price: q(price + dir * 15), pct: 50 }, { price: q(price + dir * 30), pct: 30 }, { price: q(price + dir * 90), pct: 20 }], autoBe: { kind: 'r', value: 2, offsetTicks: 0 } };
    const r0 = W.placeOrder(W.emptyBook(), order, { t, price });
    if (!r0.book.positions.NQ) return null;
    const r = W.advance(r0.book, 'NQ', st, nyAt(DAY, '11:00'));
    const be = r.events.find((e) => e.type === 'be-auto'), closed = r.events.find((e) => e.type === 'closed')?.position;
    return { i, t, side, price, order, be, closed, events: r.events };
  };
  await section('przebieg', async () => {
    // pierwszy start 10:30-10:55, z którego pozycja daje wyjścia tp1, tp2 i sl na BE (wyjście reszty po średniej wejścia)
    let found = null;
    const i0 = visibleCount(st, nyAt(DAY, '10:30')), i1 = visibleCount(st, nyAt(DAY, '10:55'));
    for (let i = i0; i < i1 && !found; i += 5) for (const side of ['buy', 'sell']) {
      const s = sim(i, side);
      const ex = s?.closed?.exits || [];
      if (s?.be && ex.length === 3 && ex.map((e) => e.tpId ?? e.reason).join() === 'tp1,tp2,sl' && ex[2].price === s.closed.avg) { found = s; break; }
    }
    rec('przebieg', !!found, `na prawdziwych świecach jest start (10:30-10:55), z którego pozycja trafia TP1 i TP2, wyzwala auto BE i kończy na stopie BE: ${found ? `${found.side} od ${new Date(found.t * 1000).toISOString()} (świeca ${found.i})` : 'brak'}`);
    if (!found) return;
    const ex = found.closed.exits;
    info.sim = { t: found.t, side: found.side, entry: found.price, beAt: found.be.price, exits: ex.map((e) => [e.qty, e.price, e.tpId ?? e.reason]) };
    // wejście jednym kliknięciem przy aktywnym presecie: chip „Drabina”, potem Kup albo Sprzedaj
    await RP.goTo(found.t); await sleep(150);
    moreOpen();
    P('[data-pr="drabina"]').click(); await sleep(150);
    rec('przebieg', P('[data-pr="drabina"]').getAttribute('aria-pressed') === 'true' && P('[name="sl"]').value === '15' && P('[name="tp"]').value === '15' && P('[name="tp2"]').value === '30' && P('[name="tp3"]').value === '90' && P('[name="tpPct1"]').value === '50' && P('[name="tpPct2"]').value === '30' && P('[name="abeOn"]').checked, `chip Drabina wypełnił SL 15, TP 15/30/90 (50/30/reszta) i auto BE: ${P('[name="tp"]').value}/${P('[name="tp2"]').value}/${P('[name="tp3"]').value}`);
    P(`[data-o="${found.side}"]`).click(); await sleep(150);
    const p = pos();
    rec('przebieg', !!p && p.qty === 8 && p.entryPrice === found.price && p.sl === found.order.sl && p.tps.length === 3 && p.tps.every((x, i) => x.price === found.order.tps[i].price) && p.tp === found.order.tp && p.autoBe?.kind === 'r' && p.autoBe.value === 2, `jedno kliknięcie: ${p?.dir} ${p?.qty} @ ${p?.entryPrice}, SL ${p?.sl}, poziomy ${JSON.stringify(p?.tps?.map((x) => [x.price, x.pct]))}`);
    const plan = W.tpPlan(p);
    rec('przebieg', plan.map((x) => x.qty).join() === '4,2,2', `plan ilości 4/2/2 (${plan.map((x) => x.qty)})`);
    const layer = ch().tradeLayer();
    rec('przebieg', !!layer.querySelector('[data-k="ptp"]') && !!layer.querySelector('[data-k="ptp2"]') && !!layer.querySelector('[data-k="ptp3"]') && /^TP1 50% · 4 · /.test(layer.querySelector('[data-k="ptp"] .bt-tag-t').textContent), `trzy plakietki poziomów, TP1: «${layer.querySelector('[data-k="ptp"] .bt-tag-t')?.textContent}»`);
    // odtwarzanie 100× aż do zamknięcia (maks. 90 s), z obserwacją kolejnych trafień
    const seen = [];
    const t0 = performance.now();
    await new Promise((done) => {
      const loop = () => {
        const n = pos()?.exits?.length ?? 0;
        if (n > seen.length) seen.push(pos().exits.slice(seen.length).map((e) => e.tpId ?? e.reason).join());
        if (!pos() || performance.now() - t0 > 90000) { RP.pause(); done(); return; }
        requestAnimationFrame(loop);
      };
      RP.setSpeed(100); RP.play();
      requestAnimationFrame(loop);
    });
    await sleep(300);
    const tr = RP.doc().trades.at(-1);
    rec('przebieg', !pos() && !!tr, `pozycja zamknięta w odtwarzaniu (trade ${tr?.id})`);
    rec('przebieg', JSON.stringify(tr.exits.map((e) => [e.qty, e.price, e.tpId ?? e.reason])) === JSON.stringify(ex.map((e) => [e.qty, e.price, e.tpId ?? e.reason])), `wyjścia trade'a jak w symulacji: ${JSON.stringify(tr.exits.map((e) => [e.qty, e.price, e.tpId ?? e.reason]))}`);
    rec('przebieg', tr.be === true && tr.beAt === found.be.price && tr.exits[2].price === tr.entryPrice, `po TP1 i TP2 auto BE (beAt ${tr.beAt}), reszta wyszła po BE @ ${tr.exits[2]?.price} (wejście ${tr.entryPrice})`);
    const wavg = tr.exits.reduce((a, e) => a + e.qty * e.price, 0) / 8;
    const gross = tr.exits.reduce((a, e) => a + (e.price - tr.entryPrice) * (tr.dir === 'Long' ? 1 : -1) * e.qty * 20, 0);
    rec('przebieg', Math.abs(tr.exitPrice - wavg) < 1e-6 && tr.pnl === Math.round(gross * 100) / 100 && tr.tp === found.order.tp && tr.tps.length === 3 && tr.tps[0].hit && tr.tps[1].hit && !tr.tps[2].hit, `trade: exitPrice ${tr.exitPrice} (średnia ${wavg}), pnl ${tr.pnl} (suma wyjść ${gross}), tp ${tr.tp} = ostatni cel, trafione TP1 i TP2, TP3 nie`);
    rec('przebieg', tr.r === Math.round((gross / (8 * 15 * 20)) * 100) / 100, `R łączne ${tr.r} = suma wyjść / rUsd ${8 * 15 * 20}`);
    // w odtwarzaniu pozycja była widziana z trafionym TP1 i TP2 (ostatnie wyjście zamyka pozycję, więc klatka jej już nie widzi), a trade ma wyjścia w kolejności tp1, tp2, sl
    rec('przebieg', seen.join('|') === 'tp1|tp2' && tr.exits.map((e) => e.tpId ?? e.reason).join('|') === 'tp1|tp2|sl', `kolejność wyjść: w odtwarzaniu ${seen.join(' | ')}, w trade'u ${tr.exits.map((e) => e.tpId ?? e.reason).join(' | ')}`);
    info.trades = [{ id: tr.id, r: tr.r, pnl: tr.pnl, entryPrice: tr.entryPrice, exitPrice: tr.exitPrice, tp: tr.tp, beAt: tr.beAt, sl0: tr.sl0 }];
    for (let i = 0; i < 100 && RP.doc().trades.find((x) => x.id === tr.id)?.notion?.state !== 'sent'; i++) await sleep(50);
    rec('przebieg', RP.doc().trades.find((x) => x.id === tr.id)?.notion?.state === 'sent', `trade ${tr.id} w atrapie Notion (stan ${RP.doc().trades.find((x) => x.id === tr.id)?.notion?.state})`);
    info.sentIds = [tr.id];
  });

  await section('klatki', async () => {
    // odtwarzanie 100× z drabiną (cztery poziomy z plakietkami, uzbrojony auto BE, szuflada): pozycja z SL 400 pkt i poziomami 300–600 pkt się nie zamyka
    // nowa sesja: cofnięcie kursora w pierwszej zablokowałoby handel („przeglądasz wstecz”)
    RP.close(); await sleep(200);
    const doc2 = newSessionDoc({ id: newSessionId(), name: 'Sesja 175 klatki', def: doc.def, now: Date.now() });
    doc2.layout = { kind: '1', active: 0, charts: [{ instrument: 'NQ', tf: '1s' }] };
    await client.create(doc2);
    RP = await openOne(doc2);
    await RP.goTo(nyAt(DAY, '10:30')); await sleep(150);
    moreOpen();
    P('[data-pr=""]').click(); await sleep(60);
    const setF = (n, v) => { const el = P(`[name="${n}"]`); el.value = String(v); el.dispatchEvent(new Event('input', { bubbles: true })); };
    setF('sl', 400); setF('tp', 300);
    for (const [n, v] of [['tp2', 400], ['tp3', 500], ['tp4', 600]]) { P('.bt-tp-add').click(); await sleep(20); setF(n, v); }
    setF('qty', 8);
    if (!P('[name="abeOn"]').checked) P('[name="abeOn"]').click();
    P('[data-abek="pts"]').click(); setF('abeVal', 350);
    P('[data-o="buy"]').click(); await sleep(150);
    rec('klatki', !!pos() && pos().tps.length === 4 && pos().autoBe?.kind === 'pts' && !pos().autoBe.done, `pozycja z czterema poziomami i uzbrojonym auto BE: ${pos()?.tps?.length} poziomy, ${JSON.stringify(pos()?.autoBe)}`);
    RP.dock().setTab('pos'); await sleep(100);
    rec('klatki', ['ptp', 'ptp2', 'ptp3', 'ptp4', 'pbe'].every((k) => ch().tradeLayer().querySelector(`[data-k="${k}"]`)) && /\(25%\)/.test(RP.dock().el.querySelector('[data-c="tp"]')?.textContent || ''), 'plakietki czterech poziomów, progu i kolumna TP szuflady widoczne podczas odtwarzania');
    const end = nyAt(DAY, '11:00');
    RP.setSpeed(100);
    const ts = [], t0 = performance.now();
    await new Promise((done) => {
      const loop = (t) => {
        ts.push(t);
        if (RP.cursor() >= end || !pos() || performance.now() - t0 > 90000) { RP.pause(); done(); return; }
        requestAnimationFrame(loop);
      };
      RP.play();
      requestAnimationFrame(loop);
    });
    const gaps = []; for (let i = 11; i < ts.length; i++) gaps.push(ts[i] - ts[i - 1]);
    let worst = 0; for (const g of gaps) if (g > worst) worst = g;
    const slow = gaps.filter((g) => g > 34).length;
    info.frames = gaps.length; info.slow = slow; info.worst = worst;
    rec('klatki', gaps.length > 30, `odtwarzanie zmierzyło ${gaps.length} klatek`);
    rec('klatki', !!pos() && pos().tps.every((x) => !x.hit), 'pozycja z drabiną przeżyła odtwarzanie (żaden poziom nie trafiony)');
    // konwencja repo z pakietu 1 (§9, decyzja sesji głównej 2.11.2026): ≤ 1% klatek > 34 ms i żadna klatka > 100 ms
    rec('klatki', slow / gaps.length <= 0.01, `klatki > 34 ms: ${slow} z ${gaps.length} (próg 1%); najdłuższa ${worst.toFixed(1)} ms`);
    rec('klatki', worst <= 100, `żadna klatka > 100 ms (najdłuższa ${worst.toFixed(1)} ms)`);

    // runda 2 (przegląd kodu P3-3): druga faza z poziomami trafianymi W TRAKCIE pomiaru (przebudowa warstwy, komunikat aria-live, szuflada, Journal), ten sam próg.
    // Poziomy 3/6/9/12 pkt od wejścia, SL 400 pkt, bez auto BE; kierunek wybrany po świecach, które jeszcze nie były pokazane (TP1 i TP2 osiągnięte w ciągu 1200 świec).
    RP.orders().closeAll(); await sleep(150);
    for (const o of [...RP.book().orders]) RP.orders().cancel(o.id);
    const st2 = RP.data().stream('NQ'), n0 = visibleCount(st2, RP.cursor()), entry2 = st2.bars[n0 - 1][4];
    let side2 = null;
    for (const d of ['buy', 'sell']) {
      const sg = d === 'buy' ? 1 : -1;
      let i1 = -1, i2 = -1;
      for (let i = n0; i < Math.min(st2.bars.length, n0 + 1200); i++) {
        const ex = sg > 0 ? st2.bars[i][2] - entry2 : entry2 - st2.bars[i][3];
        if (i1 < 0 && ex >= 3) i1 = i;
        if (ex >= 6) { i2 = i; break; }
      }
      if (i1 >= 0 && i2 >= 0) { side2 = d; break; }
    }
    rec('klatki', !!side2, `kierunek z trafieniem TP1 i TP2 w ciągu 1200 świec: ${side2}`);
    if (side2) {
      if (P('[name="abeOn"]').checked) P('[name="abeOn"]').click();
      for (const [n, v] of [['tp', 3], ['tp2', 6], ['tp3', 9], ['tp4', 12]]) setF(n, v);
      setF('sl', 400); setF('qty', 8);
      P(`[data-o="${side2}"]`).click(); await sleep(150);
      rec('klatki', !!pos() && pos().tps.length === 4 && pos().tps.every((x) => !x.hit), `druga pozycja z czterema poziomami: ${pos()?.tps?.map((x) => x.price)}`);
      const ts2 = [], u0 = performance.now();
      let after = 0;
      await new Promise((done) => {
        const loop = (t) => {
          ts2.push(t);
          const hit = pos()?.tps?.filter((x) => x.hit).length ?? 0;
          if (hit >= 2) after++;
          if (after >= 40 || !pos() || performance.now() - u0 > 60000) { RP.pause(); done(); return; }
          requestAnimationFrame(loop);
        };
        RP.setSpeed(100); RP.play();
        requestAnimationFrame(loop);
      });
      const g2 = []; for (let i = 6; i < ts2.length; i++) g2.push(ts2[i] - ts2[i - 1]);
      let worst2 = 0; for (const g of g2) if (g > worst2) worst2 = g;
      const slow2 = g2.filter((g) => g > 34).length;
      info.frames2 = g2.length; info.slow2 = slow2; info.worst2 = worst2;
      rec('klatki', (pos()?.tps?.filter((x) => x.hit).length ?? 0) >= 2 && g2.length > 30, `poziomy trafione w trakcie pomiaru: ${pos()?.tps?.filter((x) => x.hit).length ?? 0} z 4, ${g2.length} klatek`);
      rec('klatki', slow2 / g2.length <= 0.01, `z trafieniami: klatki > 34 ms: ${slow2} z ${g2.length} (próg 1%); najdłuższa ${worst2.toFixed(1)} ms`);
      rec('klatki', worst2 <= 100, `z trafieniami: żadna klatka > 100 ms (najdłuższa ${worst2.toFixed(1)} ms)`);
    }
  });

  out.textContent = JSON.stringify({ checks, info });
} catch (e) {
  out.textContent = JSON.stringify({ checks, info, fatal: String(e && e.stack || e) });
}
</script>
</body>
</html>
