<!doctype html>
<html lang="pl" data-theme="onyx">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<base href="/">
<title>JustJournal: pozycja na wykresie 1.7-1, odbiór na prawdziwych świecach</title>
<!-- Strona odbioru 1.7-1 (testy/backtest-e2e.mjs, sekcja `171`): prawdziwe świece NQ 1s od 10:30 NY (CPI 2024-03-12), serwer z atrapą Notion. Przebieg: wejście bez SL → +SL → przeciągnięcie
     → zamknięcie części 50% „od pierwotnej” → BE (jeśli cena po stronie zysku) → zamknięcie → trade w atrapie Notion z `sl` = pierwszy SL; potem odtwarzanie 100× z pozycją, liniami,
     plakietkami i szufladą: 0 klatek dłuższych niż 34 ms. Wynik: pre#wynik z JSON-em { checks: [{ tag, ok, msg }], info, fatal }. -->
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/features.css">
<style>
  body { margin: 0; background: var(--chrome); color: var(--fg); }
  #wynik { white-space: pre-wrap; font: 12px ui-monospace, Consolas, monospace; }
</style>
</head>
<body>
<pre id="wynik">…</pre>
<script type="module">
const out = document.getElementById('wynik');
const checks = [], info = {};
const rec = (tag, cond, msg) => checks.push({ tag, ok: !!cond, msg });
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const until = async (fn, ms = 8000) => { const t0 = performance.now(); while (performance.now() - t0 < ms) { const v = await fn(); if (v) return v; await sleep(20); } return null; };
window.addEventListener('error', (e) => rec('błąd strony', false, e.error?.stack || e.message));
window.addEventListener('unhandledrejection', (e) => rec('błąd strony', false, String(e.reason?.stack || e.reason)));
const section = async (tag, fn) => { try { await fn(); } catch (e) { rec(tag, false, `sekcja przerwana: ${e && e.stack || e}`); } };

try {
  try { localStorage.removeItem('thq.bt.open.v1'); localStorage.removeItem('thq.bt.dock.v1'); localStorage.removeItem('thq.bt.ord.v1'); localStorage.setItem('thq.chart.overlays.v1', JSON.stringify({ sessions: false, pdhl: false })); } catch { /* bez localStorage */ }
  const { openReplay } = await import('/js/bt-replay.js');
  const { createSessionClient, newSessionId } = await import('/js/bt-klient.js');
  const { newSessionDoc } = await import('/js/bt-kreator.js');
  const { nyAt } = await import('/js/bt-czas.js');
  const DAY = '2024-03-12';
  const client = createSessionClient();
  const doc = newSessionDoc({
    id: newSessionId(), name: 'Sesja 171 odbiór',
    def: { instruments: ['NQ'], from: DAY, balance: 50000, risk: { mode: 'pct', value: 5 }, riskBase: 'current', commission: 0, startTime: '09:00', accountId: null, filter: null, excluded: [] },
    now: Date.now(),
  });
  doc.layout = { kind: '1', active: 0, charts: [{ instrument: 'NQ', tf: '1s' }] };
  await client.create(doc);
  const RP = openReplay(document.body, { sessionId: doc.id, client, onClosed: () => {}, notionEveryMs: 0 });
  await RP.ready;
  info.sessionId = doc.id;
  const scr = () => document.querySelector('.bt-screen');
  // Wysyłka w toku: sendNotion zwraca wtedy null i odkłada prośbę do kolejki. Przed „Zapisz do Notion”, którego wynik test sprawdza, czekamy warunkiem na koniec wysyłki
  // (aria-busy na przycisku, kolejka trzyma go zajętym do końca), a nie stałym czasem. Gdy przycisk nie zwalnia się albo druga wysyłka nie rusza, wynik jest null i sprawdzenie pada.
  const notionIdle = () => until(() => scr()?.querySelector('[data-bt="notion"]')?.getAttribute('aria-busy') === 'false', 15000);
  const P = (sel) => scr().querySelector(`.bt-ord ${sel}`);
  const setF = (n, v) => { const el = P(`[name="${n}"]`); el.value = String(v); el.dispatchEvent(new Event('input', { bubbles: true })); };
  const pos = () => RP.book().positions.NQ;
  const ch = () => RP.chart();
  const host = () => scr().querySelector('.bt-plot');
  const layer = () => ch().tradeLayer();
  const tag = (k) => layer().querySelector(`[data-k="${k}"]`);
  const focusTag = (k) => { const el = tag(k); el.focus(); el.dispatchEvent(new FocusEvent('focusin', { bubbles: true })); };
  const yPx = (px) => host().getBoundingClientRect().top + ch().series.priceToCoordinate(px);
  const q = (x) => Math.round(x / 0.25) * 0.25;
  const lastPx = () => { const b = ch().bars(); return b[b.length - 1][4]; };
  const pe = (type, el, x, y) => el.dispatchEvent(new PointerEvent(type, { bubbles: true, cancelable: true, clientX: x, clientY: y, pointerId: 9, pointerType: 'mouse', button: 0, buttons: type === 'pointerup' ? 0 : 1, isPrimary: true }));
  // widoczny tekst plakietki: .bt-tag-t i ostrzeżenie „bez SL” tylko, gdy nie jest ukryte (textContent całej plakietki czyta też ukryte węzły)
  const mainText = (k) => tag(k)?.querySelector('.bt-tag-t')?.textContent ?? '';
  const warnShown = () => { const w = tag('pos')?.querySelector('.bt-tag-warn'); return !!w && !w.hidden && getComputedStyle(w).display !== 'none'; };
  const stepN = async (n) => { for (let i = 0; i < n; i++) await RP.step(1); await sleep(40); };

  await RP.goTo(nyAt(DAY, '10:30')); await sleep(120);

  await section('przebieg', async () => {
    // wejście bez SL (ręczna wielkość 4)
    setF('sl', ''); setF('tp', ''); setF('qty', 4);
    RP.orders().submit('buy'); await sleep(80);
    rec('przebieg', !!pos() && pos().sl === null && pos().qty === 4, 'wejście bez SL, 4 kontrakty');
    await stepN(5);
    rec('przebieg', warnShown() && /R —$/.test(mainText('pos')), `plakietka: «${mainText('pos')}», ostrzeżenie „bez SL” widoczne: ${warnShown()}`);
    // +SL: linia w ręku, klik zatwierdza (40 pkt pod wejściem)
    focusTag('pos'); await sleep(40);
    layer().querySelector('[data-tl="sl+"]').click(); await sleep(40);
    const hr = host().getBoundingClientRect(), want = q(pos().entryPrice - 40);
    pe('pointermove', host(), hr.left + 250, yPx(want)); await sleep(40);
    pe('pointerdown', host(), hr.left + 250, yPx(want)); pe('pointerup', host(), hr.left + 250, yPx(want)); await sleep(100);
    const sl1 = pos()?.sl;
    rec('przebieg', pos() && Math.abs(sl1 - want) <= 0.5 && pos().sl0 === sl1 && pos().rUsd > 0, `+SL: sl = sl0 = ${sl1}, rUsd ${pos()?.rUsd}`);
    // przeciągnięcie SL bliżej ceny (R zostaje od pierwszego SL)
    const tgt = q(sl1 + 15);
    if (tgt < lastPx() - 1) {
      const el = tag('psl'), r = el.getBoundingClientRect();
      pe('pointerdown', el, r.left + 10, r.top + r.height / 2); pe('pointermove', el, r.left + 10, yPx(tgt)); await sleep(40); pe('pointerup', el, r.left + 10, yPx(tgt)); await sleep(100);
      rec('przebieg', pos().sl === tgt && pos().sl0 === sl1, `przeciągnięcie SL: ${sl1} → ${pos().sl}, sl0 ${pos().sl0}`);
    } else rec('przebieg', true, 'cena za blisko SL, przeciągnięcie pominięte');
    // zamknięcie części: 1, potem 50% „od pierwotnej” (2 z 4) z okna
    RP.orders().closeQty('NQ', 1); await sleep(80);
    rec('przebieg', pos().openQty === 3, 'zamknięty 1 kontrakt (3 z 4)');
    focusTag('pos'); await sleep(30);
    layer().querySelector('[data-tl="x"]').click(); await sleep(60);
    layer().querySelector('.bt-part [data-tl="base"][data-base="orig"]').click(); await sleep(30);
    const b50 = layer().querySelector('.bt-part [data-tl="pct"][data-pct="50"]');
    rec('przebieg', /2 z 3/.test(b50?.textContent || ''), `50% od pierwotnej 4 = 2 z 3: «${b50?.textContent}»`);
    b50.click(); await sleep(100);
    rec('przebieg', pos().openQty === 1 && pos().exits.at(-1).reason === 'partial', `po 50% od pierwotnej zostaje ${pos()?.openQty}`);
    // BE: po stronie zysku ustawia SL na średnią, inaczej nieaktywne z podpowiedzią
    focusTag('pos'); await sleep(30);
    const be = layer().querySelector('[data-tl="be"]');
    if (!be.disabled) { be.click(); await sleep(80); rec('przebieg', pos().be === true && pos().sl === pos().entryPrice, 'BE ustawiony po stronie zysku'); info.beSet = true; }
    else { rec('przebieg', /poniżej|already|już/i.test(be.title), `BE nieaktywne z podpowiedzią «${be.title}»`); info.beSet = false; }
    // zamknięcie
    const first = sl1;
    RP.orders().closeAll(); await sleep(200);
    const tr = RP.doc().trades.at(-1);
    info.firstSl = first;
    info.trades = [{ id: tr.id, sl0: tr.sl0, r: tr.r, pnl: tr.pnl, tp: tr.tp, be: tr.be }];
    rec('przebieg', !pos() && tr && tr.sl0 === first && Number.isFinite(tr.r), `trade ${tr?.id}: sl0 = pierwszy SL ${tr?.sl0}, R ${tr?.r}, wyjść ${tr?.exits?.length}`);
    await notionIdle();
    const sent = await RP.sendNotion({ all: true });
    rec('przebieg', !!sent && !(sent.failed || []).length, `wysyłka do atrapy Notion: wysłano ${sent?.sent}, błędów ${(sent?.failed || []).length}`);
    info.sentIds = [tr.id];
  });

  await section('klatki', async () => {
    // odtwarzanie 100× z pozycją, liniami, plakietkami i szufladą: 0 klatek > 34 ms
    // z wyjściami częściowymi: 4 kontrakty, dwa razy po 1 zamknięte, zostają 2 (liczenie MAE/MFE przyrostowe, bez przebiegu od początku strumienia)
    setF('sl', 400); setF('tp', 800); setF('qty', 4);
    RP.orders().submit('buy'); await sleep(100);
    RP.orders().closeQty('NQ', 1); await sleep(60);
    RP.orders().closeQty('NQ', 1); await sleep(60);
    rec('klatki', !!pos() && pos().openQty === 2 && pos().exits.length === 2, 'pozycja 2 z 4 po dwóch wyjściach częściowych');
    RP.dock().setTab('pos');
    const end = nyAt(DAY, '11:00');
    RP.setSpeed(100);
    const ts = [], t0 = performance.now();
    await new Promise((done) => {
      const loop = (t) => {
        ts.push(t);
        if (RP.cursor() >= end || !pos() || performance.now() - t0 > 90000) { RP.pause(); done(); return; }
        requestAnimationFrame(loop);
      };
      RP.play();
      requestAnimationFrame(loop);
    });
    const gaps = []; for (let i = 11; i < ts.length; i++) gaps.push(ts[i] - ts[i - 1]);
    const slow = gaps.filter((g) => g > 34).length, worst = Math.max(...gaps, 0);
    info.frames = gaps.length; info.slow = slow; info.worst = worst;
    rec('klatki', gaps.length > 30, `odtwarzanie zmierzyło ${gaps.length} klatek`);
    // próg jak w L/M (backtest-wydajnosc.html): najwyżej 1% klatek dłuższych niż 34 ms
    rec('klatki', slow / gaps.length <= 0.01, `klatki > 34 ms: ${slow} z ${gaps.length} (próg 1%); najdłuższa ${worst.toFixed(1)} ms`);
  });

  out.textContent = JSON.stringify({ checks, info });
} catch (e) {
  out.textContent = JSON.stringify({ checks, info, fatal: String(e && e.stack || e) });
}
</script>
</body>
</html>
