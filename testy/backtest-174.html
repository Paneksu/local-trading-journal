<!doctype html>
<html lang="pl" data-theme="onyx">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<base href="/">
<title>JustJournal: prawy klik i nawigacja 1.7-4 (strona robocza)</title>
<!-- Strona robocza testów backtest-174 (testy/backtest-174-strona.mjs), Chrome/Edge headless przez CDP, tylko na dashboardzie testowym (THQ_TEST_PAGES=1) pod /__testy/.
     Prawdziwy replay na świecach syntetycznych: menu prawego kliku (zlecenia po cenie kliknięcia z presetu i z panelu, Dołóż, SL i TP tutaj, „Użyj 1 kontraktu”, klawiatura, Esc, odbicie od krawędzi,
     brak menu przy narzędziu rysowania, na rysunku, na osiach i na plakietkach, drugi wykres zleca swój instrument), krok niezależny od interwału (menu kroku, zapis w sesji, klawisze, krok własny),
     skok do daty (w przód, wstecz jako przeglądanie, przed startem, weekend) i do ceny (znaleziono, SL po drodze z komunikatem, nie znaleziono z „Szukaj dalej”, Anuluj), brak przykrywania
     (elementFromPoint), 375 px (tylko przytrzymanie otwiera menu, ruch przewija, brak poziomego przewijania).
     Parametry: ?w=375, ?theme=platinum, ?shots=1 (zrzuty przez most CDP window.__shot). Wynik: pre#wynik z JSON-em { checks: [{ tag, ok, msg }], fatal }.
     Zasada tej strony: każda asercja może zawieść (żadnych gałęzi „pominięte = zdane”, OR-ów zawsze prawdziwych ani szukania po textContent z ukrytymi spanami). -->
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/features.css">
<style>
  body { margin: 0; background: var(--chrome); color: var(--fg); }
  #wynik { white-space: pre-wrap; font: 12px ui-monospace, Consolas, monospace; }
  body.run #wynik { position: fixed; left: -9999px; }
</style>
</head>
<body class="run">
<pre id="wynik">…</pre>
<script type="module">
const out = document.getElementById('wynik');
const qs = new URLSearchParams(location.search);
const narrow = qs.get('w') === '375';
const shots = qs.get('shots') === '1';
const wide = !narrow || shots;
document.documentElement.dataset.theme = qs.get('theme') === 'platinum' ? 'platinum' : 'onyx';
const checks = [];
const rec = (tag, cond, msg) => checks.push({ tag, ok: !!cond, msg });
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const until = async (fn, ms = 8000) => { const t0 = performance.now(); while (performance.now() - t0 < ms) { const v = await fn(); if (v) return v; await sleep(20); } return null; };
window.addEventListener('error', (e) => rec('błąd strony', false, e.error?.stack || e.message));
window.addEventListener('unhandledrejection', (e) => rec('błąd strony', false, String(e.reason?.stack || e.reason)));
const section = async (tag, fn) => { try { await fn(); } catch (e) { rec(tag, false, `sekcja przerwana: ${e && e.stack || e}`); } };
const key = (k, extra = {}, target = document.body) => { const ev = new KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true, ...extra }); target.dispatchEvent(ev); return ev; };
let shotId = 0;
const shot = async (name) => {
  if (!shots || !window.__shot) return;
  const id = ++shotId;
  const tz = document.getElementById('toast');
  if (tz) tz.hidden = true;
  await sleep(150);
  window.__shot(JSON.stringify({ id, name: `${name}-${qs.get('theme') === 'platinum' ? 'platinum' : 'onyx'}-${narrow ? 375 : 1920}` }));
  await until(() => window.__done?.[id], 10000);
};

try {
  try { for (const k of ['thq.bt.open.v1', 'thq.bt.dock.v1', 'thq.bt.ord.v1', 'thq.bt.jump.v1', 'thq.bt.layout.v1']) localStorage.removeItem(k); localStorage.setItem('thq.chart.overlays.v1', JSON.stringify({ sessions: false, pdhl: false })); } catch { /* bez localStorage */ }
  const { openReplay } = await import('/js/bt-replay.js');
  const { createSessionClient, newSessionId } = await import('/js/bt-klient.js');
  const { newSessionDoc } = await import('/js/bt-kreator.js');
  const { nyAt, sanitizeBt } = await import('/js/bt-czas.js');
  const { visibleCount } = await import('/js/bt-swieca.js');
  const { pxText } = await import('/js/bt-journal.js');
  const client = createSessionClient();
  client.notion = async () => ({ sent: 0, skipped: 0, failed: [], pending: 0, notion: {} });
  const mkDef = (o = {}) => ({ instruments: ['NQ'], from: '2024-03-12', balance: 50000, risk: { mode: 'usd', value: 400 }, riskBase: 'current', commission: 0, startTime: '09:00', accountId: null, filter: null, excluded: [], ...o });
  const SCALP = { id: 'scalp', name: 'Scalp', sl: { unit: 'pts', value: 10 }, tps: [{ unit: 'rr', value: 2, pct: 100 }], size: { mode: 'session', value: 0 }, autoBe: { kind: 'r', value: 1, offsetTicks: 0 } };
  const MIKRO = { id: 'mikro', name: 'Mikro', sl: { unit: 'pts', value: 2 }, tps: [{ unit: 'rr', value: 2, pct: 100 }], size: { mode: 'session', value: 0 }, autoBe: null };
  // runda 2: presety ze stałym ryzykiem w $ (800 $) i w % salda (2% z 50 000 $), do porównania ilości menu z polem „Wielkość”
  const USD800 = { id: 'usd800', name: 'Skala 800', sl: { unit: 'pts', value: 10 }, tps: [], size: { mode: 'usd', value: 800 }, autoBe: null };
  const PCT2 = { id: 'pct2', name: 'Skala 2%', sl: { unit: 'pts', value: 10 }, tps: [], size: { mode: 'pct', value: 2 }, autoBe: null };
  let btSet = sanitizeBt({ presets: [SCALP, MIKRO, USD800, PCT2] });
  const patches = [];
  const open = async (def, name, layout = null) => {
    const doc = newSessionDoc({ id: newSessionId(), name, def, now: Date.now() });
    if (layout) doc.layout = layout;
    await client.create(doc);
    // nowa sesja dostaje ostatnio użyty układ wykresów (D1): każda zaczyna od jednego wykresu, o ile test nie ustawił układu sam
    if (!layout) { try { localStorage.removeItem('thq.bt.layout.v1'); } catch { /* bez localStorage */ } }
    const RP = openReplay(document.body, { sessionId: doc.id, client, onClosed: () => {}, notionEveryMs: 0, getSettings: () => btSet, onPresets: (patch) => { patches.push(patch); btSet = sanitizeBt({ ...btSet, ...patch }); } });
    await RP.ready;
    return { RP, id: doc.id };
  };
  let { RP, id: sid } = await open(mkDef(), 'Sesja 174');
  // świeża sesja: cofnięcie kursora w poprzedniej zablokowałoby handel („przeglądasz wstecz”)
  const fresh = async (name, { def = mkDef(), layout = null, at = '10:30', preset = 'scalp' } = {}) => {
    RP.close(); await sleep(200);
    ({ RP, id: sid } = await open(def, name, layout));
    await RP.goTo(nyAt(def.from, at)); await sleep(150);
    RP.setTf('1m'); await sleep(150);
    document.querySelectorAll('.bt-jr').forEach((x) => x.remove());
    RP.orders().choosePreset(preset || null); await sleep(100);
  };
  const scr = () => document.querySelector('.bt-screen');
  const P = (sel) => scr().querySelector(`.bt-ord ${sel}`);
  const setF = (n, v) => { const el = P(`[name="${n}"]`); el.value = String(v); el.dispatchEvent(new Event('input', { bubbles: true })); };
  const pos = () => RP.book().positions.NQ;
  const ch = (i = 0) => RP.charts()[i];
  const hostOf = (i = 0) => scr().querySelectorAll('.bt-plot')[i];
  const q = (x) => Math.round(x / 0.25) * 0.25;
  const norm = (s) => String(s).replace(/\s+/g, ' ').trim();
  const num = (s) => Number(String(s).replace(/\s/g, '').replace(',', '.'));
  const centerOf = (el) => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
  const lastPx = (inst = 'NQ') => { const st = RP.data().stream(inst); const n = visibleCount(st, RP.cursor()); return st.bars[n - 1][4]; };
  const menu = () => scr().querySelector('.bt-cm');
  const item = (id) => menu()?.querySelector(`[data-mi="${id}"]`);
  const itemIds = () => [...(menu()?.querySelectorAll('[data-mi]') || [])].map((x) => x.dataset.mi);
  const lab = (id) => norm(item(id)?.querySelector('.bt-cm-l')?.textContent ?? '');
  const det = (id) => norm(item(id)?.querySelector('.bt-cm-d')?.textContent ?? '');
  const closeMenu = async () => { if (menu()) { key('Escape', {}, menu()); await sleep(40); } };
  const closeAllNow = async () => { RP.orders().closeAll(); await sleep(60); for (const o of [...RP.book().orders]) RP.orders().cancel(o.id); await sleep(40); };
  const yOfPx = (px, i = 0) => hostOf(i).getBoundingClientRect().top + ch(i).series.priceToCoordinate(px);
  // prawy klik na wykresie i-tym w cenie px (x w polu świec, domyślnie 140 px od lewej); zwraca zdarzenie (defaultPrevented)
  let cp = null;
  const rightClick = async (px, { i = 0, x = null, y = null, target = null, inst = null } = {}) => {
    const r = hostOf(i).getBoundingClientRect();
    const cx = x ?? r.left + 140, cy = y ?? yOfPx(px, i);
    const el = target || document.elementFromPoint(cx, cy) || hostOf(i);
    const ev = new MouseEvent('contextmenu', { bubbles: true, cancelable: true, clientX: cx, clientY: cy, button: 2, buttons: 2, view: window });
    el.dispatchEvent(ev);
    await sleep(70);
    cp = menu() ? Number(menu().dataset.price) : null;
    return ev;
  };
  const hits = (els) => {
    const bad = [];
    let n = 0;
    for (const b of els) {
      const r = b.getBoundingClientRect();
      if (r.width < 1 || r.height < 1 || getComputedStyle(b).visibility === 'hidden') continue;
      n++;
      const hit = document.elementFromPoint(r.left + r.width / 2, r.top + r.height / 2);
      if (!(hit === b || b.contains(hit))) bad.push(`${b.dataset.mi || b.dataset.bt || b.dataset.gojump || b.className} → ${hit?.dataset?.mi || hit?.className || hit?.tagName}`);
    }
    return { n, bad };
  };
  const msgText = () => norm(scr().querySelector('.bt-msg')?.textContent ?? '');
  const findEl = () => scr().querySelector('.bt-find');
  const findText = () => norm(findEl()?.querySelector('.bt-find-t')?.textContent ?? '');
  const settle = async () => { await until(() => !RP.busy(), 20000); await sleep(120); };

  await RP.goTo(nyAt('2024-03-12', '10:30')); await sleep(150);
  RP.setTf('1m'); await sleep(150);
  document.querySelectorAll('.bt-jr').forEach((x) => x.remove());
  RP.orders().choosePreset('scalp'); await sleep(120);

  // ---------- menu: zlecenia po cenie kliknięcia z presetu i z panelu ----------
  if (wide) await section('menu', async () => {
    await closeAllNow();
    const L = lastPx();
    let up = q(L + 3), dn = q(L - 3);
    rec('menu', !menu(), 'menu zamknięte na starcie');
    // nad rynkiem: Sprzedaj limit i Kup stop, opis z presetu
    const ev = await rightClick(up);
    rec('menu', !!menu() && Math.abs(cp - up) <= 0.5, `cena kliknięcia z menu (${cp}) leży w pół punktu od zamierzonej (${up})`);
    up = cp;
    rec('menu', ev.defaultPrevented && !!menu(), `prawy klik otwiera menu własne i wyłącza menu przeglądarki (zdarzenie anulowane: ${ev.defaultPrevented})`);
    rec('menu', menu()?.getAttribute('role') === 'menu' && !!menu()?.getAttribute('aria-label'), `menu ma role=menu i nazwę («${menu()?.getAttribute('aria-label')}»)`);
    const ordIds = itemIds().filter((x) => x.startsWith('order-')).sort();
    rec('menu', ordIds.join() === 'order-buy-stop,order-sell-limit', `nad rynkiem: ${ordIds.join(', ')}`);
    rec('menu', lab('order-sell-limit').startsWith(`Sprzedaj limit 2 @ ${norm(pxText(up))}`) && /SL 10 pkt/.test(lab('order-sell-limit')) && /−400/.test(lab('order-sell-limit')), `etykieta: «${lab('order-sell-limit')}»`);
    rec('menu', det('order-sell-limit') === 'preset Scalp', `druga linia: «${det('order-sell-limit')}»`);
    rec('menu', itemIds().includes('jump-price') && lab('jump-price').startsWith('Skocz do ceny'), `Skocz do ceny jest w menu («${lab('jump-price')}»)`);
    rec('menu', !itemIds().includes('jump-date'), 'Skocz do daty tylko w marginesie za ostatnią świecą');
    await shot('menu-bez-pozycji');
    // klawiatura: strzałki, Home, End, Esc z powrotem fokusu na wykres
    const items = [...menu().querySelectorAll('[role="menuitem"]')];
    rec('menu', items.length >= 3 && items.every((b) => b.tagName === 'BUTTON'), `pozycje to przyciski role=menuitem (${items.length})`);
    // runda 2 (P2-1): po otwarciu fokus stoi na pierwszej aktywnej pozycji (bez żadnego klawisza), strzałka idzie do drugiej
    rec('menu', document.activeElement === items.find((b) => b.getAttribute('aria-disabled') !== 'true'), `fokus po otwarciu na pierwszej aktywnej pozycji (aktywny: ${document.activeElement?.dataset?.mi ?? document.activeElement?.tagName})`);
    key('ArrowDown', {}, document.activeElement);
    rec('menu', document.activeElement === items[1], 'strzałka w dół z pierwszej: druga pozycja');
    key('End', {}, document.activeElement);
    rec('menu', document.activeElement === items[items.length - 1], 'End: ostatnia pozycja');
    key('Home', {}, document.activeElement);
    rec('menu', document.activeElement === items[0], 'Home: pierwsza pozycja');
    key('ArrowUp', {}, document.activeElement);
    rec('menu', document.activeElement === items[items.length - 1], 'strzałka w górę z pierwszej: ostatnia');
    key('Escape', {}, document.activeElement); await sleep(60);
    rec('menu', !menu() && hostOf().contains(document.activeElement), `Esc zamyka menu, fokus wraca na wykres (aktywny: ${document.activeElement?.className})`);
    // klik obok zamyka
    await rightClick(up); up = cp;
    document.body.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, clientX: 5, clientY: 5, pointerType: 'mouse', button: 0 })); await sleep(50);
    rec('menu', !menu(), 'klik obok zamyka menu');
    // wybór Enterem: Sprzedaj limit (dwie akcje: prawy klik i wybór)
    await rightClick(up); up = cp;
    const first = document.activeElement;
    rec('menu', first.dataset.mi?.startsWith('order-'), `pierwsza pozycja z fokusem po otwarciu: ${first.dataset.mi}`);
    document.querySelector('[data-mi="order-sell-limit"]').focus();
    key('Enter', {}, document.activeElement); await sleep(120);
    let o = RP.book().orders[0];
    rec('menu', !menu() && RP.book().orders.length === 1 && o.side === 'sell' && o.type === 'limit' && o.price === up && o.qty === 2 && o.sl === up + 10 && o.tp === up - 20, `Enter składa Sprzedaj limit: ${JSON.stringify(o && { side: o.side, type: o.type, price: o.price, qty: o.qty, sl: o.sl, tp: o.tp })}`);
    rec('menu', o.autoBe?.kind === 'r' && o.autoBe.value === 1 && o.intent === 'open', `zlecenie niesie auto BE z presetu: ${JSON.stringify(o.autoBe)}`);
    // [U] 3.11.2026 «wywalamy to cofniecie czasu usuwa trade, zbedne, mam usuwanie juz manualne wiec jak bede chcial to usune» (pakiet 6 odwołany): order.hist nie jest zapisywane od odbioru 1.7.0
    rec('menu', !('hist' in o) && Number.isFinite(o.placedT), 'zlecenie ma placedT i nie niesie hist');
    await closeAllNow();
    // pod rynkiem: Kup limit i Sprzedaj stop; wybór kliknięciem
    await rightClick(dn); dn = cp;
    rec('menu', itemIds().filter((x) => x.startsWith('order-')).sort().join() === 'order-buy-limit,order-sell-stop', `pod rynkiem: ${itemIds().join(', ')}`);
    item('order-buy-limit').click(); await sleep(120);
    o = RP.book().orders[0];
    rec('menu', RP.book().orders.length === 1 && o.side === 'buy' && o.type === 'limit' && o.price === dn && o.sl === dn - 10 && o.tp === dn + 20, `klik składa Kup limit: SL i TP od ceny kliknięcia ${JSON.stringify(o && { price: o.price, sl: o.sl, tp: o.tp })}`);
    await closeAllNow();
    // ±1 tick od ceny bieżącej: market po cenie bieżącej
    const L2 = lastPx();
    await rightClick(q(L2));
    rec('menu', itemIds().filter((x) => x.startsWith('order-')).sort().join() === 'order-buy-market,order-sell-market', `±1 tick: ${itemIds().join(', ')}`);
    rec('menu', lab('order-buy-market').startsWith('Kup market 2'), `etykieta marketu «${lab('order-buy-market')}»`);
    item('order-buy-market').click(); await sleep(150);
    rec('menu', !!pos() && pos().dir === 'Long' && pos().qty === 2 && pos().entryPrice === L2 && pos().sl === L2 - 10 && pos().tp === L2 + 20, `market po cenie bieżącej: ${pos()?.dir} ${pos()?.qty} @ ${pos()?.entryPrice} SL ${pos()?.sl} TP ${pos()?.tp} (cena ${L2})`);
    // z pozycją Long: pod rynkiem Dołóż limit i SL tutaj, nad rynkiem Dołóż stop i TP tutaj, nigdy zleceń przeciwnych
    const p0 = pos(), Lp = lastPx();
    let below = q(Lp - 4);
    await rightClick(below); below = cp;
    rec('menu', itemIds().filter((x) => !x.startsWith('jump-')).sort().join() === 'add-limit,sl-here', `Long pod rynkiem: ${itemIds().join(', ')}`);
    rec('menu', /^Dołóż limit \d+ @/.test(lab('add-limit')) && /^SL tutaj/.test(lab('sl-here')) && /−/.test(lab('sl-here')), `etykiety «${lab('add-limit')}» / «${lab('sl-here')}»`);
    await shot('menu-z-pozycja');
    item('sl-here').click(); await sleep(120);
    rec('menu', pos().sl === below, `SL tutaj ustawia SL na cenie kliknięcia (${pos()?.sl} = ${below})`);
    rec('menu', pos().log.some((x) => x.k === 'sl' && Number.isFinite(x.at) && x.v === below), `zmiana SL ma wpis w log z at (${JSON.stringify(pos().log.slice(-2))})`);
    let above = q(Lp + 5);
    await rightClick(above); above = cp;
    rec('menu', itemIds().filter((x) => !x.startsWith('jump-')).sort().join() === 'add-stop,tp-here', `Long nad rynkiem: ${itemIds().join(', ')}`);
    item('tp-here').click(); await sleep(120);
    // 1.7-5: „TP tutaj” → „Dodaj TP tutaj”: dodaje kolejny poziom drabiny (nie zastępuje istniejącego TP)
    rec('menu', pos().tps.some((x) => x.price === above) && pos().tps.length === 2 && pos().log.some((x) => x.k === 'tps' && Number.isFinite(x.at)), `Dodaj TP tutaj dodaje poziom ${above} do drabiny (${pos()?.tps?.map((x) => x.price)}) z wpisem w log`);
    // Dołóż limit: oczekująca dokładka (intent add) po cenie kliknięcia
    let addPx = q(Lp - 2);
    await rightClick(addPx); addPx = cp;
    item('add-limit').click(); await sleep(120);
    o = RP.book().orders[0];
    rec('menu', RP.book().orders.length === 1 && o.intent === 'add' && o.side === 'buy' && o.price === addPx, `Dołóż limit składa dokładkę: ${JSON.stringify(o && { intent: o.intent, side: o.side, price: o.price, qty: o.qty })}`);
    await closeAllNow();
    // opis „z panelu”: bez presetu wartości z pól panelu (SL 10, TP 20, ilość z ryzyka sesji)
    RP.orders().choosePreset(null); await sleep(80);
    setF('sl', 10); setF('tp', 20); setF('qty', ''); await sleep(60);
    const L3 = lastPx();
    let up3 = q(L3 + 3);
    await rightClick(up3); up3 = cp;
    rec('menu', det('order-sell-limit') === 'z panelu' && lab('order-sell-limit').startsWith('Sprzedaj limit 2 @'), `bez presetu: «${lab('order-sell-limit')}» / «${det('order-sell-limit')}»`);
    item('order-sell-limit').click(); await sleep(100);
    o = RP.book().orders[0];
    rec('menu', o?.sl === up3 + 10 && o?.tp === up3 - 20 && o?.price === up3, `z panelu: SL i TP od ceny kliknięcia (${o?.sl}, ${o?.tp})`);
    await closeAllNow();
    // ilość 0: SL 400 pkt przy ryzyku 400 $ → pozycja nieaktywna z powodem i „Użyj 1 kontraktu”
    setF('sl', 400); setF('tp', ''); setF('qty', ''); await sleep(60);
    await rightClick(up3); up3 = cp;
    const dis = item('order-sell-limit');
    rec('menu', !!dis && dis.getAttribute('aria-disabled') === 'true' && /Ryzyko za małe na ten SL/.test(dis.title) && /Ryzyko za małe/.test(det('order-sell-limit')), `ilość 0: nieaktywna z powodem («${dis?.title}»)`);
    const one = item('order-sell-limit-one');
    rec('menu', !!one && one.getAttribute('aria-disabled') !== 'true' && /Użyj 1 kontraktu/.test(lab('order-sell-limit-one')), `pozycja „Użyj 1 kontraktu”: «${lab('order-sell-limit-one')}»`);
    dis.click(); await sleep(60);
    rec('menu', !!menu() && RP.book().orders.length === 0, 'klik w nieaktywną pozycję nic nie składa i nie zamyka menu');
    one.click(); await sleep(120);
    rec('menu', RP.book().orders.length === 1 && RP.book().orders[0].qty === 1, 'Użyj 1 kontraktu składa zlecenie na 1 kontrakt');
    await closeAllNow();
    setF('sl', 10); setF('tp', 20); await sleep(40);
    RP.orders().choosePreset('scalp'); await sleep(80);
    // odrzucenie przez silnik wraca komunikatem: dokładka poniżej SL pozycji
    RP.orders().choosePreset(null); await sleep(60);
    setF('sl', 2); setF('tp', ''); setF('qty', 1); await sleep(60);
    RP.orders().submit('buy'); await sleep(120);
    const slq = pos().sl;
    await rightClick(q(slq - 1));
    rec('menu', item('add-limit')?.getAttribute('aria-disabled') === 'true' && /poza SL/.test(item('add-limit').title), `Dołóż za SL pozycji nieaktywne z powodem («${item('add-limit')?.title}»)`);
    await closeMenu();
    await closeAllNow();
    RP.orders().choosePreset('scalp'); await sleep(60);
  });

  // ---------- brak menu: narzędzie rysowania, rysunek, osie, plakietki ----------
  if (wide) await section('bezmenu', async () => {
    await closeAllNow();
    const L = lastPx(), M = ch().rysunki().manager;
    M.setTool('trend-line');
    const ev = await rightClick(q(L + 2));
    rec('bezmenu', !menu() && !ev.defaultPrevented, `aktywne narzędzie rysowania: brak menu, zdarzenie nietknięte (anulowane: ${ev.defaultPrevented})`);
    M.setTool(null); await sleep(40);
    const b = ch().bars(), tl = b[b.length - 1][0], dp = q(L + 2);

      await shot(`r2-okno-${n}`);
      const d = scr().querySelector(`.bt-${n}`), dr = d.getBoundingClientRect(), jr = jb.getBoundingClientRect();
      rec('wyglad', !d.hidden && dr.bottom <= jr.top + 1 && Math.abs(dr.left - jr.left) <= 10, `okno ${n} nad przyciskiem Skocz (okno ${Math.round(dr.left)}–${Math.round(dr.right)} × ${Math.round(dr.top)}–${Math.round(dr.bottom)}, przycisk ${Math.round(jr.left)} × ${Math.round(jr.top)})`);
      const by = ['buy', 'sell'].map((s) => P(`[data-o="${s}"]`).getBoundingClientRect());
      const cover = by.some((b) => dr.left < b.right && dr.right > b.left && dr.top < b.bottom && dr.bottom > b.top);
      rec('wyglad', !cover, `okno ${n} nie przykrywa Kup/Sprzedaj`);
      const tt = parseFloat(getComputedStyle(d.querySelector('.bt-dlg-t')).fontSize);
      rec('wyglad', tt >= 12, `tytuł okna ${n} ma co najmniej 12 px (${tt})`);
      key('Escape', {}, d); await sleep(60);
    }
    // pole ceny w oknie ma spację tysięcy jak reszta ekranu
    key('p'); await sleep(120);
    rec('wyglad', /^\d{2} \d{3},\d{2}$/.test(norm(scr().querySelector('.bt-gp input[name="gpPrice"]').value)), `cena w oknie ze spacją tysięcy: «${scr().querySelector('.bt-gp input[name="gpPrice"]').value}»`);
    const dirTxt = norm(scr().querySelector('.bt-gp .bt-gp-dir')?.textContent ?? '');
    rec('wyglad', dirTxt.includes(norm(pxText(q(lastPx())))) && /od/.test(dirTxt), `okno ceny mówi, od jakiej ceny bieżącej szuka: «${dirTxt}»`);
    key('Escape', {}, scr().querySelector('.bt-gp')); await sleep(60);
  });

  // ---------- runda 2: skok wstecz (przeglądanie przeszłości): nic z przyszłości nie rysuje się ani nie wycenia po cenie z przeszłości ----------
  if (wide) await section('wstecz', async () => {
    await fresh('Sesja 174 (wstecz)');
    RP.orders().choosePreset('scalp'); await sleep(80);
    // zamknięty trade (po kursorze po cofnięciu) i otwarta pozycja z zleceniem oczekującym
    RP.orders().submit('buy'); await sleep(150);
    await RP.goTo(nyAt('2024-03-12', '10:40')); await sleep(150);
    RP.orders().closeAll(); await sleep(150);
    const nTr = RP.doc().trades.length;
    rec('wstecz', nTr === 1, `jeden zamknięty trade (${nTr})`);
    await RP.goTo(nyAt('2024-03-12', '10:50')); await sleep(150);
    // SL 200 pkt bez TP, żeby pozycja przeżyła do 11:10 na syntetycznych świecach
    RP.orders().choosePreset(null); await sleep(60);
    setF('sl', 200); setF('tp', ''); setF('qty', 1); await sleep(60);
    RP.orders().submit('sell'); await sleep(150);
    const entry = pos().entryPrice, dir = pos().dir, qty = pos().openQty;
    await RP.goTo(nyAt('2024-03-12', '11:10')); await sleep(200);
    const hwPx = lastPx(), hwT = RP.book().hw;
    const uplHw = Math.round((hwPx - entry) * -1 * 20 * qty * 100) / 100;
    rec('wstecz', /SHORT/i.test(ch().tradeLayer().textContent) && P('[data-o="back"]').hidden, `przed cofnięciem pozycja jest rysowana (${dir})`);
    rec('wstecz', RP.accountState().upl === uplHw, `przed cofnięciem otwarty wynik po cenie bieżącej (${RP.accountState().upl} = ${uplHw})`);
    // runda 3 (R2-P3-2): księga i trade'y przed przeglądaniem (migawka) muszą być identyczne po „Wróć do teraz”
    const bookBefore = JSON.stringify(RP.book()), tradesBefore = JSON.stringify(RP.doc().trades);
    // pozycja otwarta przed kursorem: kursor w środku jej trwania, etykieta P&L na linii pozycji = otwarty wynik z paska konta (po ostatniej prawdziwej cenie), nie po cenie z przeszłości
    await RP.goTo(nyAt('2024-03-12', '11:00')); await sleep(250);
    const midPx = lastPx(), uplMid = RP.accountState().upl;
    const { fmtMoney } = await import('/js/format.js');
    rec('wstecz', midPx !== hwPx, `kursor w środku trwania pozycji stoi na innej cenie (${midPx}) niż znak wodny (${hwPx})`);
    rec('wstecz', /SHORT/i.test(ch().tradeLayer().textContent), 'pozycja otwarta przed kursorem jest rysowana');
    rec('wstecz', norm(ch().tradeLayer().textContent).includes(norm(fmtMoney(uplHw))) && uplMid === uplHw, `etykieta P&L na linii pozycji (${norm(ch().tradeLayer().textContent).slice(0, 60)}) = otwarty wynik po ostatniej prawdziwej cenie ${norm(fmtMoney(uplHw))}`);
    await RP.goTo(nyAt('2024-03-12', '10:20')); await sleep(250);
    const past = lastPx();
    rec('wstecz', past !== hwPx, `kursor stoi na innej cenie (${past}) niż znak wodny (${hwPx})`);
    rec('wstecz', !/SHORT|LONG/i.test(ch().tradeLayer().textContent), `pozycja otwarta po kursorze nie jest rysowana na wykresie («${norm(ch().tradeLayer().textContent).slice(0, 80)}»)`);
    rec('wstecz', RP.accountState().upl === uplHw, `otwarty wynik liczony po ostatniej prawdziwej cenie ${hwPx}, nie po cenie z przeszłości ${past} (${RP.accountState().upl} = ${uplHw})`);
    const acct = norm(scr().querySelector('.bt-acct')?.textContent ?? '');
    rec('wstecz', /Podgląd przeszłości · P&L z .+ NY/.test(acct), `dopisek w pasku konta: «${acct}»`);
    const pastEl = scr().querySelector('.bt-ac-past');
    const probeC = (v) => { const e = document.createElement('span'); e.style.color = `var(${v})`; scr().querySelector('.bt-acct').append(e); const c = getComputedStyle(e).color; e.remove(); return c; };
    rec('wstecz', !!pastEl && parseFloat(getComputedStyle(pastEl).fontSize) >= 12 && getComputedStyle(pastEl).color === probeC('--warn'), `dopisek podglądu: ${pastEl && getComputedStyle(pastEl).fontSize}, kolor ostrzeżenia (${pastEl && getComputedStyle(pastEl).color} = ${probeC('--warn')})`);
    const dk = RP.dock();
    dk.setTab('pos'); await sleep(120);
    const lastCell = norm(scr().querySelector('.bt-dk-pos [data-c="last"]')?.textContent ?? '');
    rec('wstecz', lastCell === norm(pxText(hwPx)), `szuflada: cena pozycji ${lastCell} = ostatnia prawdziwa ${norm(pxText(hwPx))}`);
    dk.setTab('hist'); await sleep(120);
    rec('wstecz', scr().querySelectorAll('.bt-dk-hist tbody tr').length === 0, `trade zamknięty po kursorze nie jest w historii (${scr().querySelectorAll('.bt-dk-hist tbody tr').length} wierszy)`);
    dk.setTab('pos');
    await shot('r2-wstecz');
    // handel zablokowany z wyjaśnieniem i przyciskiem „Wróć do teraz”
    rec('wstecz', P('[data-o="buy"]').disabled && P('[data-o="sell"]').disabled, 'Kup i Sprzedaj nieaktywne');
    rec('wstecz', /Przeglądasz wstecz/.test(P('.bt-ord-note').textContent) && /NY/.test(P('.bt-ord-note').textContent), `wyjaśnienie z godziną: «${norm(P('.bt-ord-note').textContent)}»`);
    rec('wstecz', !P('[data-o="back"]').hidden && /Wróć do teraz/.test(P('[data-o="back"]').textContent), `przycisk: «${norm(P('[data-o="back"]').textContent)}»`);
    await rightClick(q(past + 3));
    rec('wstecz', itemIds().slice().sort().join() === 'back-now,jump-price', `menu przy przeglądaniu: tylko skok do ceny i Wróć do teraz (${itemIds().join(', ')})`);
    rec('wstecz', /^Wróć do teraz/.test(lab('back-now')), `pozycja powrotu: «${lab('back-now')}»`);
    item('back-now').click(); await settle();
    rec('wstecz', RP.cursor() === RP.book().hw && !menu(), `„Wróć do teraz” z menu wraca do znaku wodnego (${RP.cursor()} = ${RP.book().hw})`);
    await RP.goTo(nyAt('2024-03-12', '10:20')); await sleep(250);
    await closeMenu();
    P('[data-o="back"]').click(); await settle();
    rec('wstecz', RP.cursor() === RP.book().hw && /SHORT/i.test(ch().tradeLayer().textContent), 'po „Wróć do teraz” pozycja znów jest rysowana');
    rec('wstecz', JSON.stringify(RP.book()) === bookBefore && JSON.stringify(RP.doc().trades) === tradesBefore, `księga i trade'y po przeglądaniu i powrocie identyczne co przed (księga ${bookBefore.length} znaków, trade'y ${tradesBefore.length})`);
    rec('wstecz', !/Podgląd przeszłości/.test(norm(scr().querySelector('.bt-acct')?.textContent ?? '')), 'po powrocie dopisek znika');
    await closeAllNow();
  });

  // ---------- telefon: przytrzymanie otwiera menu, ruch przewija ----------
  if (narrow) await section('telefon', async () => {
    await closeAllNow();
    const hr = hostOf().getBoundingClientRect(), L = lastPx(), py = yOfPx(q(L + 3));
    const tp = (type, x, y) => document.elementFromPoint(x, y).dispatchEvent(new PointerEvent(type, { bubbles: true, cancelable: true, clientX: x, clientY: y, pointerId: 9, pointerType: 'touch', isPrimary: true, button: 0, buttons: type === 'pointerup' ? 0 : 1 }));
    const x0 = hr.left + 100;
    tp('pointerdown', x0, py); await sleep(250);
    rec('telefon', !menu(), 'po 250 ms menu jeszcze się nie otwiera');
    await sleep(350);
    rec('telefon', !!menu(), 'przytrzymanie 500 ms bez ruchu otwiera menu');
    tp('pointerup', x0, py); await sleep(60);
    rec('telefon', !!menu(), 'menu zostaje po puszczeniu palca');
    const mr = menu().getBoundingClientRect();
    rec('telefon', getComputedStyle(menu()).position === 'fixed' && Math.abs(mr.bottom - window.innerHeight) <= 2 && mr.left >= -1 && mr.right <= window.innerWidth + 1, `arkusz od dołu (fixed, dół ${Math.round(mr.bottom)} z ${window.innerHeight}, ${Math.round(mr.left)}–${Math.round(mr.right)})`);
    const h = hits([...menu().querySelectorAll('[data-mi]')]);
    rec('telefon', h.n >= 3 && h.bad.length === 0, `pozycje arkusza nie są przykryte (${h.n}; ${h.bad.join('; ')})`);
    await shot('menu-arkusz');
    await closeMenu();
    // ruch > 8 px przerywa: przewija wykres, menu się nie otwiera
    tp('pointerdown', x0, py); await sleep(100);
    tp('pointermove', x0 + 12, py); await sleep(600);
    tp('pointerup', x0 + 12, py); await sleep(60);
    rec('telefon', !menu(), 'ruch o 12 px przed 500 ms: menu się nie otwiera');
    // ruch ≤ 8 px nie przerywa
    tp('pointerdown', x0, py); await sleep(100);
    tp('pointermove', x0 + 5, py); await sleep(520);
    rec('telefon', !!menu(), 'drżenie o 5 px nie przerywa przytrzymania');
    tp('pointerup', x0 + 5, py); await closeMenu();
    // krótkie stuknięcie nie otwiera
    tp('pointerdown', x0, py); await sleep(80); tp('pointerup', x0, py); await sleep(600);
    rec('telefon', !menu(), 'krótkie stuknięcie nie otwiera menu');
    rec('telefon', document.documentElement.scrollWidth <= document.documentElement.clientWidth, 'bez poziomego przewijania strony');
    const ctl = [...scr().querySelectorAll('.bt-ctl [data-bt="back"], .bt-ctl [data-bt="step"], .bt-ctl [data-bt="stepmenu"], .bt-ctl [data-bt="play"]')];
    const hc = hits(ctl);
    rec('telefon', hc.n >= 3 && hc.bad.length === 0, `przyciski kroku nie są przykryte (${hc.n}; ${hc.bad.join('; ')})`);
  });

  out.textContent = JSON.stringify({ checks });
} catch (e) {
  out.textContent = JSON.stringify({ checks, fatal: String(e && e.stack || e) });
}
</script>
</body>
