<!doctype html>
<html lang="pl" data-theme="onyx">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<base href="/">
<title>JustJournal: handel i journaling jak w FX Replay L (strona robocza)</title>
<!-- Strona robocza testów backtest-L (testy/backtest-L-strona.mjs), Chrome/Edge headless przez CDP, tylko na dashboardzie testowym (THQ_TEST_PAGES=1) pod /__testy/.
     Prawdziwy replay (bt-replay.js, bt-zlecenia.js, bt-wykres.js, bt-szuflada.js, bt-journal-okno.js) na świecach syntetycznych: otwarty P&L na linii pozycji (z prowizją),
     pasek konta, szuflada, podgląd zlecenia i jednostki SL/TP, ryzyko % od bieżącego salda, zamknięcie 50% z linii, przeciąganie zlecenia oczekującego, Journal w klasycznym
     oknie (bez świec po zamknięciu trade'a, rysunki tylko w migawce trade'a), Ctrl+J. ?shot=replay|journal zostawia ekran do zrzutu, ?theme=platinum.
     Wynik: pre#wynik z JSON-em { checks: [{ tag, ok, msg }], fatal }. -->
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/features.css">
<style>
  body { margin: 0; background: var(--chrome); color: var(--fg); }
  #wynik { white-space: pre-wrap; font: 12px ui-monospace, Consolas, monospace; }
  body.shot #wynik { display: none; }
</style>
</head>
<body>
<pre id="wynik">…</pre>
<script type="module">
const out = document.getElementById('wynik');
const qs = new URLSearchParams(location.search);
const shot = qs.get('shot') || '';
if (shot) document.body.classList.add('shot');
if (qs.get('theme') === 'platinum') document.documentElement.setAttribute('data-theme', 'platinum');
const checks = [];
const rec = (tag, cond, msg) => checks.push({ tag, ok: !!cond, msg });
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const until = async (fn, ms = 6000) => { const t0 = performance.now(); while (performance.now() - t0 < ms) { const v = await fn(); if (v) return v; await sleep(20); } return null; };
window.addEventListener('error', (e) => rec('błąd strony', false, e.error?.stack || e.message));
window.addEventListener('unhandledrejection', (e) => rec('błąd strony', false, String(e.reason?.stack || e.reason)));
const section = async (tag, fn) => { try { await fn(); } catch (e) { rec(tag, false, `sekcja przerwana: ${e && e.stack || e}`); } };
const key = (k, extra = {}, target = document.body) => { const ev = new KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true, ...extra }); target.dispatchEvent(ev); return ev; };
const r2 = (x) => Math.round(x * 100) / 100 + 0;

try {
  try { localStorage.removeItem('thq.bt.open.v1'); localStorage.removeItem('thq.bt.dock.v1'); localStorage.setItem('thq.chart.overlays.v1', JSON.stringify({ sessions: false, pdhl: false })); } catch { /* bez localStorage */ }
  const { openReplay } = await import('/js/bt-replay.js');
  const { createSessionClient, newSessionId } = await import('/js/bt-klient.js');
  const { newSessionDoc } = await import('/js/bt-kreator.js');
  const { mergeBase, visibleCount } = await import('/js/bt-swieca.js');
  const { sizeFromRisk } = await import('/js/bt-wypelnienia.js');
  const { fmtMoney, fmtR } = await import('/js/format.js');
  const Z = await import('/__testy/bt-zgodnosc.js');
  const day0 = await Z.replayDay('2024-03-12', ['NQ']);
  const st = mergeBase(day0.inst.NQ.m1, day0.inst.NQ.s1, day0.inst.NQ.real1s);
  const client = createSessionClient();
  const COM = 2.5;
  // e2e na prawdziwych świecach (CPI): szerszy SL i większe ryzyko %, żeby pozycja dożyła sprawdzeń (?sl=60&risk=5); dane syntetyczne: 10 pkt i 1%
  const SL = Number(qs.get('sl') || 10), RISK = Number(qs.get('risk') || 1);
  const doc = newSessionDoc({
    id: newSessionId(), name: 'Sesja L konto i journal',
    def: { instruments: ['NQ'], from: '2024-03-12', balance: 50000, risk: { mode: 'pct', value: RISK }, riskBase: 'current', commission: COM, startTime: '09:00', accountId: null, filter: null, excluded: [] },
    now: Date.now(),
  });
  await client.create(doc);
  // wysyłka do Notion w atrapie klienta: ślad wywołań (serwer testowy nie ma Notion)
  const notionCalls = [];
  client.notion = async (o) => { notionCalls.push(o); return { sent: 0, skipped: 0, failed: [], pending: 0, notion: {} }; };
  const RP = openReplay(document.body, { sessionId: doc.id, client, onClosed: () => {}, notionEveryMs: 0 });
  await RP.ready;
  // M: API replayu dla pomiaru kosztu klatki (pomocnik zrzutów poza repo)
  window.__rp = RP;
  const scr = () => document.querySelector('.bt-screen');
  const P = (sel) => scr().querySelector(`.bt-ord ${sel}`);
  const ch = () => RP.chart();
  const lastClose = () => { const n = visibleCount(st, RP.cursor()); return st.bars[n - 1][4]; };
  const q = (x) => Math.round(x / 0.25) * 0.25;
  const setF = (n, v) => { const el = P(`[name="${n}"]`); el.value = String(v); el.dispatchEvent(new Event('input', { bubbles: true })); };
  const pos = () => RP.book().positions.NQ;
  const tagText = (k) => ch().tradeLayer().querySelector(`[data-k="${k}"] .bt-tag-t`)?.textContent || '';
  const acct = () => RP.accountState();
  const stepN = async (n) => { for (let i = 0; i < n; i++) { await RP.step(1); } await sleep(40); };
  // przejście do okna 1s (9:31 NY), interwał 1m
  // ?at=HH:MM (NY) dla e2e na prawdziwych świecach: start po fali CPI; domyślnie 9:31 NY w oknie 1s
  const at = /^\d{2}:\d{2}$/.test(qs.get('at') || '') ? (await import('/js/bt-czas.js')).nyAt('2024-03-12', qs.get('at')) : day0.times.open + 60;
  await RP.goTo(at); await sleep(80);

  if (!shot) {
    await section('pl', async () => {
      setF('sl', SL); setF('tp', 2 * SL); await sleep(30);
      const prev = P('.bt-ord-prev')?.textContent || '';
      const bal = acct().balance, riskUsd = bal * RISK / 100, qty = sizeFromRisk({ riskUsd, entry: SL, sl: 0, instrument: 'NQ' });
      rec('podglad', /Ryzyko/.test(prev) && prev.includes(fmtMoney(-SL * 20 * qty)) && /R:R 2/.test(prev) && prev.includes(`${qty} kontrakt`), `podgląd przed złożeniem: «${prev}» (${qty} kontr., 1% z ${bal})`);
      const pc = new Intl.NumberFormat('pl-PL', { maximumFractionDigits: 2 }).format((SL * 20 * qty / bal) * 100);
      rec('podglad', prev.includes(`(${pc}%)`), `ryzyko w % salda w podglądzie («${prev}», ${pc}%)`);
      P('[data-o="buy"]').click(); await sleep(60);
      const p = pos();
      rec('pl', p && p.qty === qty, `pozycja z ryzyka 1% bieżącego salda (${p?.qty} = ${qty})`);
      await stepN(5);
      const px = lastClose(), pts = px - p.entryPrice;
      const usd = r2(pts * 20 * p.qty - COM * p.qty), r = r2((pts * 20 * p.qty) / (SL * 20 * p.qty));
      const tx = tagText('pos');
      // odbiór wyglądu 1.7.0 P2-5: kwoty na plakietkach wykresu są w pełnych dolarach (połówka w górę)
      rec('pl', tx.includes(`LONG ${p.qty}`) && tx.includes(fmtMoney(Math.round(usd))) && tx.includes(fmtR(r)), `etykieta na linii pozycji: «${tx}» (ręcznie: ${pts} pkt, ${usd} $, ${r}R)`);
      const a = acct();
      rec('pl', a.upl === usd && a.equity === r2(a.balance + a.upl), `equity = saldo + otwarty (${a.equity} = ${a.balance} + ${a.upl}; ręcznie ${usd})`);
      const eq = scr().querySelector('.bt-acct [data-ac="eq"] b')?.textContent;
      rec('pl', eq === fmtMoney(Math.round(a.equity), { plus: false }), `pasek konta: equity ${eq}`);
      // przy każdym ruchu kursora
      const before = tagText('pos');
      await stepN(3);
      const px2 = lastClose(), usd2 = r2((px2 - p.entryPrice) * 20 * p.qty - COM * p.qty);
      rec('pl', tagText('pos').includes(fmtMoney(Math.round(usd2))) && (px2 === px || tagText('pos') !== before), `etykieta po kroku: «${tagText('pos')}» (${usd2})`);
    });

    await section('szuflada', async () => {
      const d = scr().querySelector('.bt-dock');
      rec('szuflada', d && !d.hidden && d.querySelector('[data-dk="pos"]')?.getAttribute('aria-selected') === 'true', 'szuflada widoczna, zakładka Pozycje');
      const row = d.querySelector('[data-row="NQ"]');
      const a = acct();
      rec('szuflada', row && row.querySelector('[data-c="usd"]').textContent === fmtMoney(Math.round(a.open[0].usd)), `wiersz pozycji: P&L ${row?.querySelector('[data-c="usd"]').textContent} (${a.open[0].usd})`);
      rec('szuflada', /R$/.test(row?.querySelector('[data-c="r"]').textContent || '') && / \/ /.test(row?.querySelector('[data-c="exc"]').textContent || ''), `R i MAE / MFE na żywo (${row?.querySelector('[data-c="r"]').textContent}, ${row?.querySelector('[data-c="exc"]').textContent})`);
      const b0 = row.querySelector('[data-dka="be"]');
      await stepN(1);
      rec('szuflada', row.isConnected && row.querySelector('[data-dka="be"]') === b0, 'wiersz nie jest przebudowywany przy kroku (kliknięcie w trakcie odtwarzania trafia)');
    });

    await section('procent', async () => {
      const p0 = pos(), q0 = p0.openQty;
      ch().tradeLayer().querySelector('[data-tl="x"]').click(); await sleep(40);
      const b50 = ch().tradeLayer().querySelector('[data-tl="pct"][data-pct="50"]');
      rec('procent', !!b50 && /50% · \d+ z \d+/.test(b50.textContent), `X na linii pozycji: menu 25/50/75/100% («${b50?.textContent}»)`);
      b50.click(); await sleep(60);
      const p1 = pos(), want = Math.min(q0, Math.max(1, Math.round(q0 / 2)));
      rec('procent', want < q0 ? p1 && p1.openQty === q0 - want && p1.exits[0].qty === want && p1.exits[0].reason === 'partial' : !p1, `zamknięcie 50% z linii: ${q0} → ${p1?.openQty} (wyjście ${p1?.exits?.[0]?.qty})`);
      const a = acct();
      rec('procent', a.realized !== 0 && a.balance === r2(50000 + a.realized), `częściowe wyjście w saldzie (${a.realized})`);
      // reszta: Zamknij w szufladzie
      scr().querySelector('.bt-dock [data-dka="close"]')?.click(); await sleep(80);
      rec('procent', !pos() && RP.doc().trades.length === 1, 'Zamknij w szufladzie: trade zapisany');
      const t1 = RP.doc().trades[0];
      rec('procent', t1.fee === r2(COM * t1.qty), `prowizja trade'a ${t1.fee} = ${COM} × ${t1.qty}`);
    });

    await section('journal-szybki', async () => {
      const jr = await until(() => scr().querySelector('.bt-jr'));
      rec('szybki', jr && !jr.querySelector('[name="notes"]') && !!jr.querySelector('[name="setup"]') && !!jr.querySelector('[data-jr="journal"]'), 'szybki panel: wynik, Setup i „Journal”, bez notatki');
      jr?.querySelector('[data-jr="skip"]')?.click(); await sleep(40);
      rec('szybki', /Do opisania: 1/.test(scr().querySelector('.bt-todo').textContent), `pasek: «${scr().querySelector('.bt-todo').textContent}»`);
    });

    await section('ryzyko', async () => {
      // bieżące saldo po stracie/zysku: 1% od niego
      const bal = acct().balance;
      setF('sl', SL); setF('tp', ''); await sleep(30);
      P('[data-o="sell"]').click(); await sleep(60);
      const p = pos(), want = sizeFromRisk({ riskUsd: r2(bal * RISK / 100), entry: SL, sl: 0, instrument: 'NQ' });
      rec('ryzyko', p && p.qty === want && bal !== 50000, `ryzyko ${RISK}% od bieżącego salda ${bal}: ${p?.qty} kontr. (oczekiwane ${want})`);
      await stepN(2);
      const px = lastClose(), usd = r2((p.entryPrice - px) * 20 * p.qty - COM * p.qty);
      rec('ryzyko', tagText('pos').startsWith(`SHORT ${p.qty}`) && tagText('pos').includes(fmtMoney(Math.round(usd))), `short: «${tagText('pos')}» (${usd})`);
      P('[data-o="close"]').click(); await sleep(80);
      scr().querySelector('.bt-jr [data-jr="skip"]')?.click(); await sleep(30);
    });

    await section('jednostki', async () => {
      setF('sl', 10); await sleep(20);
      P('[data-unit="tick"]').click(); await sleep(20);
      rec('jednostki', P('[name="sl"]').value === '40' && /ticki/.test(P('.bt-sl-l').textContent), `punkty → ticki: ${P('[name="sl"]').value}`);
      P('[data-unit="px"]').click(); await sleep(20);
      const e = lastClose();
      // strona dla ceny: ostatnio złożona (sekcja „ryzyko”: sprzedaż, więc SL nad wejściem)
      const sgn = RP.doc().trades[RP.doc().trades.length - 1].dir === 'Short' ? 1 : -1;
      rec('jednostki', Number(P('[name="sl"]').value) === e + sgn * 10, `ticki → cena: ${P('[name="sl"]').value} (wejście ${e}, strona ostatniego zlecenia)`);
      P('[data-unit="pt"]').click(); await sleep(20);
      rec('jednostki', P('[name="sl"]').value === '10', `cena → punkty: ${P('[name="sl"]').value}`);
    });

    await section('zlecenie', async () => {
      const px = q(lastClose());
      P('[data-ot="limit"]').click(); await sleep(20);
      setF('price', px - 6); setF('sl', 10); setF('tp', 20); await sleep(20);
      P('[data-o="buy"]').click(); await sleep(80);
      const o = RP.book().orders[0];
      rec('zlecenie', o && o.price === px - 6 && o.sl === px - 16 && o.tp === px + 14, `buy limit z SL i TP (${JSON.stringify(o && [o.price, o.sl, o.tp])})`);
      const L = ch().tradeLayer();
      const tag = L.querySelector(`[data-k="o:${o.id}:price"]`), slTag = L.querySelector(`[data-k="o:${o.id}:sl"]`);
      rec('zlecenie', tag && !tag.hidden && slTag && L.querySelector(`[data-k="o:${o.id}:tp"]`), 'etykiety zlecenia, SL i TP na wykresie');
      // przeciągnięcie etykiety zlecenia w pionie do ceny px − 9
      const target = px - 9;
      const r = ch().tradeLayer().getBoundingClientRect();
      const y0 = tag.getBoundingClientRect().top + tag.offsetHeight / 2, x0 = tag.getBoundingClientRect().left + 10;
      const y1 = r.top + ch().series.priceToCoordinate(target);
      const pe = (type, y) => tag.dispatchEvent(new PointerEvent(type, { bubbles: true, cancelable: true, pointerId: 7, button: 0, buttons: type === 'pointerup' ? 0 : 1, clientX: x0, clientY: y, pointerType: 'mouse' }));
      pe('pointerdown', y0); pe('pointermove', (y0 + y1) / 2); pe('pointermove', y1); pe('pointerup', y1); await sleep(80);
      const o2 = RP.book().orders[0];
      rec('zlecenie', o2 && Math.abs(o2.price - target) <= 0.5 && o2.sl === o.sl && o2.tp === o.tp, `przeciągnięte zlecenie: ${o.price} → ${o2?.price} (cel ${target}), SL/TP bez zmian`);
      const disk = await (await fetch(`/api/backtest/session/${doc.id}`, { cache: 'no-store' })).json();
      rec('zlecenie', (disk.doc || disk).book.orders[0]?.price === o2.price, 'przesunięcie zapisane w pliku sesji');
      // SL zlecenia strzałką w dół (o tick), klawiatura
      const sl0 = o2.sl;
      const slEl = ch().tradeLayer().querySelector(`[data-k="o:${o.id}:sl"]`);
      slEl.focus(); key('ArrowDown', {}, slEl); await sleep(60);
      rec('zlecenie', RP.book().orders[0].sl === sl0 - 0.25, `SL zlecenia strzałką: ${sl0} → ${RP.book().orders[0].sl}`);
      // za rynek: odrzucone, zlecenie bez zmian
      const pr = RP.book().orders[0].price;
      RP.orders().moveOrder(o.id, { price: px + 20 }); await sleep(30);
      rec('zlecenie', RP.book().orders[0].price === pr && /złej stronie/.test(P('.bt-ord-note').textContent), `limit nad rynkiem odrzucony («${P('.bt-ord-note').textContent}»)`);
      // anulowanie z szuflady
      scr().querySelector('.bt-dock [data-dk="ord"]').click(); await sleep(30);
      scr().querySelector(`.bt-dock [data-dka="cancel"][data-id="${o.id}"]`)?.click(); await sleep(60);
      rec('zlecenie', !RP.book().orders.length, 'Anuluj w szufladzie');
      P('[data-ot="market"]').click();
      scr().querySelector('.bt-dock [data-dk="pos"]').click();
    });

    await section('journal', async () => {
      // trade z rysunkiem sesji, potem dalej o kilka minut: Journal nie może pokazać świec po zamknięciu trade'a
      const M = ch().rysunki().manager, b = ch().bars(), tl = b[b.length - 1][0];
      const sessId = M.add({ kind: 'horizontal-line', points: [{ time: tl, price: lastClose() }], style: {} });
      await sleep(250);
      setF('sl', SL); setF('tp', 3 * SL);
      P('[data-o="buy"]').click(); await sleep(50);
      await stepN(2);
      P('[data-o="close"]').click(); await sleep(80);
      scr().querySelector('.bt-jr [data-jr="skip"]')?.click(); await sleep(20);
      const tr = RP.doc().trades[RP.doc().trades.length - 1];
      // [U] 04.11.2026 «ale jak zapisuje trade i journaluje jeszcze podczas jak nie poznalem przyszlych swiec w backtestingowej sesji to nnie powinny mi sie ujawniac wtedy»: Journal otwarty zaraz po zamknięciu nie ma świec po wyjściu
      key('j', { ctrlKey: true });
      const jw0 = await until(() => document.querySelector('.bt-jw'));
      const W0 = RP.journalWindow();
      await W0.ready;
      const pv0 = await until(() => (W0.view()?.status?.() === 'ok' ? W0.view() : null), 8000);
      const cs0 = pv0 ? pv0.candles() : [];
      rec('journal', !!jw0 && cs0.length > 10 && cs0.every((k) => k[0] < tr.exitT), `Journal zaraz po zamknięciu bez świec po wyjściu (${cs0.length} świec, ostatnia ${cs0[cs0.length - 1]?.[0]}, wyjście ${tr.exitT})`);
      W0.close(); await sleep(80);
      await stepN(12);
      const sessBefore = JSON.stringify(RP.drawings().docOf('NQ').d);
      rec('journal', (tr.drawings?.d || []).some((x) => x.id === sessId), 'migawka rysunków przy zamknięciu');
      RP.play(); await sleep(60);
      key('j', { ctrlKey: true });
      const jw = await until(() => document.querySelector('.bt-jw'));
      rec('journal', !!jw && RP.journalWindow()?.tradeId() === tr.id, `Ctrl+J: klasyczne okno trade'a ${RP.journalWindow()?.tradeId()}`);
      rec('journal', scr().querySelector('[data-bt="play"]').getAttribute('aria-pressed') === 'false', 'replay zatrzymany');
      const W = RP.journalWindow();
      await W.ready;
      const pv = await until(() => (W.view()?.status?.() === 'ok' ? W.view() : null), 8000);
      const cs = pv ? pv.candles() : [];
      const maxT = tr.exitT; // wyjście ręczne: koniec ostatniej widocznej świecy bazowej
      // [U] 04.11.2026 «niech journal w backtestingu ma wlasnie dostep podczas wyswietlania trade'a swiece nie do momentu wyjscia tylko jeszcze troche po»: po przesunięciu sesji o 12 świec Journal pokazuje świece po wyjściu, ale nie dalej niż znak wodny (sesja ich nie pokazała)
      const hwNow = RP.book().hwi?.NQ ?? RP.book().hw;
      rec('journal', cs.length > 10 && cs.some((k) => k[0] >= maxT) && cs.every((k) => k[0] < hwNow) && RP.cursor() > maxT + 300, `wykres Journala ze świecami po zamknięciu do znaku wodnego (${cs.length} świec, ostatnia ${cs[cs.length - 1]?.[0]}, zamknięcie ${maxT}, znak wodny ${hwNow}, kursor ${RP.cursor()})`);
      const last = cs[cs.length - 1];
      const tf = pv.state().tf, sec = { '1m': 60, '15s': 15, '5m': 300 }[tf] || 60;
      rec('journal', last && last[0] + sec >= hwNow - sec * 2, `ostatnia świeca przy znaku wodnym (${tf}: ${last?.[0]} vs ${hwNow})`);
      rec('journal', !!jw.querySelector('.lb-top .lb-count') && !!jw.querySelector('.lb-facts') && !!jw.querySelector('[name="notes"]') && !!jw.querySelector('.swc-edit'), 'okno: licznik, fakty, notatka, „Edytuj wykres”');
      // skróty replayu wyłączone przy otwartym Journalu
      const c0 = RP.cursor();
      key('ArrowRight', { shiftKey: true }); key(' '); await sleep(60);
      rec('journal', RP.cursor() === c0, 'skróty replayu nie działają w Journalu');
      // edycja rysunków: tylko migawka trade'a
      await W.startEdit();
      const ed = await until(() => (W.editing() ? W.view() : null), 8000);
      rec('journal', !!ed && !document.querySelector('.bt-jw .swc-tools [data-act="lock"]:not([hidden])'), 'edytor wykresu bez kłódki pozycji');
      if (ed) {
        const eb = ed.trade();
        const nid = ed.manager.add({ kind: 'horizontal-line', points: [{ time: Math.floor(eb.at / 1000), price: eb.entryPrice + 3 }], style: {} });
        await sleep(50); await ed.rys.flush(); await sleep(50);
        const tr2 = RP.doc().trades.find((x) => x.id === tr.id);
        rec('journal', (tr2.drawings?.d || []).some((x) => x.id === nid) && tr2.dEdited > 0, 'rysunek z Journala w migawce trade\'a');
        rec('journal', JSON.stringify(RP.drawings().docOf('NQ').d) === sessBefore && !RP.drawings().docOf('NQ').d.some((x) => x.id === nid), 'rysunki sesji bez zmian');
        document.querySelector('.bt-jw .swc-done')?.click();
        await until(() => !W.editing() && W.view()?.status?.() === 'ok', 6000);
      }
      // setup i notatka
      const jf = (n) => document.querySelector(`.bt-jw [name="${n}"]`);
      jf('setup').value = 'Pullback'; jf('notes').value = 'opis w Journalu';
      document.querySelector('.bt-jw [data-jw="save"]').click(); await sleep(60);
      const tr3 = RP.doc().trades.find((x) => x.id === tr.id);
      rec('journal', tr3.setup === 'Pullback' && tr3.notes === 'opis w Journalu' && tr3.journal === 'done' && tr3.jEdited > 0, 'zapis Setup i notatki w Journalu');
      const n0 = notionCalls.length;
      document.querySelector('.bt-jw [data-jw="close"]').click(); await sleep(120);
      rec('journal', !document.querySelector('.bt-jw') && notionCalls.length > n0, `zamknięcie: wysyłka zmian do Notion w tle (${notionCalls.length - n0})`);
      const c1 = RP.cursor(); key('ArrowRight', { shiftKey: true }); await sleep(80);
      rec('journal', RP.cursor() > c1, 'po zamknięciu skróty replayu wracają');
      // [U] 04.11.2026 «ale jak zapisuje trade i journaluje jeszcze podczas jak nie poznalem przyszlych swiec w backtestingowej sesji to nnie powinny mi sie ujawniac wtedy»: kursor cofnięty poniżej znaku wodnego: sesja te świece już pokazała, więc Journal pokazuje je do znaku wodnego (nie do kursora) i nic dalej
      {
        await stepN(3);
        const hwB = RP.book().hwi?.NQ ?? RP.book().hw;
        const back = tr.exitT + 120;
        await RP.goTo(back); await sleep(120);
        rec('journal', RP.cursor() < hwB - 60 && (RP.book().hwi?.NQ ?? RP.book().hw) === hwB, `cofnięcie: kursor ${RP.cursor()} poniżej znaku wodnego ${hwB}, który się nie zmienia`);
        RP.openJournalWindow(tr.id);
        await until(() => document.querySelector('.bt-jw'));
        const WB = RP.journalWindow();
        await WB.ready;
        const pvB = await until(() => (WB.view()?.status?.() === 'ok' ? WB.view() : null), 8000);
        const csB = pvB ? pvB.candles() : [];
        const lastB = csB[csB.length - 1], secB = { '1m': 60, '15s': 15, '5m': 300 }[pvB?.state().tf] || 60;
        rec('journal', csB.length > 10 && csB.every((k) => k[0] < hwB) && lastB[0] > back, `po cofnięciu świece do znaku wodnego, nie dalej (ostatnia ${lastB?.[0]}, kursor ${RP.cursor()}, znak wodny ${hwB})`);
        rec('journal', lastB && lastB[0] + secB >= hwB - secB * 2, `po cofnięciu ostatnia świeca przy znaku wodnym, a nie przy kursorze (${lastB?.[0]} vs ${hwB})`);
        WB.close(); await sleep(80);
        await RP.goTo(hwB); await sleep(120);
      }
      // Historia: stan i Journal
      scr().querySelector('.bt-dock [data-dk="hist"]').click(); await sleep(30);
      const hr = scr().querySelector(`.bt-dock [data-row="${tr.id}"]`);
      rec('journal', hr && /opisany|wysłany|zmieniony/.test(hr.textContent) && !!hr.querySelector('[data-dka="journal"]'), `Historia: stan i Journal («${hr?.querySelector('.bt-st-j')?.textContent}»)`);
      hr?.querySelector('[data-dka="journal"]').click();
      const jw2 = await until(() => document.querySelector('.bt-jw'));
      rec('journal', !!jw2, 'Journal z Historii');
      key('Escape'); await sleep(80);
      rec('journal', !document.querySelector('.bt-jw'), 'Escape zamyka Journal');
      scr().querySelector('.bt-dock [data-dk="pos"]').click();
    });
  } else {
    // ---- sceny do zrzutów: replay = otwarta pozycja z wynikiem i zamknięty trade w historii; zlecenie = zlecenie oczekujące z SL/TP (przy otwartej pozycji
    // silnik nie przyjmuje zleceń na tym instrumencie, 18a.3); journal = okno Journala zamkniętego trade'a ----
    setF('sl', 10); setF('tp', 20);
    // M: start = pusty replay z wpisanym SL/TP (przed wejściem), panel = szybki panel po zamknięciu trade'a
    if (shot === 'start') { RP.orders().refresh(); await sleep(300); out.textContent = JSON.stringify({ checks }); throw 'shot'; }
    P('[data-o="buy"]').click(); await sleep(40);
    await stepN(3);
    P('[data-o="close"]').click(); await sleep(60);
    if (shot === 'panel') { await sleep(500); out.textContent = JSON.stringify({ checks }); throw 'shot'; }
    scr().querySelector('.bt-jr [data-jr="skip"]')?.click();
    await stepN(2);
    if (shot === 'zlecenie') {
      const px = q(lastClose());
      P('[data-ot="limit"]').click(); setF('price', px + 6); setF('sl', 8); setF('tp', 16);
      RP.orders().submit('sell'); await sleep(20);
      scr().querySelector('.bt-dock [data-dk="ord"]').click();
    } else if (shot === 'journal-po') {
      // 30 świec po wyjściu: Journal pokazuje reakcję rynku po trade'zie (do znaku wodnego)
      await stepN(28);
    } else {
      P('[data-o="buy"]').click(); await sleep(40);
      await stepN(4);
    }
    RP.orders().refresh();
    await sleep(300);
    if (shot === 'journal' || shot === 'journal-po') {
      RP.openJournalWindow(RP.doc().trades[0].id);
      await until(() => RP.journalWindow()?.view()?.status?.() === 'ok', 8000);
      await sleep(400);
    }
  }
  out.textContent = JSON.stringify({ checks });
} catch (e) {
  if (e !== 'shot') out.textContent = JSON.stringify({ checks, fatal: String(e && e.stack || e) });
}
</script>
</body>
</html>
