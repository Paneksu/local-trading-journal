<!doctype html>
<html lang="pl" data-theme="onyx">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<base href="/">
<title>JustJournal: dokładanie i odwracanie 1.7-2, odbiór na prawdziwych świecach</title>
<!-- Strona odbioru 1.7-2 (testy/backtest-e2e.mjs, sekcja `172`): prawdziwe świece NQ 1s od 10:30 NY (CPI 2024-03-12), serwer z atrapą Notion. Przebieg: wejście 2 z SL → dokładka 2 limit (czekanie na wypełnienie)
     → wyjście częściowe 2 → dokładka 1 market → BE (przycisk aktywny albo nieaktywny z powodem; obie gałęzie coś sprawdzają) → zamknięcie → trade z średnimi cenami i wynikiem zgodnym z niezmiennikiem
     → atrapa Notion (jedna strona, średnia cena wejścia i wyjścia, P&L, R). Potem odwrócenie i odtwarzanie 100× z pozycją z trzema dokładkami (markery, szuflada rozwinięta): najwyżej 1% klatek dłuższych niż 34 ms i żadna dłuższa niż 100 ms.
     Wynik: pre#wynik z JSON-em { checks: [{ tag, ok, msg }], info, fatal }. Każda asercja może zawieść. -->
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/features.css">
<style>
  body { margin: 0; background: var(--chrome); color: var(--fg); }
  #wynik { white-space: pre-wrap; font: 12px ui-monospace, Consolas, monospace; }
</style>
</head>
<body>
<pre id="wynik">…</pre>
<script type="module">
const out = document.getElementById('wynik');
const checks = [], info = {};
const rec = (tag, cond, msg) => checks.push({ tag, ok: !!cond, msg });
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
window.addEventListener('error', (e) => rec('błąd strony', false, e.error?.stack || e.message));
window.addEventListener('unhandledrejection', (e) => rec('błąd strony', false, String(e.reason?.stack || e.reason)));
const section = async (tag, fn) => { try { await fn(); } catch (e) { rec(tag, false, `sekcja przerwana: ${e && e.stack || e}`); } };

try {
  try { localStorage.removeItem('thq.bt.open.v1'); localStorage.removeItem('thq.bt.dock.v1'); localStorage.removeItem('thq.bt.ord.v1'); localStorage.setItem('thq.chart.overlays.v1', JSON.stringify({ sessions: false, pdhl: false })); } catch { /* bez localStorage */ }
  const { openReplay } = await import('/js/bt-replay.js');
  const { createSessionClient, newSessionId } = await import('/js/bt-klient.js');
  const { newSessionDoc } = await import('/js/bt-kreator.js');
  const { nyAt } = await import('/js/bt-czas.js');
  const W = await import('/js/bt-wypelnienia.js');
  const DAY = '2024-03-12';
  const client = createSessionClient();
  const doc = newSessionDoc({
    id: newSessionId(), name: 'Sesja 172 odbiór',
    def: { instruments: ['NQ'], from: DAY, balance: 50000, risk: { mode: 'pct', value: 5 }, riskBase: 'current', commission: 0, startTime: '09:00', accountId: null, filter: null, excluded: [] },
    now: Date.now(),
  });
  doc.layout = { kind: '1', active: 0, charts: [{ instrument: 'NQ', tf: '1s' }] };
  await client.create(doc);
  const RP = openReplay(document.body, { sessionId: doc.id, client, onClosed: () => {}, notionEveryMs: 0 });
  await RP.ready;
  info.sessionId = doc.id;
  const scr = () => document.querySelector('.bt-screen');
  const P = (sel) => scr().querySelector(`.bt-ord ${sel}`);
  const setF = (n, v) => { const el = P(`[name="${n}"]`); el.value = String(v); el.dispatchEvent(new Event('input', { bubbles: true })); };
  const pos = () => RP.book().positions.NQ;
  const ch = () => RP.chart();
  const q = (x) => Math.round(x / 0.25) * 0.25;
  const lastPx = () => { const b = ch().bars(); return b[b.length - 1][4]; };
  const stepN = async (n) => { for (let i = 0; i < n; i++) await RP.step(1); await sleep(40); };
  const focusTag = (k) => { const el = ch().tradeLayer().querySelector(`[data-k="${k}"]`); el.focus(); el.dispatchEvent(new FocusEvent('focusin', { bubbles: true })); };

  await RP.goTo(nyAt(DAY, '10:30')); await sleep(120);

  await section('przebieg', async () => {
    // 1) wejście 2 z SL 40 pkt
    setF('sl', 40); setF('tp', ''); setF('qty', 2);
    RP.orders().submit('buy'); await sleep(80);
    rec('przebieg', !!pos() && pos().qty === 2 && pos().sl === q(pos().entryPrice - 40), `wejście Long 2, SL ${pos()?.sl}`);
    await stepN(3);
    // 2) dokładka 2 limit tuż pod ceną: czekamy na dotknięcie (maks. 600 s odtwarzania), SL pozycji 40 pkt niżej
    P('[data-ot="limit"]').click();
    const lim = q(lastPx() - 0.25);
    setF('price', lim); setF('qty', 2);
    P('[data-o="buy"]').click(); await sleep(80);
    rec('przebieg', RP.book().orders.length === 1 && RP.book().orders[0].intent === 'add' && RP.book().orders[0].price === lim, `dokładka limit 2 @ ${lim} czeka (intent ${RP.book().orders[0]?.intent})`);
    for (let i = 0; i < 600 && RP.book().orders.length && pos(); i++) await RP.step(1);
    await sleep(60);
    rec('przebieg', !!pos() && RP.book().orders.length === 0 && pos().fills.length === 2 && pos().fills[1].price === lim && pos().qty === 4, `dokładka wypełniona @ ${pos()?.fills[1]?.price} (porcji ${pos()?.fills.length})`);
    P('[data-ot="market"]').click();
    // 3) wyjście częściowe 2
    RP.orders().closeQty('NQ', 2); await sleep(80);
    rec('przebieg', pos().openQty === 2 && pos().exits.length === 1 && pos().exits[0].reason === 'partial' && pos().exits[0].qty === 2, `wyjście częściowe 2 (openQty ${pos()?.openQty})`);
    // 4) dokładka 1 market po wyjściu: średnia po średnim koszcie
    const avgBefore = pos().avg;
    setF('qty', 1); P('[data-o="buy"]').click(); await sleep(100);
    const px3 = pos().fills[2].price;
    rec('przebieg', pos().qty === 5 && pos().openQty === 3 && pos().fills.length === 3 && Math.abs(pos().avg - (2 * avgBefore + px3) / 3) < 1e-6, `dokładka 1 market @ ${px3}: średnia ${avgBefore} → ${pos().avg}`);
    await stepN(5);
    // 5) BE: aktywne tylko po stronie zysku względem średniej; obie gałęzie coś sprawdzają
    focusTag('pos'); await sleep(30);
    const be = ch().tradeLayer().querySelector('[data-tl="be"]'), st = W.beState(RP.book(), 'NQ', { price: lastPx() });
    if (st.ok) {
      rec('przebieg', !be.disabled, 'BE aktywne po stronie zysku (przycisk)');
      be.click(); await sleep(80);
      rec('przebieg', pos().be === true && pos().sl === W.beLevel(pos()), `BE ustawione na poziomie ${pos().sl} (średnia ${pos().avg})`);
      info.beSet = true;
    } else {
      rec('przebieg', be.disabled && be.title.length > 0 && st.why === (pos().dir === 'Long' ? 'below' : 'above'), `BE nieaktywne z powodem ${st.why}: «${be.title}»`);
      info.beSet = false;
    }
    // 6) zamknięcie i niezmiennik wyniku
    RP.orders().closeAll(); await sleep(200);
    const tr = RP.doc().trades.at(-1);
    rec('przebieg', !pos() && tr && tr.fills.length === 3 && tr.exits.length >= 2 && tr.qty === 5, `trade ${tr?.id}: ${tr?.fills.length} wejścia, ${tr?.exits.length} wyjść`);
    // niezależny wzorzec: średni koszt liczony tutaj od zera ze zdarzeń trade'a
    const ev = [...tr.fills.map((f) => ({ k: 0, t: f.t, s: f.seq, f })), ...tr.exits.map((e) => ({ k: 1, t: e.t, s: e.seq, e }))].sort((a, b) => a.t - b.t || a.s - b.s);
    let oq = 0, oavg = 0, real = 0;
    for (const x of ev) { if (x.k === 0) { oavg = oq > 0 ? (oq * oavg + x.f.qty * x.f.price) / (oq + x.f.qty) : x.f.price; oq += x.f.qty; } else { real += (x.e.price - oavg) * x.e.qty * 20; oq -= x.e.qty; } }
    rec('przebieg', Math.abs(real - tr.pnl) <= 0.01, `P&L trade'a ${tr.pnl} = wynik po średnim koszcie ${real.toFixed(2)}`);
    const inQ = tr.fills.reduce((a, f) => a + f.qty, 0), inAvg = tr.fills.reduce((a, f) => a + f.qty * f.price, 0) / inQ;
    const outQ = tr.exits.reduce((a, e) => a + e.qty, 0), outAvg = tr.exits.reduce((a, e) => a + e.qty * e.price, 0) / outQ;
    rec('przebieg', Math.abs(tr.entryPrice - inAvg) < 1e-5 && Math.abs(tr.exitPrice - outAvg) < 1e-5 && Math.abs((outAvg - inAvg) * inQ * 20 - tr.pnl) <= 0.02, `średnia wejścia ${tr.entryPrice}, wyjścia ${tr.exitPrice}: (wy − we)·Q·20 = ${((outAvg - inAvg) * inQ * 20).toFixed(2)} wobec ${tr.pnl}`);
    rec('przebieg', Number.isFinite(tr.r) && tr.rUsd > 0 && Math.abs(tr.r - Math.round((real / tr.rUsd) * 100) / 100) < 0.011, `R ${tr.r} z rUsd ${tr.rUsd}`);
    info.trades = [{ id: tr.id, r: tr.r, pnl: tr.pnl, entryPrice: tr.entryPrice, exitPrice: tr.exitPrice, sl0: tr.sl0 }];
    // wysyłka idzie sama zaraz po zamknięciu ([U] 31.10.2026 «od razu»); ręczne wywołanie mogłoby zbiec się z nią, więc czekamy na stan trade'a
    for (let i = 0; i < 100 && RP.doc().trades.find((x) => x.id === tr.id)?.notion?.state !== 'sent'; i++) await sleep(50);
    rec('przebieg', RP.doc().trades.find((x) => x.id === tr.id)?.notion?.state === 'sent', `trade ${tr.id} w atrapie Notion (stan ${RP.doc().trades.find((x) => x.id === tr.id)?.notion?.state})`);
    info.sentIds = [tr.id];
  });

  await section('odwrocenie', async () => {
    setF('sl', 40); setF('tp', ''); setF('qty', 3);
    RP.orders().submit('buy'); await sleep(80);
    const n0 = RP.doc().trades.length;
    RP.orders().reverseFor('NQ'); await sleep(200);
    const t1 = RP.doc().trades.at(-1);
    rec('odwrocenie', RP.doc().trades.length === n0 + 1 && t1.exits.at(-1).reason === 'reverse' && pos()?.dir === 'Short' && pos().qty === 3 && pos().reverseOf === t1.id, `odwrócenie: trade ${t1.id} zamknięty, Short 3 otwarty (reverseOf ${pos()?.reverseOf})`);
    // [U] 31.10.2026 «od razu»: zamknięty trade idzie do Notion sam, bez ręcznej wysyłki (czekamy najwyżej 4 s na odpowiedź atrapy)
    for (let i = 0; i < 80 && RP.doc().trades.find((x) => x.id === t1.id)?.notion?.state !== 'sent'; i++) await sleep(50);
    rec('odwrocenie', RP.doc().trades.find((x) => x.id === t1.id)?.notion?.state === 'sent' && !!RP.doc().trades.find((x) => x.id === t1.id)?.notion?.id, `zamknięty trade ${t1.id} sam trafił do atrapy Notion (stan ${RP.doc().trades.find((x) => x.id === t1.id)?.notion?.state})`);
    info.sentIds.push(t1.id);
    RP.orders().closeAll(); await sleep(200);
    const t2 = RP.doc().trades.at(-1);
    rec('odwrocenie', t2.reverseOf === t1.id && RP.doc().trades.find((x) => x.id === t1.id).reversedTo === t2.id, `trade ${t2.id}: reverseOf ${t2.reverseOf}`);
    for (let i = 0; i < 100 && RP.doc().trades.find((x) => x.id === t2.id)?.notion?.state !== 'sent'; i++) await sleep(50);
    rec('odwrocenie', RP.doc().trades.find((x) => x.id === t2.id)?.notion?.state === 'sent', `nowy trade ${t2.id} po swoim zamknięciu w atrapie Notion (stan ${RP.doc().trades.find((x) => x.id === t2.id)?.notion?.state})`);
    info.sentIds.push(t2.id);
    info.trades.push({ id: t1.id, r: t1.r, pnl: t1.pnl, entryPrice: t1.entryPrice, exitPrice: t1.exitPrice, sl0: t1.sl0 }, { id: t2.id, r: t2.r, pnl: t2.pnl, entryPrice: t2.entryPrice, exitPrice: t2.exitPrice, sl0: t2.sl0 });
  });

  await section('klatki', async () => {
    // odtwarzanie 100× z pozycją z trzema dokładkami (4 porcje), wyjściem częściowym, markerami i rozwiniętą szufladą: 0 klatek > 34 ms
    setF('sl', 400); setF('tp', 800); setF('qty', 2);
    RP.orders().submit('buy'); await sleep(100);
    setF('qty', 1);
    for (let i = 0; i < 3; i++) { await stepN(2); P('[data-o="buy"]').click(); await sleep(80); }
    RP.orders().closeQty('NQ', 1); await sleep(60);
    rec('klatki', !!pos() && pos().fills.length === 4 && pos().qty === 5 && pos().openQty === 4 && pos().exits.length === 1, `pozycja 4 z 5 po czterech wejściach i wyjściu (porcji ${pos()?.fills.length})`);
    RP.dock().setTab('pos'); await sleep(80);
    RP.dock().el.querySelector('[data-dka="expand"]')?.click(); await sleep(80);
    rec('klatki', ch().fillMarks().length === 5 && !!RP.dock().el.querySelector('.bt-dk-det'), `markery: ${ch().fillMarks().length}, szuflada rozwinięta`);
    const end = nyAt(DAY, '11:00');
    RP.setSpeed(100);
    const ts = [], t0 = performance.now();
    await new Promise((done) => {
      const loop = (t) => {
        ts.push(t);
        if (RP.cursor() >= end || !pos() || performance.now() - t0 > 90000) { RP.pause(); done(); return; }
        requestAnimationFrame(loop);
      };
      RP.play();
      requestAnimationFrame(loop);
    });
    const gaps = []; for (let i = 11; i < ts.length; i++) gaps.push(ts[i] - ts[i - 1]);
    const slow = gaps.filter((g) => g > 34).length, worst = Math.max(...gaps, 0);
    info.frames = gaps.length; info.slow = slow; info.worst = worst;
    rec('klatki', gaps.length > 30, `odtwarzanie zmierzyło ${gaps.length} klatek`);
    rec('klatki', !!pos(), 'pozycja przeżyła odtwarzanie (SL 400 pkt)');
    // świadome odstępstwo od karty („0 klatek”): konwencja repo z pakietu 1 (§9, decyzja sesji głównej 2.11.2026): ≤ 1% klatek > 34 ms i żadna klatka > 100 ms
    rec('klatki', slow / gaps.length <= 0.01, `klatki > 34 ms: ${slow} z ${gaps.length} (próg 1%); najdłuższa ${worst.toFixed(1)} ms`);
    rec('klatki', worst <= 100, `żadna klatka > 100 ms (najdłuższa ${worst.toFixed(1)} ms)`);
  });

  out.textContent = JSON.stringify({ checks, info });
} catch (e) {
  out.textContent = JSON.stringify({ checks, info, fatal: String(e && e.stack || e) });
}
</script>
</body>
</html>
